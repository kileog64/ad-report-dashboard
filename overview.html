<style>
  :root{
    --bg:#0d0e15; --panel:#171829; --panel-2:#1d1f33; --border:#33354a;
    --text:#f5f6fa; --muted:#a8abc4; --up:#4ade9a; --down:#ff6b85; --accent:#8b7cff; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 10% 0%,#191a2c 0%,var(--bg) 45%);color:var(--text);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:1480px;margin:0 auto;padding:28px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;}
  .btn{border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:7px;}
  .btn-accent{background:linear-gradient(135deg,var(--accent),#a89aff);color:#fff;}
  .status-msg{font-size:12.5px;margin-top:11px;padding:10px 12px;border-radius:8px;background:var(--panel-2);color:var(--muted);display:none;line-height:1.5;}
  .status-msg.show{display:block;}
  .status-msg.err{color:var(--down);}
  .export-btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;}
  .panel{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .panel-title{font-size:15.5px;font-weight:700;margin-bottom:14px;color:var(--text);}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:280px;color:var(--muted);font-size:14px;text-align:center;gap:10px;line-height:1.6;}

  /* ---- 상단 요약 통계 ---- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .stat-card .val{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:-.01em;}

  /* ---- 필터바 ---- */
  .filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .biz-tab{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .biz-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(139,124,255,.12);}
  .search-input{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13.5px;color:var(--text);min-width:200px;}
  .search-input:focus{outline:none;border-color:var(--accent);}
  .sort-select{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--text);}

  /* ---- 카드 그리드 ---- */
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .client-card{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;}
  .client-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .client-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .client-card-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0;}
  .client-card-name{font-size:15.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
  .client-card-biz{font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.08);padding:2px 8px;border-radius:10px;margin-top:3px;display:inline-block;}
  .client-card-period{font-size:11px;color:var(--muted);margin-top:3px;}
  .client-card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .client-card-metric .m{font-size:11px;color:var(--muted);}
  .client-card-metric .v{font-size:16px;font-weight:700;margin-top:3px;}
  .client-card-badge{position:absolute;top:16px;right:16px;font-size:16px;}
  .client-card-alert-badge{position:absolute;top:14px;left:16px;font-size:10.5px;font-weight:800;color:#fff;background:var(--down);border-radius:10px;padding:3px 8px;display:flex;align-items:center;gap:2px;}
  .client-card-trend{font-weight:700;margin-left:4px;}
  .client-card-trend.up{color:var(--up);}
  .client-card-trend.down{color:var(--down);}
</style>

<script>
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}

/* ---------- 저장소 (Firestore) ---------- */
const DETAIL_DATA_FIELDS = ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign','wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign','wasteSearchTermsByCampaign','expandSearchTermsByCampaign','hourly','hourlyByCampaign','hourlyByDow','adgroupsByCampaign'];
function fieldEmptyDefault(f){ return (f==='hourly'||f==='hourlyByCampaign'||f==='hourlyByDow') ? [] : {}; }
function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
let isAdminUser = false;
let currentUserEmail = '';
function rolesConfigRef(){ return db.collection('config').doc('roles'); }
async function checkIsAdmin(email){
  try{
    const doc = await rolesConfigRef().get();
    if(!doc.exists) return false;
    const admins = doc.data().adminEmails || [];
    return admins.includes(email);
  }catch(e){ console.error(e); return false; }
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    const data = doc.data();
    // 개요 페이지는 마지막 월 요약 수치만 필요해서, 무거운 상세데이터(detailData 하위컬렉션)는 굳이 안 불러옴 — 로딩 속도 최적화.
    return data;
  }catch(e){ console.error(e); return null; }
}

/* ---------- 인증 ---------- */
function authStatus(msg, type){
  const el = document.getElementById('authStatus');
  el.textContent = msg; el.className = 'status-msg show ' + (type||'');
}
document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-pw').value;
  if(!email || !pw){ authStatus('이메일과 비밀번호를 입력해주세요.', 'err'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){ authStatus('로그인 실패: ' + e.message, 'err'); }
};
document.getElementById('logoutBtn').onclick = ()=> auth.signOut();

/* ---------- 전체 업체 개요 ---------- */
let overviewRows = [];
let overviewBizFilter = 'ALL';
let overviewSortMode = 'efficiency';
let overviewIndustryFilter = 'ALL';
let overviewGroupByIndustry = false;

async function loadOverview(){
  const grid = document.getElementById('overviewGrid');
  grid.innerHTML = `<div class="empty-state">불러오는 중...</div>`;
  const keys = await listClients();
  // 클라이언트별 조회를 순차(for...of + await)가 아니라 Promise.all로 동시에 실행 —
  // 클라이언트 수가 늘어날수록 순차 방식은 "클라이언트 수 × 왕복시간"만큼 그대로 느려지는데,
  // 각 클라이언트 조회는 서로 의존관계가 없어서 동시에 실행해도 안전함(로딩 속도 최적화).
  // 알림 개수도 같은 시점에 동시에 계산해서 업체 카드에 바로 표시함(🔔 배지) — 매번 알림 벨을
  // 눌러야만 어떤 업체에 문제가 있는지 알 수 있던 것을 그리드에서 한눈에 보이게 함.
  const [results, alerts] = await Promise.all([
    Promise.all(keys.map(async key=>{
      let data;
      try{ data = await getClient(key); }catch(e){ console.error(e); return null; }
      if(!data) return null;
      if(!isAdminUser && !(data.allowedUsers||[]).includes(currentUserEmail)) return null;
      if(!data.months || !data.months.length) return null;
      const last = data.months[data.months.length-1];
      const roas = last.cost>0 ? (last.revenue/last.cost*100) : 0;
      const cpa = last.conv>0 ? (last.cost*10000/last.conv) : 0;
      let trend = null;
      if(data.months.length>=2){
        const prev = data.months[data.months.length-2];
        if(data.bizType==='DB'){
          const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : 0;
          if(prevCpa>0 && cpa>0 && Math.abs(cpa-prevCpa)/prevCpa>=0.03){
            trend = { dir: cpa<prevCpa?'down':'up', good: cpa<prevCpa };
          }
        } else {
          const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : 0;
          if(prevRoas>0 && Math.abs(roas-prevRoas)>=3){
            trend = { dir: roas>prevRoas?'up':'down', good: roas>prevRoas };
          }
        }
      }
      return { key, name:data.name, color:data.color, bizType:data.bizType, industry:data.industry||'미분류',
        allowedUsers: data.allowedUsers||[],
        lastLabel:last.label, cost:last.cost||0, revenue:last.revenue||0, conv:last.conv||0, roas, cpa, trend };
    })),
    computeAlerts().catch(e=>{ console.error(e); return []; })
  ]);
  const alertCountByKey = {};
  alerts.forEach(a=>{ alertCountByKey[a.key] = (alertCountByKey[a.key]||0) + 1; });
  // Promise.all은 keys와 같은 순서로 결과를 반환하므로, 기존 for-loop와 동일한 순서가 유지됨(정렬은 렌더 시점에 적용).
  overviewRows = results.filter(Boolean).map(r=> ({ ...r, alertCount: alertCountByKey[r.key]||0 }));

  // 업종 필터 드롭다운 옵션을 실제 등록된 업종들로 채움 (매번 데이터가 바뀔 수 있어 갱신마다 다시 채움)
  const industrySel = document.getElementById('overviewIndustryFilter');
  const industries = [...new Set(overviewRows.map(r=>r.industry))].sort((a,b)=>a.localeCompare(b,'ko'));
  const prevIndustryVal = industrySel.value || 'ALL';
  industrySel.innerHTML = '<option value="ALL">전체 업종</option>' + industries.map(ind=>`<option value="${ind}">${ind}</option>`).join('');
  industrySel.value = industries.includes(prevIndustryVal) ? prevIndustryVal : 'ALL';
  overviewIndustryFilter = industrySel.value;

  renderStatRow();
  renderOverviewGrid();
  if(isAdminUser) renderPermOverviewPanel();
}

function renderStatRow(){
  const el = document.getElementById('statRow');
  if(!overviewRows.length){ el.innerHTML = ''; return; }
  const totalCost = overviewRows.reduce((a,r)=>a+r.cost,0);
  const totalConv = overviewRows.reduce((a,r)=>a+r.conv,0);
  const dbCount = overviewRows.filter(r=>r.bizType==='DB').length;
  const b2cCount = overviewRows.filter(r=>r.bizType!=='DB').length;
  el.innerHTML = `
    <div class="stat-card"><div class="lbl">전체 업체 수</div><div class="val">${overviewRows.length}개</div></div>
    <div class="stat-card"><div class="lbl">DB / B2C</div><div class="val">${dbCount} / ${b2cCount}</div></div>
    <div class="stat-card"><div class="lbl">최근 기간 총 비용</div><div class="val">${fmtMan(totalCost)}원</div></div>
    <div class="stat-card"><div class="lbl">최근 기간 총 전환수</div><div class="val">${fmtNum(totalConv)}건</div></div>
  `;
}

function overviewCardHTML(r, bestKeys, worstKeys){
  const initial = (r.name||'?').trim().charAt(0);
  const textColor = contrastText(r.color||'#8b7cff');
  const badge = bestKeys.has(r.key) ? '<span class="client-card-badge" title="이번 기간 가장 효율적">🏆</span>'
    : worstKeys.has(r.key) ? '<span class="client-card-badge" title="점검이 필요해요">⚠️</span>' : '';
  // 알림 배지 — 알림 벨을 직접 열어봐야 알 수 있던 "이 업체에 문제가 있는지"를 카드에서 바로 보이게 함.
  const alertBadge = r.alertCount>0 ? `<span class="client-card-alert-badge" title="확인 필요한 알림 ${r.alertCount}건">🔔 ${r.alertCount}</span>` : '';
  const trendHtml = r.trend ? `<span class="client-card-trend ${r.trend.good?'up':'down'}">${r.trend.dir==='up'?'▲':'▼'}</span>` : '';
  return `
    <div class="client-card" data-key="${r.key}">
      ${badge}
      ${alertBadge}
      <div class="client-card-head">
        <div class="client-card-icon" style="background:${r.color};color:${textColor};">${initial}</div>
        <div>
          <div class="client-card-name">${r.name}</div>
          <span class="client-card-biz">${r.bizType==='DB'?'DB · 상담/전환':'B2C · 매출/ROAS'} · ${r.industry}</span>
          <div class="client-card-period">${r.lastLabel} 기준</div>
        </div>
      </div>
      <div class="client-card-metrics">
        <div class="client-card-metric"><div class="m">비용</div><div class="v">${fmtMan(r.cost)}원</div></div>
        <div class="client-card-metric"><div class="m">전환수</div><div class="v">${fmtNum(r.conv)}건</div></div>
        <div class="client-card-metric"><div class="m">${r.bizType==='DB'?'CPA':'ROAS'}</div><div class="v">${r.bizType==='DB' ? fmtNum(r.cpa)+'원' : r.roas.toFixed(0)+'%'}${trendHtml}</div></div>
        ${r.bizType==='DB' ? '' : `<div class="client-card-metric"><div class="m">전환매출</div><div class="v">${fmtMan(r.revenue)}원</div></div>`}
      </div>
    </div>`;
}
function renderOverviewGrid(){
  const grid = document.getElementById('overviewGrid');
  const term = document.getElementById('overviewSearch').value.trim().toLowerCase();
  let rows = overviewRows.slice();
  if(overviewBizFilter!=='ALL') rows = rows.filter(r=> overviewBizFilter==='DB' ? r.bizType==='DB' : r.bizType!=='DB');
  if(overviewIndustryFilter!=='ALL') rows = rows.filter(r=> r.industry===overviewIndustryFilter);
  if(term) rows = rows.filter(r=> r.name.toLowerCase().includes(term));

  const sortFn = (a,b)=>{
    if(overviewSortMode==='efficiency'){
      if(a.bizType!==b.bizType) return a.bizType==='DB' ? -1 : 1;
      if(a.bizType==='DB'){ const av=a.cpa>0?a.cpa:Infinity, bv=b.cpa>0?b.cpa:Infinity; return av-bv; }
      return b.roas-a.roas;
    } else if(overviewSortMode==='cost_desc'){
      return b.cost-a.cost;
    } else if(overviewSortMode==='cost_asc'){
      return a.cost-b.cost;
    } else if(overviewSortMode==='name'){
      return a.name.localeCompare(b.name,'ko');
    }
    return 0;
  };
  rows.sort(sortFn);

  const dbRanked = overviewRows.filter(r=>r.bizType==='DB' && r.cpa>0).sort((a,b)=>a.cpa-b.cpa);
  const revRanked = overviewRows.filter(r=>r.bizType!=='DB' && r.cost>0).sort((a,b)=>b.roas-a.roas);
  const bestKeys = new Set(), worstKeys = new Set();
  if(dbRanked.length>=2){ bestKeys.add(dbRanked[0].key); worstKeys.add(dbRanked[dbRanked.length-1].key); }
  if(revRanked.length>=2){ bestKeys.add(revRanked[0].key); worstKeys.add(revRanked[revRanked.length-1].key); }

  if(!rows.length){
    grid.innerHTML = `<div class="empty-state"><div style="font-size:28px;">🔎</div><div>조건에 맞는 업체가 없어요.</div></div>`;
    return;
  }

  if(overviewGroupByIndustry){
    // 업종별로 묶어서 소제목 + 그리드를 반복 렌더 — 업종 이름 가나다순, 그룹 내부는 기존 정렬 유지
    const groups = {};
    rows.forEach(r=>{ if(!groups[r.industry]) groups[r.industry]=[]; groups[r.industry].push(r); });
    const industryNames = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ko'));
    grid.innerHTML = industryNames.map(ind=>`
      <div style="font-size:12.5px;font-weight:700;color:var(--muted);margin:${ind===industryNames[0]?'0':'20px'} 0 8px;">${ind} <span style="font-weight:400;">(${groups[ind].length}개)</span></div>
      <div class="client-grid">${groups[ind].map(r=>overviewCardHTML(r,bestKeys,worstKeys)).join('')}</div>
    `).join('');
  } else {
    grid.innerHTML = `<div class="client-grid">${rows.map(r=>overviewCardHTML(r,bestKeys,worstKeys)).join('')}</div>`;
  }

  grid.querySelectorAll('.client-card').forEach(el=>{
    el.onclick = ()=>{
      localStorage.setItem('ad_dashboard_active_client', el.dataset.key);
      window.location.href = 'index.html';
    };
  });
}

// 관리자 전용 — 업체별 접근 권한(allowedUsers) 현황을 한 화면에서 확인.
// 기존에는 input.html에서 업체를 하나씩 선택해야만 권한을 볼 수 있었음.
function renderPermOverviewPanel(){
  const panel = document.getElementById('permOverviewPanel');
  if(!overviewRows.length){ panel.style.display = 'none'; panel.innerHTML=''; return; }
  const rows = overviewRows.slice().sort((a,b)=> a.name.localeCompare(b.name,'ko'));
  const rowsHtml = rows.map(r=>{
    const restricted = r.allowedUsers && r.allowedUsers.length>0;
    const statusHtml = restricted
      ? `<span style="color:var(--accent);font-weight:700;">제한: ${r.allowedUsers.length}명</span>`
      : `<span style="color:var(--muted);">전체 공개</span>`;
    const emailsHtml = restricted
      ? `<div style="font-size:11.5px;color:var(--muted);margin-top:3px;">${r.allowedUsers.map(e=>e.replace(/</g,'&lt;')).join(', ')}</div>`
      : '';
    return `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);">
        <div style="min-width:120px;font-size:13.5px;font-weight:600;">${r.name}</div>
        <div style="flex:1;text-align:right;">
          <div style="font-size:13px;">${statusHtml}</div>
          ${emailsHtml}
        </div>
      </div>`;
  }).join('');
  const restrictedCount = rows.filter(r=>r.allowedUsers && r.allowedUsers.length>0).length;
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="panel">
      <div class="panel-title">🔐 업체별 접근 권한 현황 <span style="font-weight:400;color:var(--muted);font-size:12.5px;">(관리자 전용 · 전체 공개 ${rows.length-restrictedCount}개 · 제한 ${restrictedCount}개)</span></div>
      <div>${rowsHtml}</div>
    </div>`;
}

/* ---------- 이상 징후 알림(벨) ---------- */
// index.html과 동일한 로직 — 전체 업체를 훑어서 CPA 급등/ROAS 급락/전환 0건 캠페인/예산 소진 임박을 감지.
const ALERT_SEEN_KEY = 'ad_dashboard_seen_alerts';
const ALERT_CPA_SPIKE_PCT = 20;
const ALERT_ROAS_DROP_PCT = 10;
// 예산 규모별 알림 민감도 배율 — 작은 계정(월 비용 50만원 미만)은 CPA/ROAS가 표본이 적어 원래 변동폭이
// 크기 때문에 기준을 완화(둔감하게)하고, 큰 계정(300만원 이상)은 같은 %변화라도 실제 손실 금액이 커서
// 기준을 강화(민감하게)함. costMan은 last(가장 최근 달) 비용, 단위 만원.
function alertSensitivityMult(costMan){
  if(costMan < 50) return 1.5;   // 소액 계정: 기준을 1.5배 완화 (예: CPA 20% → 30%)
  if(costMan >= 300) return 0.75; // 대형 계정: 기준을 0.75배 강화 (예: CPA 20% → 15%)
  return 1;
}
function getSeenAlertIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(ALERT_SEEN_KEY)||'[]')); }catch(e){ return new Set(); }
}
function markAlertsSeen(ids){
  try{
    const seen = getSeenAlertIds();
    ids.forEach(id=>seen.add(id));
    const arr = [...seen].slice(-500);
    localStorage.setItem(ALERT_SEEN_KEY, JSON.stringify(arr));
  }catch(e){ console.error(e); }
}
async function computeAlerts(){
  const keys = await listClients();
  const todayDate = new Date();
  const todayStr = todayDate.toISOString().slice(0,10);
  // 클라이언트별 조회·판정을 Promise.all로 동시에 실행 — 순차 for-loop는 클라이언트 수만큼 왕복시간이
  // 그대로 누적되는데, 알림 벨은 페이지 열 때마다/드롭다운 열 때마다 매번 다시 계산돼서 체감 영향이 큼.
  const perClientResults = await Promise.all(keys.map(async key=>{
    const alerts = [];
    let data;
    try{ data = await getClient(key); }catch(e){ return alerts; }
    if(!data || !data.months || !data.months.length) return alerts;
    const months = data.months;
    const last = months[months.length-1];
    const prev = months.length>=2 ? months[months.length-2] : null;
    const isDB = data.bizType==='DB';
    const name = data.name;
    const sensMult = alertSensitivityMult(last.cost||0);
    if(prev){
      if(isDB){
        const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : null;
        const currCpa = last.conv>0 ? (last.cost*10000/last.conv) : null;
        if(prevCpa && currCpa && last.conv>=5 && prev.conv>=5){
          const diff = (currCpa-prevCpa)/prevCpa*100;
          const threshold = ALERT_CPA_SPIKE_PCT*sensMult;
          if(diff>=threshold){
            alerts.push({ id:`${key}:cpa-spike:${last.label}`, key, name, icon:'📈', text:`CPA가 직전 기간 대비 ${diff.toFixed(0)}% 상승했어요 (${Math.round(prevCpa).toLocaleString('ko-KR')}원 → ${Math.round(currCpa).toLocaleString('ko-KR')}원)` });
          }
        }
      } else {
        const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : null;
        const currRoas = last.cost>0 ? (last.revenue/last.cost*100) : null;
        if(prevRoas!==null && currRoas!==null && last.cost>=5 && prev.cost>=5){
          const diff = prevRoas-currRoas;
          const threshold = ALERT_ROAS_DROP_PCT*sensMult;
          if(diff>=threshold){
            alerts.push({ id:`${key}:roas-drop:${last.label}`, key, name, icon:'📉', text:`ROAS가 직전 기간 대비 ${diff.toFixed(0)}%p 하락했어요 (${prevRoas.toFixed(0)}% → ${currRoas.toFixed(0)}%)` });
          }
        }
      }
    }
    // 목표(goal) 대비 직접 비교 — "직전 기간보다 나빠졌는지"와는 별개로, 애초에 계약/설정해둔 목표치를
    // 못 맞추고 있으면 그 자체로도 알림. index.html의 goalBadge(🎯)와 같은 goal 필드를 재사용.
    if(data.goal && data.goal.target){
      const target = Number(data.goal.target);
      if(target>0){
        if(isDB && data.goal.metric==='cpa' && last.conv>=5){
          const currCpa = last.conv>0 ? (last.cost*10000/last.conv) : null;
          if(currCpa!==null && currCpa > target*1.1){
            const overPct = ((currCpa-target)/target*100);
            alerts.push({ id:`${key}:goal-miss-cpa:${last.label}`, key, name, icon:'🎯', text:`CPA가 목표(${Math.round(target).toLocaleString('ko-KR')}원)보다 ${overPct.toFixed(0)}% 높아요 (현재 ${Math.round(currCpa).toLocaleString('ko-KR')}원)` });
          }
        } else if(!isDB && data.goal.metric==='roas' && last.cost>=5){
          const currRoas = last.cost>0 ? (last.revenue/last.cost*100) : null;
          if(currRoas!==null && currRoas < target*0.9){
            const underPct = ((target-currRoas)/target*100);
            alerts.push({ id:`${key}:goal-miss-roas:${last.label}`, key, name, icon:'🎯', text:`ROAS가 목표(${target}%)보다 ${underPct.toFixed(0)}% 낮아요 (현재 ${currRoas.toFixed(0)}%)` });
          }
        }
      }
    }
    if(last.campaigns && last.campaigns.length){
      const zeroConv = last.campaigns.filter(c=>(c.cost||0)>=1 && (c.conv||0)===0);
      if(zeroConv.length){
        const totalWaste = zeroConv.reduce((s,c)=>s+c.cost,0);
        alerts.push({ id:`${key}:zero-conv:${last.label}`, key, name, icon:'🚫', text:`전환 0건인 캠페인이 ${zeroConv.length}개 있어요 (합계 비용 ${fmtWon(totalWaste)}원)` });
      }
    }
    if(data.goal && data.goal.budgetTarget && last.daily && last.daily.length>=3){
      const lm = last.label.match(/(\d{4})\D*(\d{1,2})/);
      if(lm && parseInt(lm[1],10)===todayDate.getFullYear() && parseInt(lm[2],10)===(todayDate.getMonth()+1)){
        const daysElapsed = last.daily.length;
        const daysInMonth = new Date(todayDate.getFullYear(), todayDate.getMonth()+1, 0).getDate();
        if(daysElapsed<daysInMonth){
          const avgDailyCost = last.cost/daysElapsed;
          const projectedCost = avgDailyCost*daysInMonth;
          const budgetTargetMan = data.goal.budgetTarget/10000;
          if(budgetTargetMan>0 && projectedCost/budgetTargetMan>=1.05){
            const exhaustDay = Math.min(daysInMonth, Math.ceil(budgetTargetMan/avgDailyCost));
            alerts.push({ id:`${key}:budget-pace:${todayStr}`, key, name, icon:'💸', text:`이 페이스면 예산이 ${exhaustDay}일쯤 소진될 것으로 보여요 (목표 ${fmtMan(budgetTargetMan)}원)` });
          }
        }
      }
    }
    return alerts;
  }));
  return perClientResults.flat();
}
async function loadAlerts(){
  const badge = document.getElementById('alertBellBadge');
  const dropdown = document.getElementById('alertBellDropdown');
  if(!badge || !dropdown) return;
  let alerts = [];
  try{ alerts = await computeAlerts(); }catch(e){ console.error(e); }
  window.__alerts = alerts;
  const seen = getSeenAlertIds();
  const unread = alerts.filter(a=>!seen.has(a.id));
  if(unread.length){ badge.textContent = unread.length>99?'99+':String(unread.length); badge.style.display = 'block'; }
  else badge.style.display = 'none';
  if(!alerts.length){
    dropdown.innerHTML = `<div style="padding:20px 10px;text-align:center;color:var(--muted);font-size:12.5px;">🔔 이상 징후가 없어요.</div>`;
    return;
  }
  dropdown.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 6px 10px;border-bottom:1px solid var(--border);margin-bottom:6px;">
      <span style="font-size:12.5px;font-weight:700;color:var(--text);">이상 징후 알림 (${alerts.length})</span>
      <button id="alertMarkAllReadBtn" style="background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;">모두 읽음</button>
    </div>
    ${alerts.map(a=>{
      const isUnread = !seen.has(a.id);
      return `<div class="alert-item" data-key="${a.key}" data-id="${a.id.replace(/"/g,'&quot;')}" style="display:flex;gap:8px;padding:9px 6px;border-radius:8px;cursor:pointer;${isUnread?'background:rgba(139,124,255,.08);':''}">
        <span style="font-size:14px;flex-shrink:0;">${a.icon}</span>
        <div style="min-width:0;">
          <div style="font-size:11.5px;font-weight:700;color:var(--text);">${a.name}${isUnread?' <span style="color:var(--accent);">●</span>':''}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4;">${a.text}</div>
        </div>
      </div>`;
    }).join('')}
  `;
  dropdown.querySelectorAll('.alert-item').forEach(el=>{
    el.onclick = ()=>{
      markAlertsSeen([el.dataset.id]);
      localStorage.setItem('ad_dashboard_active_client', el.dataset.key);
      window.location.href = 'index.html';
    };
  });
  const markAllBtn = document.getElementById('alertMarkAllReadBtn');
  if(markAllBtn) markAllBtn.onclick = (e)=>{
    e.stopPropagation();
    markAlertsSeen(alerts.map(a=>a.id));
    loadAlerts();
  };
}
document.getElementById('alertBellBtn').onclick = (e)=>{
  e.stopPropagation();
  const dropdown = document.getElementById('alertBellDropdown');
  const willOpen = dropdown.style.display==='none';
  dropdown.style.display = willOpen ? 'block' : 'none';
  if(willOpen) loadAlerts();
};
document.addEventListener('click', (e)=>{
  const bell = document.getElementById('alertBell');
  if(bell && !bell.contains(e.target)) document.getElementById('alertBellDropdown').style.display = 'none';
});
