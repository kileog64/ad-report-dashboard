<style>
  :root{
    --bg:#0d0e15; --panel:#171829; --panel-2:#1d1f33; --border:#33354a;
    --text:#f5f6fa; --muted:#a8abc4; --up:#4ade9a; --down:#ff6b85; --accent:#8b7cff; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 10% 0%,#191a2c 0%,var(--bg) 45%);color:var(--text);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  .display{font-family:'Pretendard',sans-serif;}
  .wrap{max-width:1480px;margin:0 auto;padding:28px;display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}

  .input-panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;position:sticky;top:20px;}
  .input-panel h2{font-size:16px;margin:0 0 6px;color:var(--text);font-weight:700;}
  .input-panel .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;}
  .section-title{font-size:12.5px;color:var(--accent);font-weight:700;margin:16px 0 9px;letter-spacing:.01em;}
  .file-drop{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;background:var(--panel-2);margin-bottom:10px;transition:border-color .15s,background .15s;}
  .file-drop.dragover{border-color:var(--accent);background:rgba(139,124,255,.1);}
  .file-drop label{display:block;font-size:13px;color:var(--text);font-weight:600;margin-bottom:7px;}
  .file-drop input[type=file]{font-size:12px;color:var(--muted);width:100%;}
  .file-drop .status{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5;}
  .file-drop .status.ok{color:var(--up);}
  .file-drop .status.err{color:var(--down);}
  .preview-box{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;font-size:12.5px;}
  .preview-box .row{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);}
  .preview-box .row b{color:var(--text);}
  .col-ref{background:rgba(139,124,255,.08);border:1px dashed var(--border);border-radius:8px;padding:9px 11px;margin:-4px 0 10px;}
  .col-ref-title{font-size:10.5px;color:var(--accent);font-weight:700;margin-bottom:3px;}
  .col-ref-list{font-family:'Pretendard',monospace;font-size:10.5px;color:var(--muted);line-height:1.6;word-break:break-all;}
  .col-ref-list b{color:var(--text);}
  .btn{border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:7px;}
  .btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
  .btn-accent{background:linear-gradient(135deg,var(--accent),#a89aff);color:#fff;}
  .status-msg{font-size:12.5px;margin-top:11px;padding:10px 12px;border-radius:8px;background:var(--panel-2);color:var(--muted);display:none;line-height:1.5;}
  .status-msg.show{display:block;}
  .status-msg.ok{color:var(--up);}
  .status-msg.err{color:var(--down);}

  .tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .tab{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);transition:all .15s;}
  .tab.active{border-color:var(--accent);color:var(--text);background:var(--panel-2);}
  .tab .dot{width:9px;height:9px;border-radius:50%;}
  .export-btn{margin-left:auto;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;}
  .client-switcher{position:relative;display:inline-block;}
  .client-switcher-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;color:var(--text);min-width:170px;}
  .client-switcher-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .client-switcher-btn .chev{margin-left:auto;font-size:11px;color:var(--muted);}
  .client-switcher-dropdown{position:absolute;top:calc(100% + 6px);right:0;z-index:50;width:280px;max-height:360px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;}
  .client-switcher-dropdown.open{display:block;}
  .client-switcher-search{width:100%;box-sizing:border-box;padding:10px 12px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;outline:none;position:sticky;top:0;background:var(--panel-2);}
  .client-switcher-biztabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:37px;background:var(--panel-2);z-index:1;}
  .client-switcher-biztab{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:5px 0;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .client-switcher-biztab.active{border-color:var(--accent);color:var(--accent);background:rgba(139,124,255,.12);}
  .client-switcher-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13.5px;color:var(--text);}
  .client-switcher-item:hover{background:var(--panel);}
  .client-switcher-item.active{background:rgba(139,124,255,.15);color:var(--accent);font-weight:700;}
  .client-switcher-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .client-switcher-empty{padding:14px;color:var(--muted);font-size:12.5px;text-align:center;}
  .ai-chat-toggle{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a89aff);border:none;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100;}
  .ai-chat-panel{position:fixed;bottom:90px;right:24px;width:520px;max-height:min(760px,85vh);background:var(--panel-2);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden;z-index:100;}
  .ai-chat-panel.open{display:flex;}
  .ai-chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--text);}
  .ai-chat-icon-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px;}
  .ai-chat-setup{padding:16px;display:none;}
  .ai-chat-setup.show{display:block;}
  .ai-chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:320px;}
  .ai-chat-msg{font-size:14px;line-height:1.65;padding:11px 14px;border-radius:10px;max-width:90%;white-space:pre-wrap;}
  .ai-chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
  .ai-chat-msg.assistant{align-self:flex-start;background:var(--panel);color:var(--text);}
  .ai-chat-msg.system{align-self:center;color:var(--muted);font-size:11.5px;text-align:center;}
  .ai-chat-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);}
  .ai-chat-input-row textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;max-height:140px;min-height:44px;}
  .ai-chat-input-row button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;}
  @media (max-width:640px){
    .ai-chat-panel{right:10px;left:10px;width:auto;bottom:84px;}
    .ai-chat-toggle{right:16px;bottom:16px;}
  }

  .main-layout{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 28px;min-height:400px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--muted);font-size:14px;text-align:center;gap:10px;line-height:1.6;}
  header.rep{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px;}
  .idn{display:flex;align-items:center;gap:14px;}
  .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex-shrink:0;font-family:'Pretendard',sans-serif;}
  .idn-name{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:700;}
  .badge{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--muted);font-weight:600;}
  .period{font-size:13px;color:var(--muted);margin-top:4px;}
  .totals{display:flex;gap:32px;text-align:right;}
  .totals .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:500;}
  .totals .val{font-family:'Pretendard',sans-serif;font-size:30px;font-weight:800;margin-top:3px;letter-spacing:-.01em;}
  .totals .val.accent{color:var(--accent);}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px;}
  .kpi{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .2s;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .kpi:hover{border-color:var(--accent);}
  .kpi-label{font-size:12.5px;color:var(--muted);margin-bottom:9px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi-value{font-family:'Pretendard',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
  .kpi-note{font-size:16px;font-weight:800;padding:7px 13px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .kpi-note.up{color:var(--up);background:rgba(74,222,154,.14);} .kpi-note.down{color:var(--down);background:rgba(255,107,133,.14);}
  .kpi-spark{width:100%;height:30px;margin-top:9px;}

  .charts-row{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:22px;}
  .panel{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .panel-title{font-size:15.5px;font-weight:700;margin-bottom:14px;color:var(--text);}
  .chart-box{height:320px;}

  .bottom-row{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 7px;border-bottom:1px solid var(--border);}
  td{padding:10px 7px;border-bottom:1px solid #262841;}
  tr:last-child td{border-bottom:none;}
  .kw-name{color:var(--text);font-weight:600;}

  .improve-box{margin-bottom:16px;}
  .improve-row{display:flex;align-items:center;justify-content:space-between;}
  .improve-side .m{font-size:12.5px;color:var(--muted);font-weight:500;}
  .improve-side .v{font-family:'Pretendard',sans-serif;font-size:25px;font-weight:800;margin-top:4px;}
  .improve-side.right{text-align:right;}
  .improve-side.right .v{color:var(--accent);}
  .arrow{color:var(--muted);font-size:18px;}
  .divider{height:1px;background:var(--border);margin:14px 0;}
  .sub-metric{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);}
  .sub-metric .chg{color:var(--text);font-weight:700;font-family:'Pretendard',sans-serif;font-size:15px;}


  .filter-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;position:sticky;top:20px;}
  .filter-head{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .filter-group{margin-bottom:14px;}
  .filter-campaign-list{max-height:260px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;}
  .filter-campaign-list::-webkit-scrollbar{width:5px;}
  .filter-campaign-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .filter-group-title{background:rgba(139,124,255,.18);color:#c3b8ff;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;margin-bottom:6px;}
  .filter-item{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;color:var(--text);font-weight:500;}
  .filter-item input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;}
  .filter-item .swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  @media (max-width:1100px){
    .wrap{grid-template-columns:1fr;}
    .input-panel{position:static;}
    .main-layout{grid-template-columns:1fr;}
    .filter-panel{position:static;}
    .kpi-row{grid-template-columns:repeat(3,1fr);}
    .charts-row, .bottom-row{grid-template-columns:1fr;}
  }

  @media (max-width:640px){
    body{font-size:13px;}
    .wrap{padding:14px;}
    header.rep{flex-direction:column;align-items:flex-start;}
    .totals{gap:16px;text-align:left;width:100%;}
    .idn-name{font-size:16px;}
    .kpi-row{grid-template-columns:repeat(2,1fr)!important;}
    .panel{padding:14px;overflow-x:auto;}
    .chart-box{height:240px!important;}
    table{font-size:12px;}
  }
</style>
</head>
<body>

<div id="authScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:340px;">
    <h2 style="margin:0 0 4px;font-size:18px;">📊 광고 성과 대시보드</h2>
    <div style="font-size:12px;color:var(--muted);margin-bottom:20px;">팀 계정으로 로그인하면 전체 업체 데이터를 함께 볼 수 있어요.</div>
    <div class="field"><label>이메일</label><input id="auth-email" type="email" placeholder="you@company.com"></div>
    <div class="field"><label>비밀번호</label><input id="auth-pw" type="password" placeholder="6자 이상"></div>
    <button class="btn btn-accent" id="loginBtn">로그인</button>
    <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;">계정이 없으신가요? 관리자에게 계정 생성을 요청해주세요.</div>
    <div class="status-msg" id="authStatus"></div>
  </div>
</div>

<div class="wrap" id="mainApp" style="display:none;grid-template-columns:1fr;max-width:1280px;margin:0 auto;">
  <div style="grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:-8px;flex-wrap:wrap;row-gap:6px;">
    <a href="overview.html" style="font-size:12px;color:var(--accent);text-decoration:none;">🗂️ 전체 업체 개요</a>
    <a href="campaigns.html" style="font-size:12px;color:var(--accent);text-decoration:none;">📣 캠페인 비교 전용 보기</a>
    <a href="keywords.html" style="font-size:12px;color:var(--accent);text-decoration:none;">🔑 키워드 전용 보기</a>
    <a href="hourly.html" style="font-size:12px;color:var(--accent);text-decoration:none;">⏰ 시간대별 전용 보기</a>
    <a href="input.html" style="font-size:12px;color:var(--accent);text-decoration:none;">+ 데이터 입력하기</a>
    <div class="client-switcher" id="clientSwitcher" style="margin-left:auto;">
      <button class="client-switcher-btn" id="clientSwitcherBtn" type="button"><span class="dot" id="clientSwitcherDot" style="background:#666;"></span><span id="clientSwitcherLabel">업체 선택</span><span class="chev">▾</span></button>
      <div class="client-switcher-dropdown" id="clientSwitcherDropdown">
        <input class="client-switcher-search" id="clientSwitcherSearch" placeholder="업체 검색...">
        <div class="client-switcher-biztabs" id="clientSwitcherBizTabs">
          <button class="client-switcher-biztab active" data-biztype="ALL" type="button">전체</button>
          <button class="client-switcher-biztab" data-biztype="DB" type="button">DB</button>
          <button class="client-switcher-biztab" data-biztype="B2C" type="button">B2C</button>
        </div>
        <div id="clientSwitcherList"></div>
      </div>
    </div>
    <div class="alert-bell" id="alertBell" style="position:relative;">
      <button id="alertBellBtn" type="button" title="알림" style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;position:relative;color:var(--text);">🔔<span id="alertBellBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:var(--down);color:#fff;font-size:9px;font-weight:800;border-radius:8px;min-width:15px;height:15px;line-height:15px;text-align:center;padding:0 3px;"></span></button>
      <div id="alertBellDropdown" style="display:none;position:absolute;top:calc(100% + 6px);right:0;width:340px;max-height:420px;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:50;padding:8px;"></div>
    </div>
    <span id="authUserEmail" style="font-size:12px;color:var(--muted);"></span>
    <button class="export-btn" id="logoutBtn">로그아웃</button>
  </div>

  <div>
    <div id="naverLastRunBanner" style="display:none;font-size:12px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:12px;"></div>
    <div class="tabs" id="tabs">
      <button class="export-btn" id="pdfExportBtn">🖼️ 디자인 리포트 다운로드 (PDF)</button><button class="export-btn" id="clientReportBtn">📋 고객 공유용 리포트</button><button class="export-btn" id="excelExportBtn">📊 엑셀 다운로드</button><button class="export-btn" id="rawExcelExportBtn">🧮 원본데이터 연동 보고서</button><button class="export-btn" id="exportBtn">📥 로컬 스냅샷 다운로드</button></div>
    <div class="main-layout" id="mainLayout">
      <div class="card" id="card">
        <div class="empty-state">

<script>
let activeSlug = null;
let chartA = null, chartB = null, chartC = null, trendChart = null, hourChart = null, compareChart = null;
const filterState = {}; // key -> { types:Set, campaigns:Set }
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
const CAMPAIGN_TYPE_LABELS = { WEB_SITE:'파워링크', SHOPPING:'쇼핑검색', POWER_CONTENTS:'파워컨텐츠', BRAND_SEARCH:'브랜드검색광고', PLACE:'플레이스', PLACE_TP:'플레이스', CATEGORY_EDIT:'세부업종', CAMPAIGN_TYPE_UNKNOWN:'기타' };
function campaignTypeLabel(t){ return CAMPAIGN_TYPE_LABELS[t] || t; }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function dateKey(d){ return String(d).replace(/\D/g,''); }
function weekdayOf(dateStr){
  // daily[].date는 "2026-07-01"(하이픈) 형식으로 저장됨. 과거 "2026.07.01"(마침표) 형식도 방어적으로 지원.
  const parts = String(dateStr).split(/[.\-\/]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  if(isNaN(dt.getTime())) return null;
  return dt.getDay(); // 0=Sun..6=Sat
}
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];

/* ---------- 저장소 (Firestore, 로그인한 팀 전체가 공유) ---------- */

const DETAIL_DATA_FIELDS = ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign','wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign','wasteSearchTermsByCampaign','expandSearchTermsByCampaign','hourly','hourlyByCampaign','hourlyByDow','adgroupsByCampaign'];
function fieldEmptyDefault(f){ return (f==='hourly'||f==='hourlyByCampaign'||f==='hourlyByDow') ? [] : {}; }
function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
let isAdminUser = false;
let currentUserEmail = '';
function rolesConfigRef(){ return db.collection('config').doc('roles'); }
async function checkIsAdmin(email){
  try{
    const doc = await rolesConfigRef().get();
    if(!doc.exists) return false;
    const admins = doc.data().adminEmails || [];
    return admins.includes(email);
  }catch(e){ console.error(e); return false; }
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    const data = doc.data();
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 월별 하위 컬렉션에 따로 저장돼있어서 여기서 합쳐줌.
    // 아직 하위 컬렉션으로 안 옮겨진(예전 형식) 업체는 month 객체에 그대로 남아있는 값을 그대로 씀(하위호환).
    if(months.length){
      const detailSnap = await docRef.collection('detailData').get().catch(()=>({docs:[]}));
      const detailMap = {}; detailSnap.docs.forEach(d=>{ detailMap[d.id] = d.data(); });
      data.months = months.map(m=>{
        const det = detailMap[m.label];
        const merged = { ...m };
        DETAIL_DATA_FIELDS.forEach(f=>{
          if(det) merged[f] = det[f]!==undefined ? det[f] : fieldEmptyDefault(f);
          else if(m[f]===undefined) merged[f] = fieldEmptyDefault(f);
        });
        return merged;
      });
    }
    return data;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 메인 문서에서 빼서 월별 하위 컬렉션 문서로 분리 저장
    const lightMonths = months.map(m=>{
      const light = { ...m };
      DETAIL_DATA_FIELDS.forEach(f=> delete light[f]);
      return light;
    });
    const batch = db.batch();
    batch.set(docRef, { ...data, months: lightMonths });
    months.forEach(m=>{
      if(!m.label) return;
      const detailData = {}; DETAIL_DATA_FIELDS.forEach(f=>{ detailData[f] = m[f]!==undefined ? m[f] : fieldEmptyDefault(f); });
      batch.set(docRef.collection('detailData').doc(m.label), detailData);
    });
    await batch.commit();
    return true;
  }catch(e){ console.error(e); return false; }
}

const ACTIVE_CLIENT_STORAGE = 'ad_dashboard_active_client';

let clientListCache = []; // [{key, name, color}] - 검색/드롭다운용 캐시
async function refreshTabs(selectAfter){
  const keys = await listClients();

  for(const key of keys){
    const data = await getClient(key);
    if(!data) continue;
    if(!isAdminUser && !(data.allowedUsers||[]).includes(currentUserEmail)) continue;
    clientListCache.push({ key, name: data.name, color: data.color, bizType: data.bizType });
  }
  // 다른 페이지에서 이미 업체를 선택했다면(localStorage), 이 페이지 첫 로드 때도 그 업체를 그대로 이어서 보여줌
  if(!selectAfter && !activeSlug){
    const stored = getStoredActiveClient();
    if(stored && clientListCache.some(c=>c.key===stored)) selectAfter = stored;
  }
  renderClientSwitcher();
  if(selectAfter){
    activeSlug = selectAfter;
    setStoredActiveClient(selectAfter);
    const data = await getClient(selectAfter);
    if(data){ renderCard(data); renderClientSwitcher(); }
  }
}

  const active = clientListCache.find(c=>c.key===activeSlug);

/* ---------- AI 데이터 질문 챗봇 ---------- */
const AI_KEY_STORAGE = 'ad_dashboard_gemini_key';
const CHAT_HISTORY_STORAGE = 'ad_dashboard_chat_history';
const CHAT_OPEN_STORAGE = 'ad_dashboard_chat_open';
function loadChatHistory(){ try{ return JSON.parse(sessionStorage.getItem(CHAT_HISTORY_STORAGE) || '[]'); }catch(e){ return []; } }
function saveChatHistory(){ try{ sessionStorage.setItem(CHAT_HISTORY_STORAGE, JSON.stringify(aiChatHistory.slice(-30))); }catch(e){} }
let aiChatHistory = loadChatHistory();
function getAIApiKey(){ return localStorage.getItem(AI_KEY_STORAGE) || ''; }
function setAIApiKey(k){ localStorage.setItem(AI_KEY_STORAGE, k); }
function extractTopKeywordsFromClientData(data){
  const months = data.months || [];
  if(!months.length) return [];
  const last = months[months.length-1];
  const maps = [last.keywordsByCampaign, last.brandKeywordsByCampaign, last.searchTermsByCampaign].filter(Boolean);
  const all = [];
  maps.forEach(map=>{
    Object.keys(map||{}).forEach(camp=>{
      (map[camp]||[]).forEach(item=> all.push({ ...item, campaign: camp }));
    });
  });
  all.sort((a,b)=> ((b.revenue||0)-(a.revenue||0)) || ((b.conv||0)-(a.conv||0)));
  return all.slice(0,15);
}
async function buildAllClientsSummary(){
  const keys = await listClients();
  const rows = [];
  for(const key of keys){
    const d = await getClient(key);
    if(!d) continue;
    const months = d.months || [];
    const last = months[months.length-1];
    if(!last) continue;
    rows.push({ name: d.name, industry: d.industry||'-', isDB: d.bizType==='DB', label: last.label, cost: last.cost||0, conv: last.conv||0, revenue: last.revenue||0 });
  }
  return rows;
}
async function buildAIContext(){
  const data = window.__currentClientData;
  const exp = window.__exportData;
  if(!data || !exp){
    const rows = await buildAllClientsSummary();
    if(!rows.length) return '아직 등록된 업체가 없어요.';
    const lines = ['현재 특정 업체가 선택돼있지 않아요. 아래는 전체 업체의 최근 기간 요약이에요 — 특정 업체를 지정하지 않은 질문에는 이 요약을 참고해서 답하고, 특정 업체의 자세한 분석이 필요한 질문이면 어떤 업체를 볼지 먼저 사용자에게 물어보세요.', ''];
    rows.forEach(r=>{
      const metric = r.isDB ? `전환 ${r.conv}건` : `매출 ${Math.round(r.revenue*10000).toLocaleString('ko-KR')}원`;
      lines.push(`- ${r.name} (${r.industry}, ${r.label}): 비용 ${Math.round(r.cost*10000).toLocaleString('ko-KR')}원, ${metric}`);
    });
    return lines.join('\n');
  }
  const lines = [];
  lines.push(`업체명: ${data.name} (${data.industry||'-'}), 업종: ${exp.isDB?'DB(상담·전환형)':'B2C(매출형)'}`);
  lines.push(`조회 기간: ${exp.periodFrom} ~ ${exp.periodTo} (${exp.periodsCount}개 기간, 필터 적용됨)`);
  lines.push(`전체 비용: ${Math.round((exp.totalCostMan||0)*10000).toLocaleString('ko-KR')}원, 전환수: ${exp.totalConv||0}건, 노출수: ${exp.totalImp||0}, 클릭수: ${exp.totalClick||0}`);
  if(exp.isDB) lines.push(`평균 CPA: ${exp.avgCpa?Math.round(exp.avgCpa).toLocaleString('ko-KR'):'-'}원`);
  else lines.push(`전환매출: ${Math.round((exp.totalRevenueMan||0)*10000).toLocaleString('ko-KR')}원, ROAS: ${(exp.totalRoas||0).toFixed(1)}%`);
  if(exp.lastMonthCampaigns && exp.lastMonthCampaigns.length){
    lines.push('\n최근 기간 캠페인별 성과:');
    exp.lastMonthCampaigns.slice(0,15).forEach(c=>{
      lines.push(`- ${c.campaign} (${c.type?campaignTypeLabel(c.type):'-'}): 비용 ${Math.round((c.cost||0)*10000).toLocaleString('ko-KR')}원, 전환 ${c.conv||0}건, 매출 ${Math.round((c.revenue||0)*10000).toLocaleString('ko-KR')}원`);
    });
  }
  const topKeywords = extractTopKeywordsFromClientData(data);
  if(topKeywords.length){
    lines.push('\n최근 기간 키워드/검색어 성과(전체 유형):');
    topKeywords.forEach(k=> lines.push(`- ${k.keyword} (${k.campaign}): 비용 ${Math.round((k.cost||0)*10000).toLocaleString('ko-KR')}원, 전환 ${k.conv||0}건, 매출 ${Math.round((k.revenue||0)*10000).toLocaleString('ko-KR')}원`));
  }
  if(exp.insightsList && exp.insightsList.length){
    lines.push('\n대시보드가 이미 뽑아낸 인사이트:');
    exp.insightsList.forEach(t=> lines.push(`- ${t}`));
  }
  return lines.join('\n');
}
function formatChatText(text){
  // 마크다운 별표(**굵게**, * 목록)를 그대로 화면에 노출하지 않고 자연스러운 텍스트로 바꿔줌
  let s = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/^[*-]\s+/gm, '• ');
  s = s.replace(/\*/g, '');
  s = s.replace(/^-{3,}\s*$/gm, '');
  return s;
}
function appendChatMsg(role, text){
  const body = document.getElementById('aiChatBody');
  const div = document.createElement('div');
  div.className = 'ai-chat-msg ' + role;
  div.innerHTML = formatChatText(text);
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

  document.getElementById('aiChatPanel').classList.remove('open');

document.getElementById('aiChatNewBtn').onclick = ()=>{

document.getElementById('aiChatSettingsBtn').onclick = ()=>{
  document.getElementById('aiChatSetup').classList.add('show');

document.getElementById('aiApiKeySaveBtn').onclick = ()=>{
  const v = document.getElementById('aiApiKeyInput').value.trim();
  if(!v){ alert('API 키를 입력해주세요.'); return; }
  setAIApiKey(v);
  document.getElementById('aiApiKeyInput').value = '';
  refreshChatUI();
  if(!document.getElementById('aiChatBody').children.length){
    appendChatMsg('system', '준비됐어요. 지금 보고 있는 업체 데이터에 대해 질문해보세요.');
  }
};
async function sendAIChat(){
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();
  if(!text) return;
  const apiKey = getAIApiKey();
  if(!apiKey){ refreshChatUI(); return; }
  appendChatMsg('user', text);
  input.value = '';
  aiChatHistory.push({ role:'user', content: text });
  saveChatHistory();
  const sendBtn = document.getElementById('aiChatSendBtn');
  sendBtn.disabled = true;
  const loadingEl = appendChatMsg('assistant', '생각 중...');
  try{

    const contents = aiChatHistory.slice(-10).map(m=>({ role: m.role==='assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: systemPrompt }] }
      })
    });
    if(!res.ok){
      const errBody = await res.json().catch(()=>({}));
      throw new Error((errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`);
    }
    const json = await res.json();
    const cand = (json.candidates && json.candidates[0]) || {};
    const parts = (cand.content && cand.content.parts) || [];
    const replyText = parts.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    loadingEl.innerHTML = formatChatText(replyText);
    aiChatHistory.push({ role:'assistant', content: replyText });
    saveChatHistory();
  }catch(e){
    console.error(e);
    loadingEl.innerHTML = formatChatText('오류가 발생했어요: ' + (e.message||e));
    loadingEl.style.color = 'var(--down)';
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ---------- 필터 상태 ---------- */

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


function mergedCampaignList(data){
  const map = {};
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

/* ---------- 렌더링 ---------- */


function generateInsights(data, months, isDB){
  const insights = [];
  const MIN_CONV = 5;      // 전환수 기반 비교의 최소 표본
  const MIN_COST_MAN = 5;  // ROAS 비교의 최소 비용(만원)
  const last = months[months.length-1];
  if(last && last.campaigns && last.campaigns.length>1){
    const camps = last.campaigns.map(c=>({ campaign:c.campaign, cost:c.cost, conv:c.conv,
      roas: c.cost>0 ? (c.revenue/c.cost*100) : 0, cpa: c.conv>0 ? (c.cost*10000/c.conv) : null }));
    if(isDB){
      const withConv = camps.filter(c=>c.cpa!==null && c.conv>=MIN_CONV);
      if(withConv.length>=2){
        const best = withConv.reduce((a,b)=>a.cpa<b.cpa?a:b);
        const worst = withConv.reduce((a,b)=>a.cpa>b.cpa?a:b);
        insights.push({type:'good', text:`'${best.campaign}' 캠페인이 가장 효율적이에요 (CPA ${Math.round(best.cpa).toLocaleString('ko-KR')}원, 전환 ${best.conv}건 기준)`});
        if(worst.campaign!==best.campaign){
          const totalCostAll = camps.reduce((a,c)=>a+c.cost,0);
          const worstShare = totalCostAll>0 ? (worst.cost/totalCostAll*100) : 0;
          insights.push({type:'warn', text:`'${worst.campaign}' 캠페인은 CPA가 ${Math.round(worst.cpa).toLocaleString('ko-KR')}원으로 높아요 (전환 ${worst.conv}건, 비용 ${fmtMan(worst.cost)}원 — 전체 비용의 ${worstShare.toFixed(0)}% 기준). 타겟팅이나 소재 점검을 추천해요.`});
          // 예산 재배분 추천: worst 예산의 30%를 best로 옮겼을 때 예상 전환 증가분 (완전히 best 수준까지 가진 않는다고 보수적으로 가정해 best·worst의 중간 CPA로 추정)
          if(worst.cpa > best.cpa * 1.3){
            const shiftMan = Math.round(worst.cost * 0.3 * 10) / 10;
            if(shiftMan >= 1){
              const shiftWon = shiftMan * 10000;
              const dampedCpa = worst.cpa - (worst.cpa - best.cpa) * 0.5;
              const extraConvGain = Math.round(shiftWon/dampedCpa) - Math.round(shiftWon/worst.cpa);
              if(extraConvGain >= 1){
                insights.push({type:'good', text:`💡 '${worst.campaign}' 예산 중 ${fmtMan(shiftMan)}원(약 30%)을 '${best.campaign}'로 옮기면, 같은 총예산으로 전환이 약 ${extraConvGain}건 더 나올 수 있어요 (보수적 추정치 — 예산을 늘려도 효율이 '${best.campaign}' 수준까지 완전히 따라가진 않는다고 가정함).`});
              }
            }
          }
        }
      }
      const prevMonthForZero = months.length>=2 ? months[months.length-2] : null;
      const prevZeroSet = new Set((prevMonthForZero && prevMonthForZero.campaigns) ? prevMonthForZero.campaigns.filter(c=>c.conv===0 && c.cost>1).map(c=>c.campaign) : []);
      const zeroConvCamps = camps.filter(c=>c.conv===0 && c.cost>1).sort((a,b)=>b.cost-a.cost);
      if(zeroConvCamps.length){
        const totalCostAll = camps.reduce((a,c)=>a+c.cost,0);
        const totalWaste = zeroConvCamps.reduce((a,c)=>a+c.cost,0);
        const wastePct = totalCostAll>0 ? (totalWaste/totalCostAll*100) : 0;
        insights.push({type:'warn', text:`전환 0건인 캠페인이 ${zeroConvCamps.length}개예요 — 합쳐서 ${fmtMan(totalWaste)}원, 전체 비용의 ${wastePct.toFixed(0)}%를 썼어요.`});
        zeroConvCamps.slice(0,3).forEach(c=>{
          const share = totalCostAll>0 ? (c.cost/totalCostAll*100) : 0;
          const recurring = prevZeroSet.has(c.campaign) ? ' — 지난 기간에도 전환 0건이었어요, 구조적인 문제일 수 있어요' : '';
          insights.push({type:'warn', text:`ㄴ '${c.campaign}' — ${fmtMan(c.cost)}원 (전체의 ${share.toFixed(1)}%)${recurring}`});
        });
        if(zeroConvCamps.length>3) insights.push({type:'warn', text:`ㄴ 이 외 ${zeroConvCamps.length-3}개 캠페인도 전환 0건이에요. 예산 재배치를 검토해보세요.`});
      }
    } else {
      const withCost = camps.filter(c=>c.cost>=MIN_COST_MAN);
      if(withCost.length>=2){
        const best = withCost.reduce((a,b)=>a.roas>b.roas?a:b);
        const worst = withCost.reduce((a,b)=>a.roas<b.roas?a:b);
        insights.push({type:'good', text:`'${best.campaign}' 캠페인 ROAS가 ${best.roas.toFixed(0)}%로 가장 높아요 (비용 ${fmtMan(best.cost)}원 기준).`});
        if(worst.campaign!==best.campaign && worst.roas<100){
          const totalCostAll2 = camps.reduce((a,c)=>a+c.cost,0);
          const worstShare2 = totalCostAll2>0 ? (worst.cost/totalCostAll2*100) : 0;
          insights.push({type:'warn', text:`'${worst.campaign}' 캠페인은 ROAS가 ${worst.roas.toFixed(0)}%로 손익분기 이하예요 (비용 ${fmtMan(worst.cost)}원 — 전체 비용의 ${worstShare2.toFixed(0)}% 기준). 점검이 필요해요.`});
          if(best.roas > worst.roas * 1.3){
            const shiftMan = Math.round(worst.cost * 0.3 * 10) / 10;
            if(shiftMan >= 1){
              const dampedRoas = worst.roas + (best.roas - worst.roas) * 0.5;
              const extraRevGain = Math.round(shiftMan * (dampedRoas - worst.roas) / 100);
              if(extraRevGain >= 1){
                insights.push({type:'good', text:`💡 '${worst.campaign}' 예산 중 ${fmtMan(shiftMan)}원(약 30%)을 '${best.campaign}'로 옮기면, 같은 총예산으로 매출이 약 ${fmtMan(extraRevGain)}원 더 나올 수 있어요 (보수적 추정치).`});
              }
            }
          }
        }
      }
    }
  }

  // 저효율 캠페인 반복 여부 추적: 최근 최대 4개 기간에서 연속으로 같은 캠페인이 '워스트'로 나타나는지 확인
  if(months.length>=2){
    const recentMonths = months.slice(-4);
    let streakCampaign = null, streak = 0;
    for(let i=recentMonths.length-1;i>=0;i--){
      const m = recentMonths[i];
      if(!m.campaigns || m.campaigns.length<2) break;
      const camps2 = m.campaigns.map(c=>({ campaign:c.campaign, cost:c.cost, conv:c.conv,
        roas: c.cost>0 ? (c.revenue/c.cost*100) : 0, cpa: c.conv>0 ? (c.cost*10000/c.conv) : null }));
      let worstCamp = null;
      if(isDB){
        const withConv2 = camps2.filter(c=>c.cpa!==null && c.conv>=MIN_CONV);
        if(withConv2.length>=2) worstCamp = withConv2.reduce((a,b)=>a.cpa>b.cpa?a:b).campaign;
      } else {
        const withCost2 = camps2.filter(c=>c.cost>=MIN_COST_MAN);
        if(withCost2.length>=2) worstCamp = withCost2.reduce((a,b)=>a.roas<b.roas?a:b).campaign;
      }
      if(!worstCamp) break;
      if(streakCampaign===null){ streakCampaign = worstCamp; streak = 1; }
      else if(worstCamp===streakCampaign){ streak++; }
      else break;
    }
    if(streak>=2){
      insights.push({type:'warn', text:`⏱️ '${streakCampaign}' 캠페인이 ${streak}개 기간 연속으로 가장 저효율로 나타났어요. 일시적 변동이 아니라 구조적인 문제일 가능성이 높아요 — 우선 점검을 추천해요.`});
    }
  }
  if(months.length>=2){
    const prev = months[months.length-2], curr = months[months.length-1];
    if(isDB){
      const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : 0, currCpa = curr.conv>0 ? (curr.cost*10000/curr.conv) : 0;
      if(prevCpa>0 && currCpa>0 && prev.conv>=MIN_CONV*2 && curr.conv>=MIN_CONV*2){
        const diff = (currCpa-prevCpa)/prevCpa*100;
        insights.push({type: diff<=0?'good':'warn', text:`직전 기간 대비 CPA가 ${Math.abs(diff).toFixed(0)}% ${diff<=0?'개선':'상승'}됐어요 (${Math.round(prevCpa).toLocaleString('ko-KR')}원 → ${Math.round(currCpa).toLocaleString('ko-KR')}원, 전환 ${prev.conv}→${curr.conv}건).`});
      }
    } else {
      const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : 0, currRoas = curr.cost>0 ? (curr.revenue/curr.cost*100) : 0;
      if(prevRoas>0 && prev.cost>=MIN_COST_MAN*2 && curr.cost>=MIN_COST_MAN*2){
        const diff = currRoas-prevRoas;
        insights.push({type: diff>=0?'good':'warn', text:`직전 기간 대비 ROAS가 ${Math.abs(diff).toFixed(1)}%p ${diff>=0?'상승':'하락'}했어요.`});
      }
    }
  }
  // 예산 소진/운영 중단 의심: 최근 기간 중 비용이 직전 평균 대비 크게 낮은 날 감지
  if(last && last.daily && last.daily.length>=8){
    const daily = last.daily;
    const anomalies = [];
    for(let i=7;i<daily.length;i++){
      const window = daily.slice(i-7,i);
      const avgCost = window.reduce((a,d)=>a+d.cost,0)/window.length;
      if(avgCost<0.5) continue; // 평소에도 지출이 거의 없으면 스킵(노이즈 방지)
      if(daily[i].cost < avgCost*0.5){
        anomalies.push({ date:daily[i].date, cost:daily[i].cost, avgCost });
      }
    }
    if(anomalies.length){
      const recent = anomalies[anomalies.length-1];
      insights.push({type:'warn', text:`${recent.date}에 비용이 직전 1주 평균(${fmtMan(recent.avgCost)}원) 대비 크게 낮았어요 (${fmtMan(recent.cost)}원). 예산 소진이나 광고 운영 중단 여부를 확인해보세요.`});
    }
  }

  // 전년 동월(YoY) 비교: 같은 달 라벨의 작년 데이터가 있으면 비교
  if(last){
    const ym = last.label.match(/(\d{4})\D*(\d{1,2})/);
    if(ym){
      const y = parseInt(ym[1],10), mo = ym[2].padStart(2,'0');
      const prevYearLabel = `${y-1}.${mo}`;
      const allMonthsFull = data.months || [];
      const prevYearMonth = allMonthsFull.find(mm=>mm.label===prevYearLabel);
      if(prevYearMonth){
        if(isDB){
          const pyCpa = prevYearMonth.conv>0 ? (prevYearMonth.cost*10000/prevYearMonth.conv) : 0;
          const curCpa = last.conv>0 ? (last.cost*10000/last.conv) : 0;
          if(pyCpa>0 && curCpa>0 && prevYearMonth.conv>=MIN_CONV*2 && last.conv>=MIN_CONV*2){
            const diff = (curCpa-pyCpa)/pyCpa*100;
            insights.push({type: diff<=0?'good':'warn', text:`📅 작년 동월(${prevYearLabel}) 대비 CPA가 ${Math.abs(diff).toFixed(0)}% ${diff<=0?'개선':'상승'}됐어요 (${Math.round(pyCpa).toLocaleString('ko-KR')}원 → ${Math.round(curCpa).toLocaleString('ko-KR')}원).`});
          }
        } else {
          const pyRoas = prevYearMonth.cost>0 ? (prevYearMonth.revenue/prevYearMonth.cost*100) : 0;
          const curRoas = last.cost>0 ? (last.revenue/last.cost*100) : 0;
          if(pyRoas>0 && prevYearMonth.cost>=MIN_COST_MAN*2 && last.cost>=MIN_COST_MAN*2){
            const diff = curRoas-pyRoas;
            insights.push({type: diff>=0?'good':'warn', text:`📅 작년 동월(${prevYearLabel}) 대비 ROAS가 ${Math.abs(diff).toFixed(1)}%p ${diff>=0?'상승':'하락'}했어요 (${pyRoas.toFixed(0)}% → ${curRoas.toFixed(0)}%).`});
          }
        }
      }
    }
  }

  // 예산 페이싱: 이번 달이 아직 진행 중이면, 지금 페이스로 월말까지 갔을 때 예상 비용을 직전 달과 비교
  if(last && last.daily && last.daily.length>=3){
    const todayDate = new Date();
    const lm = last.label.match(/(\d{4})\D*(\d{1,2})/);
    if(lm && parseInt(lm[1],10)===todayDate.getFullYear() && parseInt(lm[2],10)===(todayDate.getMonth()+1)){
      const daysElapsed = last.daily.length;
      const daysInMonth = new Date(todayDate.getFullYear(), todayDate.getMonth()+1, 0).getDate();
      if(daysElapsed>=3 && daysElapsed<daysInMonth){
        const avgDailyCost = last.cost / daysElapsed;
        const projectedCost = avgDailyCost * daysInMonth;
        const budgetTargetMan = data.goal && data.goal.budgetTarget ? data.goal.budgetTarget/10000 : null;
        if(budgetTargetMan && budgetTargetMan>0){
          const paceRatio = projectedCost / budgetTargetMan;
          if(paceRatio>=1.05){
            const exhaustDay = Math.min(daysInMonth, Math.ceil(budgetTargetMan / avgDailyCost));
            insights.push({type:'warn', text:`💸 이번 달(${last.label}) 예산 목표 ${fmtMan(budgetTargetMan)}원 대비, 지금 페이스면 약 ${fmtMan(projectedCost)}원까지 쓰게 돼요 (${Math.round(paceRatio*100)}%). 이 속도면 ${exhaustDay}일쯤 예산을 다 쓸 것으로 보여요. (${daysElapsed}/${daysInMonth}일 데이터 기준 추정)`});
          } else if(paceRatio<=0.7){
            insights.push({type:'good', text:`💸 이번 달(${last.label}) 예산 목표 ${fmtMan(budgetTargetMan)}원 대비, 지금 페이스면 약 ${fmtMan(projectedCost)}원(${Math.round(paceRatio*100)}%)만 쓸 것으로 보여요. 예산이 남을 수 있어요 — 확대 여지를 검토해보세요.`});
          }
        } else {
          const prevMonthForCompare = months.length>=2 ? months[months.length-2] : null;
          if(prevMonthForCompare && prevMonthForCompare.cost>1){
            const diff = (projectedCost - prevMonthForCompare.cost)/prevMonthForCompare.cost*100;
            if(Math.abs(diff)>=15){
              insights.push({type: diff>0?'warn':'good', text:`⏳ 지금 페이스대로면 이번 달(${last.label}) 예상 총 비용은 약 ${fmtMan(projectedCost)}원으로, 직전 달(${fmtMan(prevMonthForCompare.cost)}원)보다 ${Math.abs(diff).toFixed(0)}% ${diff>0?'많을':'적을'} 것으로 보여요. (${daysElapsed}/${daysInMonth}일 데이터 기준 추정)`});
            }
          }
        }
      }
    }
  }

  // 목표(KPI) 대비 진행률
  if(data.goal && data.goal.target && last){
    if(isDB && data.goal.metric==='cpa'){
      const currCpa = last.conv>0 ? (last.cost*10000/last.conv) : null;
      if(currCpa!==null && last.conv>=MIN_CONV){
        const diff = (currCpa-data.goal.target)/data.goal.target*100;
        insights.push({type: diff<=0?'good':'warn', text:`🎯 목표 CPA ${Number(data.goal.target).toLocaleString('ko-KR')}원 대비 이번 기간 CPA는 ${Math.round(currCpa).toLocaleString('ko-KR')}원이에요 (${diff<=0?'목표 달성, 목표보다 '+Math.abs(diff).toFixed(0)+'% 낮아요':'목표보다 '+Math.abs(diff).toFixed(0)+'% 높아요 — 점검이 필요해요'}).`});
      }
    } else if(!isDB && data.goal.metric==='roas'){
      const currRoas = last.cost>0 ? (last.revenue/last.cost*100) : null;
      if(currRoas!==null && last.cost>=MIN_COST_MAN){
        const diff = currRoas-data.goal.target;
        insights.push({type: diff>=0?'good':'warn', text:`🎯 목표 ROAS ${data.goal.target}% 대비 이번 기간 ROAS는 ${currRoas.toFixed(0)}%예요 (${diff>=0?'목표 달성, +'+diff.toFixed(0)+'%p':'목표 미달, -'+Math.abs(diff).toFixed(0)+'%p'}).`});
      }
    }
  }

  if(!insights.length){
    insights.push({type:'neutral', text:'아직 인사이트를 뽑기엔 데이터가 더 필요해요. 다음 기간 데이터가 쌓이면 자동으로 분석돼요.'});
  }
  return insights;
}
// 목표(KPI)·예산 위젯 — 관리 탭에서 설정한 목표를 진행바로 눈에 띄게 보여줌.

function renderGoalPanelHTML(data, months, isDB){
  if(!data.goal || !data.goal.target) return '';
  const last = months[months.length-1];
  if(!last) return '';
  const MIN_CONV = 5, MIN_COST_MAN = 5;
  let goalHtml = '';
  if(isDB && data.goal.metric==='cpa'){
    const currCpa = last.conv>0 ? (last.cost*10000/last.conv) : null;
    if(currCpa!==null && last.conv>=MIN_CONV){
      const target = Number(data.goal.target);
      const met = currCpa<=target;
      const ratio = target>0 ? Math.min(1, target/currCpa) : 0; // CPA는 낮을수록 좋아서, 목표 대비 얼마나 근접했는지를 역수 비율로 표시
      const pct = Math.round(ratio*100);
      goalHtml = `
      <div style="margin-bottom:${data.goal.budgetTarget?'14px':'0'};">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">

          <span style="font-size:13px;font-weight:700;color:${met?'var(--up)':'var(--down)'};">${Math.round(currCpa).toLocaleString('ko-KR')}원 (${met?'달성':'미달'})</span>
        </div>
        <div style="height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;">
          <div style="height:100%;width:${pct}%;border-radius:5px;background:${met?'var(--up)':'var(--down)'};"></div>
        </div>
      </div>`;
    }
  } else if(!isDB && data.goal.metric==='roas'){
    const currRoas = last.cost>0 ? (last.revenue/last.cost*100) : null;
    if(currRoas!==null && last.cost>=MIN_COST_MAN){
      const target = Number(data.goal.target);
      const met = currRoas>=target;
      const pct = target>0 ? Math.round(Math.min(1, currRoas/target)*100) : 0;
      goalHtml = `
      <div style="margin-bottom:${data.goal.budgetTarget?'14px':'0'};">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <span style="font-size:12px;color:var(--muted);">🎯 목표 ROAS ${target}% 대비</span>
          <span style="font-size:13px;font-weight:700;color:${met?'var(--up)':'var(--down)'};">${currRoas.toFixed(0)}% (${met?'달성':'미달'})</span>
        </div>
        <div style="height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;">
          <div style="height:100%;width:${pct}%;border-radius:5px;background:${met?'var(--up)':'var(--down)'};"></div>
        </div>
      </div>`;
    }
  }
  let budgetHtml = '';
  if(data.goal.budgetTarget){
    const budgetTargetMan = data.goal.budgetTarget/10000;
    const todayDate = new Date();
    const lm = last.label.match(/(\d{4})\D*(\d{1,2})/);
    const isCurrentMonth = lm && parseInt(lm[1],10)===todayDate.getFullYear() && parseInt(lm[2],10)===(todayDate.getMonth()+1);
    const spent = last.cost||0;
    const spentPct = budgetTargetMan>0 ? Math.min(1, spent/budgetTargetMan) : 0;
    let paceTxt = '';
    if(isCurrentMonth && last.daily && last.daily.length>=3){
      const daysElapsed = last.daily.length;
      const daysInMonth = new Date(todayDate.getFullYear(), todayDate.getMonth()+1, 0).getDate();
      if(daysElapsed<daysInMonth){
        const avgDailyCost = spent/daysElapsed;
        const projectedCost = avgDailyCost*daysInMonth;
        const paceRatio = budgetTargetMan>0 ? projectedCost/budgetTargetMan : 0;
        if(paceRatio>=1.05){
          const exhaustDay = Math.min(daysInMonth, Math.ceil(budgetTargetMan/avgDailyCost));
          paceTxt = `<div style="font-size:11px;color:var(--down);margin-top:5px;">⚠️ 이 페이스면 ${exhaustDay}일쯤 예산 소진 예상 (월말 예상 ${fmtMan(projectedCost)}원)</div>`;
        } else {
          paceTxt = `<div style="font-size:11px;color:var(--muted);margin-top:5px;">이 페이스면 월말 예상 ${fmtMan(projectedCost)}원 (${Math.round(paceRatio*100)}%)</div>`;
        }
      }
    }
    const overBudget = spent>budgetTargetMan;
    budgetHtml = `
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <span style="font-size:12px;color:var(--muted);">💰 예산 목표 ${fmtMan(budgetTargetMan)}원 대비</span>

          <div style="height:100%;width:${Math.round(spentPct*100)}%;border-radius:5px;background:${overBudget?'var(--down)':'var(--accent)'};"></div>
        </div>
        ${paceTxt}
      </div>`;
  }
  if(!goalHtml && !budgetHtml) return '';
  return `<div class="panel" style="margin-bottom:18px;">${goalHtml}${budgetHtml}</div>`;
}
// 인사이트를 type별(good/warn/neutral)로 묶어서 보여줌 — 경고만 쭉 나열되면 리포트가 부정적으로만 읽히기 쉬워서,
// 잘하고 있는 부분(good)을 먼저 소제목과 함께 보여주고, 그 다음에 확인이 필요한 부분(warn)을 보여줌.
// 각 그룹 내부의 순서는 generateInsights()가 만든 원래 순서를 그대로 유지함(중요도 순).
// 예산 재배분 시뮬레이터 — generateInsights()의 예산 재배분 추천(worst→best 중간 CPA로 보수적 추정)과
// 같은 계산 방식을 캠페인 2개 선택 + 이동 비율 슬라이더로 인터랙티브하게 확장한 것.
// "완전히 best 캠페인 수준까지 효율이 따라가진 않는다"고 보수적으로 가정(중간값)하는 방식은 동일하게 유지.

function computeBudgetSimResult(months, isDB, fromCampaign, toCampaign, shiftPct){
  const last = months[months.length-1];
  const camps = (last.campaigns||[]);
  const from = camps.find(c=>c.campaign===fromCampaign);
  const to = camps.find(c=>c.campaign===toCampaign);
  if(!from || !to || from.campaign===to.campaign) return null;
  const shiftMan = Math.round(from.cost * (shiftPct/100) * 10) / 10;
  if(shiftMan < 0.1) return { shiftMan: 0, tooSmall: true };
  if(isDB){
    const fromCpa = from.conv>0 ? (from.cost*10000/from.conv) : null;
    const toCpa = to.conv>0 ? (to.cost*10000/to.conv) : null;
    if(fromCpa===null || toCpa===null) return { shiftMan, noData: true };
    const shiftWon = shiftMan * 10000;
    // 이동한 예산이 to 캠페인에서 완전히 to 수준 효율로 전환되진 않는다고 보수적으로 가정(중간 CPA)
    const dampedCpa = toCpa + (fromCpa - toCpa) * 0.5 >= toCpa ? toCpa + Math.abs(fromCpa - toCpa) * 0.5 : toCpa;
    const lostConv = shiftWon / fromCpa;
    const gainedConv = shiftWon / dampedCpa;
    const netConv = gainedConv - lostConv;
    return { shiftMan, fromCpa, toCpa, lostConv, gainedConv, netConv, metric:'conv' };
  }else{
    const fromRoas = from.cost>0 ? (from.revenue/from.cost) : 0;
    const toRoas = to.cost>0 ? (to.revenue/to.cost) : 0;
    const shiftWon = shiftMan * 10000;
    const dampedRoas = toRoas - (toRoas - fromRoas) * 0.5;
    const lostRevenue = shiftWon * fromRoas;
    const gainedRevenue = shiftWon * dampedRoas;
    const netRevenueMan = (gainedRevenue - lostRevenue) / 10000;
    return { shiftMan, fromRoas: fromRoas*100, toRoas: toRoas*100, netRevenueMan, metric:'revenue' };
  }
}
function renderBudgetSimResult(){
  const panel = document.getElementById('budgetSimPanel');
  if(!panel) return;
  const isDB = panel.dataset.isdb === '1';
  const fromCampaign = decodeURIComponent(document.getElementById('simFromCamp').value);
  const toCampaign = decodeURIComponent(document.getElementById('simToCamp').value);
  const shiftPct = Number(document.getElementById('simShiftPct').value);
  document.getElementById('simShiftPctLabel').textContent = shiftPct + '%';
  const body = document.getElementById('simResultBody');
  const data = window.__currentClientData;
  if(!data){ body.textContent = ''; return; }
  const allMonths = data.months || [];
  const result = computeBudgetSimResult(allMonths, isDB, fromCampaign, toCampaign, shiftPct);
  if(!result){ body.innerHTML = `<span style="color:var(--muted);">같은 캠페인은 비교할 수 없어요.</span>`; return; }
  if(result.tooSmall){ body.innerHTML = `<span style="color:var(--muted);">이동할 예산이 너무 작아요.</span>`; return; }
  if(result.noData){ body.innerHTML = `<span style="color:var(--muted);">전환 데이터가 부족해서 추정할 수 없어요.</span>`; return; }
  if(result.metric==='conv'){
    const sign = result.netConv >= 0 ? '+' : '';
    const color = result.netConv >= 0 ? 'var(--up)' : 'var(--down)';
    body.innerHTML = `${fmtMan(result.shiftMan)}원을 옮기면(CPA ${Math.round(result.fromCpa).toLocaleString('ko-KR')}원 → ${Math.round(result.toCpa).toLocaleString('ko-KR')}원 캠페인으로), 예상 전환수 변화는 <b style="color:${color};">${sign}${result.netConv.toFixed(1)}건</b> 이에요.<br><span style="font-size:11px;color:var(--muted);">(옮긴 예산이 대상 캠페인에서 완전히 같은 효율로 전환되진 않는다고 보수적으로 가정한 추정치예요 — 실제 결과는 다를 수 있어요.)</span>`;
  }else{
    const sign = result.netRevenueMan >= 0 ? '+' : '';
    const color = result.netRevenueMan >= 0 ? 'var(--up)' : 'var(--down)';
    body.innerHTML = `${fmtMan(result.shiftMan)}원을 옮기면(ROAS ${result.fromRoas.toFixed(0)}% → ${result.toRoas.toFixed(0)}% 캠페인으로), 예상 매출 변화는 <b style="color:${color};">${sign}${fmtMan(Math.abs(result.netRevenueMan))}원</b> 이에요.<br><span style="font-size:11px;color:var(--muted);">(옮긴 예산이 대상 캠페인에서 완전히 같은 효율로 전환되진 않는다고 보수적으로 가정한 추정치예요 — 실제 결과는 다를 수 있어요.)</span>`;
  }
}

function buildInsightsHTML(insights){
  const icon = t => t==='good' ? '📈' : t==='warn' ? '⚠️' : 'ℹ️';
  const color = t => t==='good' ? 'var(--up)' : t==='warn' ? 'var(--down)' : 'var(--muted)';
  const row = i => `<div style="display:flex;gap:8px;font-size:12.5px;color:var(--text);padding:5px 0;"><span>${icon(i.type)}</span><span style="color:${color(i.type)==='var(--muted)'?'var(--text)':color(i.type)};">${i.text}</span></div>`;
  const good = insights.filter(i=>i.type==='good');
  const warn = insights.filter(i=>i.type==='warn');
  const neutral = insights.filter(i=>i.type!=='good'&&i.type!=='warn');
  const groupLabel = (text, count) => `<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:${count?'10px':'0'} 0 2px;">${text}</div>`;
  let html = `<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;">💡 성과 인사이트</div>`;
  if(good.length) html += groupLabel('잘하고 있어요', 0) + good.map(row).join('');
  if(warn.length) html += groupLabel('확인이 필요해요', good.length) + warn.map(row).join('');
  if(neutral.length) html += neutral.map(row).join('');
  return html;
}

// 네이버 광고관리자의 알림 기능처럼, 페이지를 직접 열지 않아도 전체 업체를 훑어서
// CPA 급등/ROAS 급락/전환 0건 캠페인/예산 소진 임박을 감지해 보여줌.
// 이메일 발송 없이 시스템 내 알림(뱃지+드롭다운)으로만 동작 — 읽음 처리는 localStorage에 저장.
const ALERT_SEEN_KEY = 'ad_dashboard_seen_alerts';
const ALERT_CPA_SPIKE_PCT = 20;   // 직전 기간 대비 CPA가 이 %이상 나빠지면 알림
const ALERT_ROAS_DROP_PCT = 10;   // 직전 기간 대비 ROAS가 이 %p이상 나빠지면 알림
function getSeenAlertIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(ALERT_SEEN_KEY)||'[]')); }catch(e){ return new Set(); }
}
function markAlertsSeen(ids){
  try{
    const seen = getSeenAlertIds();
    ids.forEach(id=>seen.add(id));
    // 오래된 항목이 무한히 쌓이는 걸 막기 위해 최근 500개만 유지
    const arr = [...seen].slice(-500);
    localStorage.setItem(ALERT_SEEN_KEY, JSON.stringify(arr));
  }catch(e){ console.error(e); }
}
async function computeAlerts(){
  const keys = await listClients();
  const alerts = [];
  const todayDate = new Date();
  const todayStr = todayDate.toISOString().slice(0,10);
  for(const key of keys){
    let data;
    try{ data = await getClient(key); }catch(e){ continue; }
    if(!data || !data.months || !data.months.length) continue;
    const months = data.months;
    const last = months[months.length-1];
    const prev = months.length>=2 ? months[months.length-2] : null;
    const isDB = data.bizType==='DB';
    const name = data.name;
    if(prev){
      if(isDB){
        const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : null;
        const currCpa = last.conv>0 ? (last.cost*10000/last.conv) : null;
        if(prevCpa && currCpa && last.conv>=5 && prev.conv>=5){
          const diff = (currCpa-prevCpa)/prevCpa*100;
          if(diff>=ALERT_CPA_SPIKE_PCT){
            alerts.push({ id:`${key}:cpa-spike:${last.label}`, key, name, icon:'📈', text:`CPA가 직전 기간 대비 ${diff.toFixed(0)}% 상승했어요 (${Math.round(prevCpa).toLocaleString('ko-KR')}원 → ${Math.round(currCpa).toLocaleString('ko-KR')}원)` });
          }
        }
      } else {
        const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : null;
        const currRoas = last.cost>0 ? (last.revenue/last.cost*100) : null;
        if(prevRoas!==null && currRoas!==null && last.cost>=5 && prev.cost>=5){
          const diff = prevRoas-currRoas;
          if(diff>=ALERT_ROAS_DROP_PCT){
            alerts.push({ id:`${key}:roas-drop:${last.label}`, key, name, icon:'📉', text:`ROAS가 직전 기간 대비 ${diff.toFixed(0)}%p 하락했어요 (${prevRoas.toFixed(0)}% → ${currRoas.toFixed(0)}%)` });
          }
        }
      }
    }
    if(last.campaigns && last.campaigns.length){
      const zeroConv = last.campaigns.filter(c=>(c.cost||0)>=1 && (c.conv||0)===0);
      if(zeroConv.length){
        const totalWaste = zeroConv.reduce((s,c)=>s+c.cost,0);
        alerts.push({ id:`${key}:zero-conv:${last.label}`, key, name, icon:'🚫', text:`전환 0건인 캠페인이 ${zeroConv.length}개 있어요 (합계 비용 ${fmtWon(totalWaste)}원)` });
      }
    }
    if(data.goal && data.goal.budgetTarget && last.daily && last.daily.length>=3){
      const lm = last.label.match(/(\d{4})\D*(\d{1,2})/);
      if(lm && parseInt(lm[1],10)===todayDate.getFullYear() && parseInt(lm[2],10)===(todayDate.getMonth()+1)){
        const daysElapsed = last.daily.length;
        const daysInMonth = new Date(todayDate.getFullYear(), todayDate.getMonth()+1, 0).getDate();
        if(daysElapsed<daysInMonth){
          const avgDailyCost = last.cost/daysElapsed;
          const projectedCost = avgDailyCost*daysInMonth;
          const budgetTargetMan = data.goal.budgetTarget/10000;
          if(budgetTargetMan>0 && projectedCost/budgetTargetMan>=1.05){
            const exhaustDay = Math.min(daysInMonth, Math.ceil(budgetTargetMan/avgDailyCost));
            alerts.push({ id:`${key}:budget-pace:${todayStr}`, key, name, icon:'💸', text:`이 페이스면 예산이 ${exhaustDay}일쯤 소진될 것으로 보여요 (목표 ${fmtMan(budgetTargetMan)}원)` });
          }
        }
      }
    }
  }
  return alerts;
}

        <span style="font-size:14px;flex-shrink:0;">${a.icon}</span>

          <div style="font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4;">${a.text}</div>
        </div>
      </div>`;

  `;
  dropdown.querySelectorAll('.alert-item').forEach(el=>{

const monthFilterState = {}; // key -> 'ALL' or specific label
const compareMonthState = {}; // key -> 'AUTO' or specific label to compare against
const topPanelState = {}; // key -> 'keyword' or 'searchterm'
function renderCard(data){
  window.__currentClientData = data;

  const fstate = ensureFilterState(key, data);
  document.documentElement.style.setProperty('--accent', data.color);
  const allMonths = data.months || [];
  if(!(key in monthFilterState)) monthFilterState[key] = 'ALL';

  const months = selectedMonth==='ALL' ? allMonths : allMonths.filter(m=>m.label===selectedMonth);
  const campaignList = mergedCampaignList(data);

    renderFilterPanel(key, data, campaignList, allTypes);
  }
}
function renderCardInner(data, key, fstate, allMonths, selectedMonth, months, campaignList, allTypes){

  // 기간(월)별로 필터링된 합계 계산 (dailyByCampaign 기준, 필터 대상 데이터 없으면 월 전체 합계 사용)
  function monthFiltered(m){
    if(!m.dailyByCampaign || !m.dailyByCampaign.length){
      return { revenue:m.revenue, cost:m.cost, conv:m.conv, impressions:m.impressions||0, clicks:m.clicks||0 };
    }
    let rev=0,cost=0,conv=0,imp=0,click=0;
    m.dailyByCampaign.forEach(r=>{
      if(fstate.campaigns.has(r.campaign)){
        rev+=r.revenue; cost+=r.cost; conv+=r.conv; imp+=(r.impressions||0); click+=(r.clicks||0);
      }
    });
    return { revenue:rev, cost:cost, conv:conv, impressions:imp, clicks:click };
  }

  const labels = months.map(m=>m.label);
  const fMonths = months.map(monthFiltered);
  const revs = fMonths.map(m=>m.revenue);
  const costs = fMonths.map(m=>m.cost);
  const convs = fMonths.map(m=>m.conv);
  const imps = fMonths.map(m=>m.impressions);
  const clicksArr = fMonths.map(m=>m.clicks);
  const roas = revs.map((r,i)=> costs[i]>0 ? (r/costs[i])*100 : 0);
  const cpaArr = costs.map((c,i)=> convs[i]>0 ? Math.round((c*10000)/convs[i]) : 0);
  const ctrArr = imps.map((im,i)=> im>0 ? (clicksArr[i]/im*100) : 0);

  const totalRevenueMan = revs.reduce((a,b)=>a+b,0);
  const totalCostMan = costs.reduce((a,b)=>a+b,0);
  const totalConv = convs.reduce((a,b)=>a+b,0);
  const totalImp = imps.reduce((a,b)=>a+b,0);
  const totalClick = clicksArr.reduce((a,b)=>a+b,0);
  const totalRoas = totalCostMan>0 ? (totalRevenueMan/totalCostMan)*100 : 0;
  const avgRoas = roas.length ? roas.reduce((a,b)=>a+b,0)/roas.length : 0;
  const avgCpa = totalConv>0 ? Math.round((totalCostMan*10000)/totalConv) : 0;

  const firstRoas = roas[0]||0, lastRoas = roas[roas.length-1]||0;
  const roasDeltaPt = lastRoas - firstRoas;
  const firstCpa = cpaArr[0]||0, lastCpa = cpaArr[cpaArr.length-1]||0;
  const cpaDeltaPct = firstCpa>0 ? ((firstCpa-lastCpa)/firstCpa*100) : 0;

  const isFullSelection = campaignList.every(c=>fstate.campaigns.has(c.campaign));

  const textColor = contrastText(data.color);
  const initial = (data.name||'?').trim().charAt(0);

  // 필터링된 일별 데이터 (dailyByCampaign 기준, 없으면 daily로 대체)
  const dailyAll = [];
  months.forEach(m=>{
    if(m.dailyByCampaign && m.dailyByCampaign.length){
      const byDate = {};
      m.dailyByCampaign.forEach(r=>{
        if(!fstate.campaigns.has(r.campaign)) return;
        if(!byDate[r.date]) byDate[r.date] = {date:r.date, impressions:0, clicks:0, cost:0, revenue:0, conv:0};
        byDate[r.date].impressions += (r.impressions||0);
        byDate[r.date].clicks += (r.clicks||0);
        byDate[r.date].cost += r.cost;
        byDate[r.date].revenue += r.revenue;
        byDate[r.date].conv += r.conv;
      });
      Object.values(byDate).forEach(v=>dailyAll.push(v));
    } else if(m.daily && m.daily.length){
      m.daily.forEach(d=>dailyAll.push(d));
    } else {
      dailyAll.push({ date:m.label, impressions:m.impressions||0, clicks:m.clicks||0, revenue:m.revenue, cost:m.cost, conv:m.conv });
    }
  });
  dailyAll.sort((a,b)=> dateKey(a.date).localeCompare(dateKey(b.date)));

  const sp = arr => sparkPath(arr, 100, 24);
  // 비교 기간: 사용자가 직접 고를 수 있음 (compareMonthState[key]), 기본은 직전 기간 자동
  const refLabel = selectedMonth!=='ALL' ? selectedMonth : (allMonths.length ? allMonths[allMonths.length-1].label : null);
  if(!(key in compareMonthState)) compareMonthState[key] = 'AUTO';
  let cmpLabel = compareMonthState[key];
  if(cmpLabel==='AUTO'){
    const ridx = allMonths.findIndex(m=>m.label===refLabel);
    cmpLabel = (ridx>0) ? allMonths[ridx-1].label : null;
  }
  const refMonthObj = refLabel ? allMonths.find(m=>m.label===refLabel) : null;
  const cmpMonthObj = cmpLabel ? allMonths.find(m=>m.label===cmpLabel) : null;
  const refF = refMonthObj ? monthFiltered(refMonthObj) : null;
  const cmpF = cmpMonthObj ? monthFiltered(cmpMonthObj) : null;
  function derivedMetrics(f){
    if(!f) return null;
    const roasV = f.cost>0 ? (f.revenue/f.cost*100) : 0;
    const cpaV = f.conv>0 ? Math.round((f.cost*10000)/f.conv) : null;
    const ctrV = f.impressions>0 ? (f.clicks/f.impressions*100) : 0;
    return { cost:f.cost, revenue:f.revenue, conv:f.conv, impressions:f.impressions, clicks:f.clicks, roas:roasV, cpa:cpaV, ctr:ctrV };
  }
  const refD = derivedMetrics(refF), cmpD = derivedMetrics(cmpF);
  function pctChange2(field){
    if(!refD || !cmpD) return null;
    const curr = refD[field], prev = cmpD[field];
    if(curr===null || prev===null || curr===undefined || prev===undefined) return null;
    if(prev===0) return curr>0 ? 100 : null;
    return (curr-prev)/prev*100;
  }
  function pctChange(arr){
    if(!arr || arr.length<2) return null;
    const prev = arr[arr.length-2], curr = arr[arr.length-1];
    if(prev===0) return curr>0 ? 100 : null;
    return (curr-prev)/prev*100;
  }
  // '전체 기간(누적)'을 보고 있을 때는 큰 숫자(kpi-value)가 전체 누적 합계인데,
  // 옆의 변화율 배지는 refLabel(가장 최근 달) vs 그 직전 달만 비교한 값이라 기준이 서로 다름.
  // 라벨 없이 붙이면 "누적값이 36% 줄었다"로 오독하기 쉬워서, 이 경우엔 "최근달" 표시를 붙여 기준을 명확히 함.
  const isCumulativeView = selectedMonth==='ALL';
  function trendBadge(pct, goodDir){
    if(pct===null || pct===undefined || !isFinite(pct)) return '';
    const arrow = pct>=0 ? '▲' : '▼';
    const cumHint = isCumulativeView ? `<span style="font-size:8.5px;font-weight:600;opacity:.75;margin-right:2px;">최근달</span>` : '';
    return `<div class="kpi-note ${pct>=0?'up':'down'}" style="display:flex;align-items:center;">${cumHint}${arrow}${Math.abs(pct).toFixed(0)}%</div>`;
  }
  // 관리 탭에서 설정한 목표(KPI) 대비 지금 달성했는지를 KPI 카드 옆에 작은 배지로 바로 보여줌
  // (기존에는 "성과 인사이트" 목록 안 문장으로만 나와서 눈에 잘 안 띄었음 — 같은 목표 데이터를 재사용해서 배지로도 노출)
  function goalBadge(currentValue, isDB, clientData){
    if(!clientData.goal || !clientData.goal.target) return '';
    if(isDB && clientData.goal.metric!=='cpa') return '';
    if(!isDB && clientData.goal.metric!=='roas') return '';
    if(currentValue===null || currentValue===undefined || !isFinite(currentValue)) return '';
    const target = Number(clientData.goal.target);
    if(!target) return '';
    const met = isDB ? currentValue<=target : currentValue>=target; // CPA는 낮을수록, ROAS는 높을수록 목표 달성
    const targetTxt = isDB ? `${target.toLocaleString('ko-KR')}원` : `${target}%`;
    return `<div class="kpi-note ${met?'up':'down'}" title="목표 ${isDB?'CPA':'ROAS'} ${targetTxt} 대비">🎯 ${met?'목표 달성':'목표 미달'}</div>`;
  }
  const revSpark = dailyAll.map(d=>d.revenue);
  const costSpark = dailyAll.map(d=>d.cost);
  const roasSpark = dailyAll.map(d=> d.cost>0 ? (d.revenue/d.cost)*100 : 0);
  const impSpark = dailyAll.map(d=>d.impressions);
  const clickSpark = dailyAll.map(d=>d.clicks);
  const convSpark = dailyAll.map(d=>d.conv);

  // 요일별 집계 (필터링된 dailyAll 기준)
  const weekdayAgg = Array.from({length:7}, ()=>({cost:0,revenue:0,conv:0,clicks:0,impressions:0}));
  dailyAll.forEach(d=>{
    const wd = weekdayOf(d.date);
    if(wd===null) return;
    weekdayAgg[wd].cost += d.cost; weekdayAgg[wd].revenue += d.revenue; weekdayAgg[wd].conv += d.conv;
    weekdayAgg[wd].clicks += (d.clicks||0); weekdayAgg[wd].impressions += (d.impressions||0);
  });
  // 월~일 순서로 재배열 (0=일 -> 인덱스 6으로)
  const order = [1,2,3,4,5,6,0];
  const wLabels = order.map(i=>WEEKDAY_LABELS[i]);
  const wCtr = order.map(i=> weekdayAgg[i].impressions>0 ? Number((weekdayAgg[i].clicks/weekdayAgg[i].impressions*100).toFixed(2)) : 0);
  const wCvr = order.map(i=> weekdayAgg[i].clicks>0 ? Number((weekdayAgg[i].conv/weekdayAgg[i].clicks*100).toFixed(2)) : 0);
  const wImp = order.map(i=>Math.round(weekdayAgg[i].impressions));
  const wClick = order.map(i=>Math.round(weekdayAgg[i].clicks));
  const wConv = order.map(i=>Math.round(weekdayAgg[i].conv));

  // TOP 키워드 (가장 최근 기간의 keywordsByCampaign 중 선택된 캠페인만 병합)
  let topKeywords = [];
  const lastMonth = months[months.length-1];
  if(lastMonth && lastMonth.keywordsByCampaign){
    Object.keys(lastMonth.keywordsByCampaign).forEach(camp=>{
      if(!fstate.campaigns.has(camp)) return;
      lastMonth.keywordsByCampaign[camp].forEach(kw=> topKeywords.push(kw));
    });
    const hasRevenue = topKeywords.some(k=>k.revenue>0);
    topKeywords.sort((a,b)=> hasRevenue ? b.revenue-a.revenue : b.conv-a.conv);
    topKeywords = topKeywords.slice(0,7);
  }

  // TOP 검색어 (검색어 리포트가 있는 경우, 같은 방식으로 병합)
  let topSearchTerms = [];
  let hasSearchTermData = false;
  months.forEach(m=>{ if(m.searchTermsByCampaign && Object.keys(m.searchTermsByCampaign).length) hasSearchTermData = true; });
  if(lastMonth && lastMonth.searchTermsByCampaign){
    Object.keys(lastMonth.searchTermsByCampaign).forEach(camp=>{
      if(!fstate.campaigns.has(camp)) return;
      lastMonth.searchTermsByCampaign[camp].forEach(kw=> topSearchTerms.push(kw));
    });
  }
  // TOP 브랜드검색 키워드도 같은 방식으로 병합
  let topBrandKeywords = [];
  if(lastMonth && lastMonth.brandKeywordsByCampaign){
    Object.keys(lastMonth.brandKeywordsByCampaign).forEach(camp=>{
      if(!fstate.campaigns.has(camp)) return;
      lastMonth.brandKeywordsByCampaign[camp].forEach(kw=> topBrandKeywords.push(kw));
    });
  }
  // 미리보기는 파워링크·쇼핑검색·브랜드검색을 합쳐서 상위 항목만 보여줌 (전체 목록은 keywords.html에서)
  let topRows = [...topKeywords, ...topSearchTerms, ...topBrandKeywords];
  const hasRevenueTop = topRows.some(k=>k.revenue>0);
  topRows.sort((a,b)=> hasRevenueTop ? b.revenue-a.revenue : b.conv-a.conv);
  topRows = topRows.slice(0,7);

  // 제외 추천 후보: 전환 0건인데 비용이 나간 키워드/검색어 (선택된 캠페인 기준, 최근 기간)
  let wasteRows = [];
  if(lastMonth){
    const pushWaste = (byCamp)=>{
      if(!byCamp) return;
      Object.keys(byCamp).forEach(camp=>{
        if(!fstate.campaigns.has(camp)) return;
        byCamp[camp].forEach(w=> wasteRows.push({ keyword:w.keyword, campaign:camp, cost:w.cost }));
      });
    };
    pushWaste(lastMonth.wasteKeywordsByCampaign);
    pushWaste(lastMonth.wasteSearchTermsByCampaign);
    wasteRows.sort((a,b)=>b.cost-a.cost);
    wasteRows = wasteRows.slice(0,7);
  }


  const hourlyAgg = Array.from({ length:24 }, (_,i)=>({ hour:String(i).padStart(2,'0'), impressions:0, clicks:0, cost:0, conv:0 }));
  let hourlyHasCampaignData = false;
  months.forEach(m=>{
    if(m.hourlyByCampaign && m.hourlyByCampaign.length){
      hourlyHasCampaignData = true;
      m.hourlyByCampaign.forEach(h=>{

      });

  });
  if(isFullSelection || !hourlyHasCampaignData){

    months.forEach(m=>{
      (m.hourly||[]).forEach(h=>{
        const idx = parseInt(h.hour,10);
        if(isNaN(idx) || idx<0 || idx>23) return;
        hourlyAgg[idx].impressions += h.impressions||0;
        hourlyAgg[idx].clicks += h.clicks||0;
        hourlyAgg[idx].cost += h.cost||0;
        hourlyAgg[idx].conv += h.conv||0;
      });

  }
  const hourlyFilterLimited = !isFullSelection && !hourlyHasCampaignData;
  const hasHourlyData = hourlyAgg.some(h=>h.impressions>0 || h.cost>0);

  const isDB = data.bizType === 'DB';

        <div>
