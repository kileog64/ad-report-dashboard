      { type:'bar', label:'비용(만원)', data:dCost, backgroundColor:'rgba(255,255,255,.18)', borderRadius:3, yAxisID:'y' },
      { type:'line', label:'전환수(건)', data:dConv, borderColor:data.color, backgroundColor:data.color, tension:.3, pointRadius:dLabels.length>40?0:3, borderWidth:2, yAxisID:'y1' }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#a8abc4',font:{size:12}}}},
      scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:12}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:12}}}, x:{grid:{display:false},ticks:tickCfg} } }
  } : {
    data:{ labels:dLabels, datasets:[
      { type:'bar', label:'매출액(만원)', data:dRev, backgroundColor:'rgba(255,255,255,.18)', borderRadius:3, yAxisID:'y' },
      { type:'line', label:'ROAS(%)', data:dRoas, borderColor:data.color, backgroundColor:data.color, tension:.3, pointRadius:dLabels.length>40?0:3, borderWidth:2, yAxisID:'y1' }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#a8abc4',font:{size:12}}}},
      scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:12}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:12}}}, x:{grid:{display:false},ticks:tickCfg} } }
  });

  // 기간 비교 그래프 (조회기간 vs 비교기간, 일자 기준 막대 나란히 비교)
  if(refD && cmpD && selectedMonth!=='ALL'){
    function dailyFilteredForMonth(m){
      if(!m) return [];
      if(m.dailyByCampaign && m.dailyByCampaign.length){
        const byDate = {};
        m.dailyByCampaign.forEach(r=>{
          if(!fstate.campaigns.has(r.campaign)) return;
          if(!byDate[r.date]) byDate[r.date] = {date:r.date, impressions:0, clicks:0, cost:0, revenue:0, conv:0};
          byDate[r.date].impressions += (r.impressions||0);
          byDate[r.date].clicks += (r.clicks||0);
          byDate[r.date].cost += r.cost;
          byDate[r.date].revenue += r.revenue;
          byDate[r.date].conv += r.conv;
        });
        return Object.values(byDate);
      } else if(m.daily && m.daily.length){
        return m.daily;
      }
      return [];
    }
    function dayOfMonth(dateStr){
      const parts = String(dateStr).split(/\D+/).filter(Boolean);
      return parts.length ? parseInt(parts[parts.length-1],10) : null;
    }
    function toDayMap(arr){
      const map = {};
      arr.forEach(d=>{ const day = dayOfMonth(d.date); if(day) map[day]=d; });
      return map;
    }
    const refDayMap = toDayMap(dailyFilteredForMonth(refMonthObj));
    const cmpDayMap = toDayMap(dailyFilteredForMonth(cmpMonthObj));
    const maxDay = Math.max(0, ...Object.keys(refDayMap).map(Number), ...Object.keys(cmpDayMap).map(Number));
    const compareDayLabels = Array.from({length:maxDay}, (_,i)=>`${i+1}일`);

    function buildCompareChart(metric){
      const refVals = Array.from({length:maxDay}, (_,i)=> refDayMap[i+1] ? (refDayMap[i+1][metric]||0) : null);
      const cmpVals = Array.from({length:maxDay}, (_,i)=> cmpDayMap[i+1] ? (cmpDayMap[i+1][metric]||0) : null);
      if(compareChart) compareChart.destroy();
      const el = document.getElementById('chartCompare');
      if(!el) return;
      compareChart = new Chart(el, {
        type: 'bar',
        data:{ labels:compareDayLabels, datasets:[
          { label:refLabel, data:refVals, backgroundColor:data.color, borderRadius:3, barPercentage:.85, categoryPercentage:.7 },
          { label:cmpLabel, data:cmpVals, backgroundColor:'#ff9d4d', borderRadius:3, barPercentage:.85, categoryPercentage:.7 }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
          scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:11}}}, x:{grid:{display:false},ticks:{color:'#a8abc4',font:{size:10},maxTicksLimit:16}} } }
      });
    }
    let currentCompareMetric = 'cost';
    buildCompareChart(currentCompareMetric);
    document.querySelectorAll('.compare-metric-btn').forEach(btn=>{
      btn.onclick = ()=>{
        currentCompareMetric = btn.dataset.metric;
        document.querySelectorAll('.compare-metric-btn').forEach(b=>{
          const active = b===btn;
          b.style.background = active ? 'var(--accent)' : 'var(--panel)';
          b.style.color = active ? '#fff' : 'var(--muted)';
        });
        buildCompareChart(currentCompareMetric);
      };
    });
  } else if(compareChart){
    compareChart.destroy();
    compareChart = null;
  }

  const WD_METRICS = {
    imp:   { label:'노출수',   data:wImp,   color:'#6e6bff', axis:'count' },
    click: { label:'클릭수',   data:wClick, color:'#3fd4c4', axis:'count' },
    ctr:   { label:'클릭률(%)', data:wCtr,   color:data.color, axis:'pct' },
    cvr:   { label:'전환율(%)', data:wCvr,   color:'#ff5d7a', axis:'pct' },
    conv:  { label:'전환수',   data:wConv,  color:'#ffb84d', axis:'count' },
  };
  function buildChartC(){
    const selected = [...document.querySelectorAll('.wd-metric:checked')].map(cb=>cb.value);
    const datasets = selected.map(k=>{
      const m = WD_METRICS[k];
      return { type:'line', label:m.label, data:m.data, borderColor:m.color, backgroundColor:m.color, tension:.3, pointRadius:3, yAxisID: m.axis==='pct' ? 'y1' : 'y' };
    });
    if(chartC) chartC.destroy();
    chartC = new Chart(document.getElementById('chartC'), {
      data:{ labels:wLabels, datasets },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#a8abc4',font:{size:11}}}},
        scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:11}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:11}}}, x:{grid:{display:false},ticks:{color:'#a8abc4',font:{size:11}}} } }
    });
  }
  document.querySelectorAll('.wd-metric').forEach(cb=>{ cb.onchange = buildChartC; });
  buildChartC();

  // Raw(원본데이터) 연동 보고서용 — 일자 x 캠페인 단위 원본 행 + 캠페인별 유형(type) 매핑
  const campTypeMap = {};
  months.forEach(m=> (m.campaigns||[]).forEach(c=>{ if(c.campaign && !(c.campaign in campTypeMap)) campTypeMap[c.campaign] = c.type||'-'; }));
  const rawDailyByCampaign = [];
  months.forEach(m=>{
    if(m.dailyByCampaign && m.dailyByCampaign.length){
      m.dailyByCampaign.forEach(r=>{
        if(!fstate.campaigns.has(r.campaign)) return;
        rawDailyByCampaign.push({
          date:r.date, campaign:r.campaign, type:campTypeMap[r.campaign]||'-',
          impressions:r.impressions||0, clicks:r.clicks||0, cost:r.cost||0, revenue:r.revenue||0, conv:r.conv||0
        });
      });
    }
  });
  rawDailyByCampaign.sort((a,b)=> dateKey(a.date).localeCompare(dateKey(b.date)) || String(a.campaign).localeCompare(String(b.campaign)));

  window.__exportData = {
    name: data.name, industry: data.industry||'-', bizType: data.bizType,
    periodFrom: labels[0]||'-', periodTo: labels[labels.length-1]||'-', periodsCount: months.length,
    isDB, totalCostMan, totalRevenueMan, totalRoas, totalConv, totalImp, totalClick, avgCpa,
    dailyAll, topRows, wasteRows, rawDailyByCampaign,
    insights: generateInsights(data, months, isDB),
    insightsList: generateInsights(data, months, isDB).map(i=>i.text),
    lastMonthCampaigns: (months.length ? (months[months.length-1].campaigns||[]) : [])
  };
}


function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>`
        <label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${fstate.types.has(t)?'checked':''}> ${campaignTypeLabel(t)}</label>
      `).join('')}
    </div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인명</div>
      <div class="filter-campaign-list">
      ${campaignList.map(c=>`
        <label class="filter-item"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${c.campaign}</label>
      `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="filterSelectAllBtn" style="flex:1;">전체 선택</button>
      <button class="btn btn-ghost" id="filterDeselectAllBtn" style="flex:1;">전체 해제</button>
    </div>
  `;
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>c.type===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>c.type===t).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterSelectAllBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
  document.getElementById('filterDeselectAllBtn').onclick = ()=>{
    fstate.types = new Set();
    fstate.campaigns = new Set();
    renderFn(data);
  };
}


document.getElementById('pdfExportBtn').onclick = async ()=>{
  const btn = document.getElementById('pdfExportBtn');
  const cardEl = document.getElementById('card');
  const d = window.__exportData;

  try{
    const canvas = await html2canvas(cardEl, { backgroundColor: '#171829', scale: 2, useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pxToMm = px => px * 0.264583;
    const imgWmm = pxToMm(canvas.width / 2);

  }

// 고객 공유용 리포트 — 내부 운영용 카드(원인 분해, 점검 필요 경고 등)를 그대로 캡처하는 대신,
// 클라이언트에게 보여줘도 되는 톤(성과 중심, 좋은 소식 위주)으로 새로 구성한 별도 리포트를 만듦.
function buildClientReportHTML(d){
  const goodInsights = (d.insights||[]).filter(i=>i.type==='good');
  const ymd = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
  const topCamps = [...(d.lastMonthCampaigns||[])]
    .sort((a,b)=> d.isDB ? (b.conv||0)-(a.conv||0) : (b.revenue||0)-(a.revenue||0))
    .slice(0,5);
  const kpiCards = d.isDB ? `
    <div class="cr-kpi"><div class="cr-kpi-label">총 광고비</div><div class="cr-kpi-value">${fmtMan(d.totalCostMan)}원</div></div>
    <div class="cr-kpi"><div class="cr-kpi-label">전환수</div><div class="cr-kpi-value">${fmtNum(d.totalConv)}건</div></div>
    <div class="cr-kpi"><div class="cr-kpi-label">전환당 비용(CPA)</div><div class="cr-kpi-value">${d.avgCpa.toLocaleString('ko-KR')}원</div></div>
    <div class="cr-kpi"><div class="cr-kpi-label">노출수</div><div class="cr-kpi-value">${fmtNum(d.totalImp)}</div></div>
  ` : `
    <div class="cr-kpi"><div class="cr-kpi-label">총 광고비</div><div class="cr-kpi-value">${fmtMan(d.totalCostMan)}원</div></div>
    <div class="cr-kpi"><div class="cr-kpi-label">전환매출</div><div class="cr-kpi-value">${fmtMan(d.totalRevenueMan)}원</div></div>
    <div class="cr-kpi"><div class="cr-kpi-label">ROAS</div><div class="cr-kpi-value">${d.totalRoas.toFixed(0)}%</div></div>
    <div class="cr-kpi"><div class="cr-kpi-label">노출수</div><div class="cr-kpi-value">${fmtNum(d.totalImp)}</div></div>
  `;
  const highlightsHtml = goodInsights.length
    ? goodInsights.map(i=>`<div class="cr-highlight">📈 ${i.text}</div>`).join('')
    : `<div class="cr-highlight" style="color:var(--muted);">이번 기간도 꾸준히 안정적으로 운영되고 있어요.</div>`;
  const campRows = topCamps.map(c=>{
    const metric = d.isDB ? `${fmtNum(c.conv||0)}건 (CPA ${c.conv>0?Math.round((c.cost||0)*10000/c.conv).toLocaleString('ko-KR')+'원':'-'})` : `${fmtMan(c.revenue||0)}원 (ROAS ${(c.cost||0)>0?((c.revenue||0)/c.cost*100).toFixed(0)+'%':'-'})`;
    return `<tr><td>${c.campaign}</td><td>${fmtMan(c.cost||0)}원</td><td>${metric}</td></tr>`;
  }).join('');
  return `
  <div id="clientReportRoot" style="width:800px;padding:40px;background:#171829;color:#f5f6fa;font-family:'Pretendard',sans-serif;">
    <style>
      .cr-kpi{background:#1d1f33;border:1px solid #33354a;border-radius:12px;padding:16px;text-align:center;}
      .cr-kpi-label{font-size:12px;color:#a8abc4;margin-bottom:6px;}
      .cr-kpi-value{font-size:20px;font-weight:800;color:#f5f6fa;}
      .cr-highlight{font-size:13px;line-height:1.8;padding:8px 0;color:#f5f6fa;}
      .cr-table{width:100%;border-collapse:collapse;margin-top:8px;}
      .cr-table th{text-align:left;font-size:11px;color:#a8abc4;padding:8px 10px;border-bottom:1px solid #33354a;font-weight:600;}
      .cr-table td{font-size:12.5px;padding:9px 10px;border-bottom:1px solid #262838;}
    </style>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
      <div style="width:44px;height:44px;border-radius:12px;background:${d.bizType?'#8b7cff':'#8b7cff'};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;">${(d.name||'?').trim().charAt(0)}</div>
      <div>
        <div style="font-size:20px;font-weight:800;">${d.name} 광고 성과 리포트</div>
        <div style="font-size:12.5px;color:#a8abc4;">${d.periodFrom} ~ ${d.periodTo} 기준 · ${ymd} 생성</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0;">${kpiCards}</div>
    <div style="font-size:14px;font-weight:700;margin-bottom:8px;">✨ 이번 기간 하이라이트</div>
    <div style="background:#1d1f33;border:1px solid #33354a;border-radius:12px;padding:6px 16px;margin-bottom:24px;">${highlightsHtml}</div>
    ${campRows ? `
    <div style="font-size:14px;font-weight:700;margin-bottom:8px;">📣 캠페인별 성과</div>
    <table class="cr-table">
      <thead><tr><th>캠페인</th><th>비용</th><th>성과</th></tr></thead>
      <tbody>${campRows}</tbody>
    </table>` : ''}
    <div style="margin-top:32px;font-size:10.5px;color:#6d7091;text-align:center;">본 리포트는 자동으로 생성되었습니다.</div>
  </div>`;
}

  const dailyHeader = d.isDB ? ['날짜','노출수','클릭수','비용(원)','전환수(건)','CPA(원)'] : ['날짜','노출수','클릭수','비용(원)','전환매출(원)','ROAS(%)'];

  wsDaily['!cols'] = dailyHeader.map(()=>({wch:14}));

  const topHeader = d.isDB ? ['키워드/검색어','비용(원)','전환수(건)','CPA(원)'] : ['키워드/검색어','비용(원)','전환매출(원)','CPA(원)','ROAS(%)'];
  const topRowsOut = [topHeader];
  (d.topRows||[]).forEach(k=>{

// 원본데이터(Raw) 연동 보고서 — Raw 시트에 일자x캠페인 원본 행을 넣고, Summary/캠페인별 시트는
// SUMIFS 수식으로 Raw를 참조해서 자동 집계되도록 구성. (참고한 클라이언트 리포트 템플릿과 동일한 방식)
// 비용/매출은 원 단위로 Raw에 저장하고, 모든 집계 수식은 엑셀에서 직접 검증 가능하게 셀 수식으로 넣음.
document.getElementById('rawExcelExportBtn').onclick = ()=>{
  const d = window.__exportData;
  if(!d){ alert('먼저 업체 탭을 선택해주세요.'); return; }
  const rows = d.rawDailyByCampaign||[];
  if(!rows.length){ alert('원본 일별 데이터가 없어요. 네이버 데이터를 먼저 수집해주세요.'); return; }

  const wb = XLSX.utils.book_new();

  // ── Raw 시트: 일자 x 캠페인 원본 데이터 (모든 집계의 근거) ──
  const rawHeader = ['날짜','캠페인','유형','노출수','클릭수','전환수','매출(원)','비용(원)'];
  const rawAoa = [rawHeader];
  rows.forEach(r=>{
    rawAoa.push([r.date, r.campaign, r.type, r.impressions||0, r.clicks||0, r.conv||0, Math.round((r.revenue||0)*10000), Math.round((r.cost||0)*10000)]);
  });
  const wsRaw = XLSX.utils.aoa_to_sheet(rawAoa);
  wsRaw['!cols'] = [{wch:12},{wch:26},{wch:12},{wch:10},{wch:10},{wch:10},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsRaw, 'Raw');
  const rawLastRow = rawAoa.length; // 헤더 포함 총 행수 (1-based, 헤더가 1행)

  // Raw 열 참조 (A:날짜 B:캠페인 C:유형 D:노출수 E:클릭수 F:전환수 G:매출 H:비용)
  const R = (col)=> `Raw!${col}2:${col}${rawLastRow}`;

  // ── Summary 시트: 날짜별 SUMIFS 집계 (수식으로 Raw를 참조) ──
  const uniqueDates = [...new Set(rows.map(r=>r.date))].sort((a,b)=> dateKey(a).localeCompare(dateKey(b)));
  const isDB = d.isDB;
  const summaryHeader = ['날짜','노출수','클릭수','CTR(%)','전환수','전환매출(원)','CVR(%)', isDB?'CPA(원)':'ROAS(%)','광고비(원)'];
  const summaryAoa = [
    ['업체명', d.name, null,null,null,null,null,null,null],
    ['업종', d.industry, null,null,null,null,null,null,null],
    ['업종 유형', isDB ? 'DB(상담·전환)' : 'B2C(매출·ROAS)', null,null,null,null,null,null,null],
    ['생성일', new Date().toLocaleString('ko-KR'), null,null,null,null,null,null,null],
    [],
    summaryHeader
  ];
  const summaryStartRow = summaryAoa.length + 1; // 1-based 엑셀 행 번호 (헤더 다음 행부터 데이터)
  uniqueDates.forEach((date,i)=>{
    const r = summaryStartRow + i;
    summaryAoa.push([
      date,
      {f:`SUMIFS(${R('D')},${R('A')},A${r})`},
      {f:`SUMIFS(${R('E')},${R('A')},A${r})`},
      {f:`IFERROR(C${r}/B${r}*100,0)`},
      {f:`SUMIFS(${R('F')},${R('A')},A${r})`},
      {f:`SUMIFS(${R('G')},${R('A')},A${r})`},
      {f:`IFERROR(E${r}/C${r}*100,0)`},
      isDB ? {f:`IFERROR(I${r}/E${r},0)`} : {f:`IFERROR(F${r}/I${r}*100,0)`},
      {f:`SUMIFS(${R('H')},${R('A')},A${r})`}
    ]);
  });
  // 합계 행
  const sumLastRow = summaryStartRow + uniqueDates.length - 1;
  if(uniqueDates.length){
    summaryAoa.push([
      '합계',
      {f:`SUM(B${summaryStartRow}:B${sumLastRow})`},
      {f:`SUM(C${summaryStartRow}:C${sumLastRow})`},
      {f:`IFERROR(C${sumLastRow+1}/B${sumLastRow+1}*100,0)`},
      {f:`SUM(E${summaryStartRow}:E${sumLastRow})`},
      {f:`SUM(F${summaryStartRow}:F${sumLastRow})`},
      {f:`IFERROR(E${sumLastRow+1}/C${sumLastRow+1}*100,0)`},
      isDB ? {f:`IFERROR(I${sumLastRow+1}/E${sumLastRow+1},0)`} : {f:`IFERROR(F${sumLastRow+1}/I${sumLastRow+1}*100,0)`},
      {f:`SUM(I${summaryStartRow}:I${sumLastRow})`}
    ]);
  }
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryAoa);
  wsSummary['!cols'] = [{wch:14},{wch:12},{wch:12},{wch:10},{wch:10},{wch:14},{wch:10},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

  // ── 캠페인 시트: 캠페인별 SUMIFS 집계 (수식으로 Raw를 참조) ──
  const uniqueCampaigns = [...new Set(rows.map(r=>r.campaign))];
  const campTypeMap = {};
  rows.forEach(r=>{ if(!(r.campaign in campTypeMap)) campTypeMap[r.campaign] = r.type; });
  const campHeader = ['캠페인','유형','노출수','클릭수','CTR(%)','전환수','전환매출(원)','CVR(%)', isDB?'CPA(원)':'ROAS(%)','광고비(원)'];
  const campAoa = [campHeader];
  const campStartRow = 2; // 헤더가 1행
  uniqueCampaigns.forEach((camp,i)=>{
    const r = campStartRow + i;
    const campEsc = String(camp).replace(/"/g,'""');
    campAoa.push([
      camp, campTypeMap[camp]||'-',
      {f:`SUMIFS(${R('D')},${R('B')},A${r})`},
      {f:`SUMIFS(${R('E')},${R('B')},A${r})`},
      {f:`IFERROR(D${r}/C${r}*100,0)`},
      {f:`SUMIFS(${R('F')},${R('B')},A${r})`},
      {f:`SUMIFS(${R('G')},${R('B')},A${r})`},
      {f:`IFERROR(F${r}/D${r}*100,0)`},
      isDB ? {f:`IFERROR(J${r}/F${r},0)`} : {f:`IFERROR(G${r}/J${r}*100,0)`},
      {f:`SUMIFS(${R('H')},${R('B')},A${r})`}
    ]);
  });
  const wsCamp = XLSX.utils.aoa_to_sheet(campAoa);
  wsCamp['!cols'] = [{wch:26},{wch:12},{wch:10},{wch:10},{wch:10},{wch:10},{wch:14},{wch:10},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsCamp, '캠페인별');

  const ymd = new Date().toISOString().slice(0,10).replace(/-/g,'');
  XLSX.writeFile(wb, `${d.name}_원본데이터연동보고서_${ymd}.xlsx`);
};

// 엑셀 시트 이름 제한(31자, \/?*[]: 사용 불가) 대응 — 업체명이 길거나 특수문자가 있어도 안전하게 시트 이름으로 씀
function safeSheetName(name, usedNames){
  let base = String(name||'업체').replace(/[\\/?*\[\]:]/g, '_').slice(0,28).trim() || '업체';
  let out = base, n = 2;
  while(usedNames.has(out)){ out = `${base}_${n}`.slice(0,31); n++; }
  usedNames.add(out);
  return out;
}

// "전체 업체 엑셀 다운로드" — 매달 업체 수만큼 하나씩 눌러서 받아야 했던 걸, 한 번에 전체 업체를 한 파일로 받게 함.
// 첫 시트는 전체 요약표(전체 업체 요약 패널과 동일한 데이터), 그 다음부터 업체별로 요약+마지막 기간 캠페인 시트를 하나씩 추가함.
// 버튼이 renderOverview()에서 매번 새로 그려지는 동적 요소라, 다른 동적 버튼들과 같은 방식(inline onclick + 전역 함수)으로 연결함.
async function exportAllClientsExcel(btn){
  const rows = window.__overviewRows || [];
  if(!rows.length){ alert('내려받을 업체 데이터가 없어요.'); return; }
  const originalText = btn.textContent;
  btn.textContent = '⏳ 생성 중...';
  btn.disabled = true;
  try{
    const wb = XLSX.utils.book_new();
    const usedNames = new Set();

    const summaryHeader = ['업체명','업종 유형','기간','비용(원)','전환수(건)','전환매출(원)','ROAS(%)','CPA(원)'];
    const summaryOut = [summaryHeader];
    rows.forEach(r=>{
      summaryOut.push([
        r.name, r.bizType==='DB'?'DB(상담·전환)':'B2C(매출·ROAS)', r.lastLabel,
        Math.round(r.cost*10000), r.conv, Math.round(r.revenue*10000),
        r.bizType==='DB' ? '' : Number(r.roas.toFixed(1)),
        r.bizType==='DB' ? Math.round(r.cpa) : ''
      ]);
    });
    const wsSummary = XLSX.utils.aoa_to_sheet(summaryOut);
    wsSummary['!cols'] = summaryHeader.map(()=>({wch:16}));
    XLSX.utils.book_append_sheet(wb, wsSummary, safeSheetName('전체 요약', usedNames));

    for(const r of rows){
      const data = await getClient(r.key);
      if(!data || !data.months || !data.months.length) continue;
      const last = data.months[data.months.length-1];
      const isDB = data.bizType === 'DB';
      const sheetName = safeSheetName(r.name, usedNames);

      const clientOut = [
        ['업체명', data.name],
        ['업종', data.industry||'-'],
        ['업종 유형', isDB ? 'DB(상담·전환)' : 'B2C(매출·ROAS)'],
        ['기간', last.label],
        [],
        ['비용(원)', Math.round((last.cost||0)*10000)],
        isDB ? ['전환수(건)', last.conv||0] : ['전환매출(원)', Math.round((last.revenue||0)*10000)],
        isDB ? ['CPA(원)', last.conv>0?Math.round(last.cost*10000/last.conv):''] : ['ROAS(%)', last.cost>0?Number((last.revenue/last.cost*100).toFixed(1)):0],
        ['노출수', last.impressions||0],
        ['클릭수', last.clicks||0],
      ];
      if(last.campaigns && last.campaigns.length){
        clientOut.push([]);
        clientOut.push(isDB ? ['캠페인','유형','비용(원)','전환수(건)','CPA(원)'] : ['캠페인','유형','비용(원)','매출(원)','ROAS(%)']);
        last.campaigns.forEach(c=>{
          const costWon = Math.round((c.cost||0)*10000), revWon = Math.round((c.revenue||0)*10000);
          if(isDB) clientOut.push([c.campaign, c.type?campaignTypeLabel(c.type):'-', costWon, c.conv||0, c.conv>0?Math.round(costWon/c.conv):'']);
          else clientOut.push([c.campaign, c.type?campaignTypeLabel(c.type):'-', costWon, revWon, costWon>0?Number((revWon/costWon*100).toFixed(1)):0]);
        });
      }
      const wsClient = XLSX.utils.aoa_to_sheet(clientOut);
      wsClient['!cols'] = [{wch:18},{wch:22},{wch:14},{wch:14},{wch:14}];
      XLSX.utils.book_append_sheet(wb, wsClient, sheetName);
    }

    const ymd = new Date().toISOString().slice(0,10).replace(/-/g,'');
    XLSX.writeFile(wb, `전체업체_광고성과요약_${ymd}.xlsx`);
  }catch(e){
    console.error(e);
    alert('엑셀 생성에 실패했어요. (사유: '+(e.message||e)+')');
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

let activeIdx = 0, chartA=null, chartB=null;
function contrastText(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return (0.299*r+0.587*g+0.114*b)/255>0.6?'#12131c':'#ffffff'; }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function dateKey(d){ return String(d).replace(/\\D/g,''); }
function renderTabs(){
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  CLIENTS.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='tab'+(i===activeIdx?' active':'');
    el.innerHTML=\`<span class="dot" style="background:\${c.color}"></span>\${c.name}\`;
    el.onclick=()=>{ activeIdx=i; renderTabs(); renderCard(); };
    tabs.appendChild(el);
  });
}
function renderCard(){
  const data = CLIENTS[activeIdx];
  document.documentElement.style.setProperty('--accent', data.color);
  const months = data.months||[];
  const labels = months.map(m=>m.label);
  const revs = months.map(m=>m.revenue), costs = months.map(m=>m.cost), convs = months.map(m=>m.conv);
  const imps = months.map(m=>m.impressions||0), clicksArr = months.map(m=>m.clicks||0);
  const totalRevenueMan = revs.reduce((a,b)=>a+b,0), totalCostMan = costs.reduce((a,b)=>a+b,0), totalConv = convs.reduce((a,b)=>a+b,0);
  const totalImp = imps.reduce((a,b)=>a+b,0), totalClick = clicksArr.reduce((a,b)=>a+b,0);
  const totalRoas = totalCostMan>0 ? (totalRevenueMan/totalCostMan)*100 : 0;
  const textColor = contrastText(data.color); const initial=(data.name||'?').trim().charAt(0);

  const dailyAll = [];
  months.forEach(m=>{
    if(m.daily && m.daily.length) m.daily.forEach(d=>dailyAll.push(d));
    else dailyAll.push({date:m.label, impressions:m.impressions||0, clicks:m.clicks||0, revenue:m.revenue, cost:m.cost, conv:m.conv});
  });
  dailyAll.sort((a,b)=>dateKey(a.date).localeCompare(dateKey(b.date)));

  document.getElementById('card').innerHTML = \`
    <header class="rep"><div class="idn"><div class="icon" style="background:\${data.color};color:\${textColor}">\${initial}</div>
      <div><div class="idn-name">\${data.name} <span class="badge">\${data.industry||'-'}</span></div>
      <div class="period">\${labels[0]||'-'} ~ \${labels[labels.length-1]||'-'} (\${months.length}개 기간) 누적 성과</div></div></div>
      <div class="totals"><div><div class="lbl">TOTAL REVENUE</div><div class="val">\${fmtMan(totalRevenueMan)} 원</div></div>
      <div><div class="lbl">TOTAL ROAS</div><div class="val accent">\${totalRoas.toFixed(1)}%</div></div></div></header>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">비용</div><div class="kpi-value">\${fmtMan(totalCostMan)}원</div></div>
      <div class="kpi"><div class="kpi-label">전환매출</div><div class="kpi-value">\${fmtMan(totalRevenueMan)}원</div></div>
      <div class="kpi"><div class="kpi-label">ROAS</div><div class="kpi-value">\${totalRoas.toFixed(1)}%</div></div>
      <div class="kpi"><div class="kpi-label">노출수</div><div class="kpi-value">\${fmtNum(totalImp)}</div></div>
      <div class="kpi"><div class="kpi-label">클릭수</div><div class="kpi-value">\${fmtNum(totalClick)}</div></div>
      <div class="kpi"><div class="kpi-label">전환수</div><div class="kpi-value">\${fmtNum(totalConv)}건</div></div>
    </div>
    <div class="charts-row">
      <div class="panel"><div class="panel-title">일별 유입 성과</div><div class="chart-box"><canvas id="chartA"></canvas></div></div>
      <div class="panel"><div class="panel-title">일별 전환 성과</div><div class="chart-box"><canvas id="chartB"></canvas></div></div>
    </div>\`;

  const dLabels = dailyAll.map(d=>d.date);
  const dImp = dailyAll.map(d=>d.impressions||0);
  const dCtr = dailyAll.map(d=> d.impressions>0 ? Number((d.clicks/d.impressions*100).toFixed(2)) : 0);
  const dRev = dailyAll.map(d=>d.revenue);
  const dRoas = dailyAll.map(d=> d.cost>0 ? Number(((d.revenue/d.cost)*100).toFixed(1)) : 0);
  if(chartA) chartA.destroy();
  chartA = new Chart(document.getElementById('chartA'), { data:{ labels:dLabels, datasets:[
    { type:'bar', label:'노출수', data:dImp, backgroundColor:'rgba(255,255,255,.18)', borderRadius:3, yAxisID:'y' },
    { type:'line', label:'클릭률(%)', data:dCtr, borderColor:data.color, backgroundColor:data.color, tension:.3, pointRadius:0, borderWidth:2, yAxisID:'y1' }
  ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#a8abc4',font:{size:12}}}},
    scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:12}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:12}}}, x:{grid:{display:false},ticks:{color:'#a8abc4',font:{size:11},maxTicksLimit:12}} } } });
  if(chartB) chartB.destroy();
  chartB = new Chart(document.getElementById('chartB'), { data:{ labels:dLabels, datasets:[
    { type:'bar', label:'매출액(만원)', data:dRev, backgroundColor:'rgba(255,255,255,.18)', borderRadius:3, yAxisID:'y' },
    { type:'line', label:'ROAS(%)', data:dRoas, borderColor:data.color, backgroundColor:data.color, tension:.3, pointRadius:0, borderWidth:2, yAxisID:'y1' }
  ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#a8abc4',font:{size:12}}}},
    scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:12}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:12}}}, x:{grid:{display:false},ticks:{color:'#a8abc4',font:{size:11},maxTicksLimit:12}} } } });
}
renderTabs(); renderCard();
<\/script></body></html>`;
}


auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('authUserEmail').textContent = user.email;
    currentUserEmail = user.email;
    isAdminUser = await checkIsAdmin(user.email);
    const inputLink = document.querySelector('a[href="input.html"]');
    if(inputLink) inputLink.style.display = isAdminUser ? '' : 'none';
    await renderOverview();
    loadAlerts();
    await refreshTabs();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

if(FIREBASE_CONFIG.apiKey.includes('여기에')){
  document.getElementById('authScreen').innerHTML = `
    <div class="empty-state">
      <div style="font-size:28px;">⚠️</div>
      <div style="color:#ff5d7a;font-weight:600;">Firebase 설정이 아직 입력되지 않았어요.</div>
      <div>파일 상단의 FIREBASE_CONFIG 값을 본인의 Firebase 프로젝트 값으로 채워주세요.</div>
    </div>`;
}
</script>
