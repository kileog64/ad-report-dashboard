<script>
let activeSlug = null;
let chartA = null, chartB = null, chartC = null, trendChart = null, hourChart = null;
const filterState = {}; // key -> { types:Set, campaigns:Set }
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function dateKey(d){ return String(d).replace(/\D/g,''); }
function weekdayOf(dateStr){
  // "2026.07.01" -> Date
  const parts = dateStr.split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return dt.getDay(); // 0=Sun..6=Sat
}
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];

/* ---------- 파일 파싱 ---------- */

function showStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg show ' + (type||'');
}

/* ---------- 저장소 (Firestore, 로그인한 팀 전체가 공유) ---------- */

function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const doc = await userClientsRef().doc(id).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    await userClientsRef().doc(id).set(data);
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ---------- 인증 ---------- */

function authStatus(msg, type){
  const el = document.getElementById('authStatus');
  el.textContent = msg; el.className = 'status-msg show ' + (type||'');
}
document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-pw').value;
  if(!email || !pw){ authStatus('이메일과 비밀번호를 입력해주세요.', 'err'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){ authStatus('로그인 실패: ' + e.message, 'err'); }
};
document.getElementById('logoutBtn').onclick = ()=> auth.signOut();


async function refreshTabs(selectAfter){
  const keys = await listClients();
  const tabs = document.getElementById('tabs');
  const exportBtn = document.getElementById('exportBtn');
  const excelExportBtn = document.getElementById('excelExportBtn');
  const pdfExportBtn = document.getElementById('pdfExportBtn');
  tabs.innerHTML = '';
  tabs.appendChild(pdfExportBtn);
  tabs.appendChild(excelExportBtn);
  tabs.appendChild(exportBtn);
  for(const key of keys){
    const data = await getClient(key);
    if(!data) continue;
    const el = document.createElement('div');
    el.className = 'tab' + (key===activeSlug ? ' active' : '');
    el.innerHTML = `<span class="dot" style="background:${data.color}"></span>${data.name}`;
    el.onclick = ()=>{ activeSlug = key; refreshTabs(); renderCard(data); };
    tabs.insertBefore(el, pdfExportBtn);
  }
  if(selectAfter){
    activeSlug = selectAfter;
    const data = await getClient(selectAfter);
    if(data){ renderCard(data); refreshTabs(); }
  }
}

/* ---------- 필터 상태 ---------- */

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


function mergedCampaignList(data){
  const map = {};
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

/* ---------- 렌더링 ---------- */


function generateInsights(data, months, isDB){
  const insights = [];
  const MIN_CONV = 5;      // 전환수 기반 비교의 최소 표본
  const MIN_COST_MAN = 5;  // ROAS 비교의 최소 비용(만원)
  const last = months[months.length-1];
  if(last && last.campaigns && last.campaigns.length>1){
    const camps = last.campaigns.map(c=>({ campaign:c.campaign, cost:c.cost, conv:c.conv,
      roas: c.cost>0 ? (c.revenue/c.cost*100) : 0, cpa: c.conv>0 ? (c.cost*10000/c.conv) : null }));
    if(isDB){
      const withConv = camps.filter(c=>c.cpa!==null && c.conv>=MIN_CONV);
      if(withConv.length>=2){
        const best = withConv.reduce((a,b)=>a.cpa<b.cpa?a:b);
        const worst = withConv.reduce((a,b)=>a.cpa>b.cpa?a:b);
        insights.push({type:'good', text:`'${best.campaign}' 캠페인이 가장 효율적이에요 (CPA ${Math.round(best.cpa).toLocaleString('ko-KR')}원, 전환 ${best.conv}건 기준)`});
        if(worst.campaign!==best.campaign){
          insights.push({type:'warn', text:`'${worst.campaign}' 캠페인은 CPA가 ${Math.round(worst.cpa).toLocaleString('ko-KR')}원으로 높아요 (전환 ${worst.conv}건 기준). 타겟팅이나 소재 점검을 추천해요.`});
          // 예산 재배분 추천: worst 예산의 30%를 best로 옮겼을 때 예상 전환 증가분
          if(worst.cpa > best.cpa * 1.3){
            const shiftMan = Math.round(worst.cost * 0.3 * 10) / 10;
            if(shiftMan >= 1){
              const shiftWon = shiftMan * 10000;
              const extraConvGain = Math.round(shiftWon/best.cpa) - Math.round(shiftWon/worst.cpa);
              if(extraConvGain >= 1){
                insights.push({type:'good', text:`💡 '${worst.campaign}' 예산 중 ${fmtMan(shiftMan)}원(약 30%)을 '${best.campaign}'로 옮기면, 같은 총예산으로 전환이 약 ${extraConvGain}건 더 나올 수 있어요 (추정치).`});
              }
            }
          }
        }
      }
      camps.filter(c=>c.conv===0 && c.cost>1).forEach(c=>{
        insights.push({type:'warn', text:`'${c.campaign}' 캠페인은 ${fmtMan(c.cost)}원을 썼는데 전환이 0건이에요. 예산 재배치를 검토해보세요.`});
      });
    } else {
      const withCost = camps.filter(c=>c.cost>=MIN_COST_MAN);
      if(withCost.length>=2){
        const best = withCost.reduce((a,b)=>a.roas>b.roas?a:b);
        const worst = withCost.reduce((a,b)=>a.roas<b.roas?a:b);
        insights.push({type:'good', text:`'${best.campaign}' 캠페인 ROAS가 ${best.roas.toFixed(0)}%로 가장 높아요 (비용 ${fmtMan(best.cost)}원 기준).`});
        if(worst.campaign!==best.campaign && worst.roas<100){
          insights.push({type:'warn', text:`'${worst.campaign}' 캠페인은 ROAS가 ${worst.roas.toFixed(0)}%로 손익분기 이하예요 (비용 ${fmtMan(worst.cost)}원 기준). 점검이 필요해요.`});
          if(best.roas > worst.roas * 1.3){
            const shiftMan = Math.round(worst.cost * 0.3 * 10) / 10;
            if(shiftMan >= 1){
              const extraRevGain = Math.round(shiftMan * (best.roas - worst.roas) / 100);
              if(extraRevGain >= 1){
                insights.push({type:'good', text:`💡 '${worst.campaign}' 예산 중 ${fmtMan(shiftMan)}원(약 30%)을 '${best.campaign}'로 옮기면, 같은 총예산으로 매출이 약 ${fmtMan(extraRevGain)}원 더 나올 수 있어요 (추정치).`});
              }
            }
          }
        }
      }
    }
  }

  // 저효율 캠페인 반복 여부 추적: 최근 최대 4개 기간에서 연속으로 같은 캠페인이 '워스트'로 나타나는지 확인
  if(months.length>=2){
    const recentMonths = months.slice(-4);
    let streakCampaign = null, streak = 0;
    for(let i=recentMonths.length-1;i>=0;i--){
      const m = recentMonths[i];
      if(!m.campaigns || m.campaigns.length<2) break;
      const camps2 = m.campaigns.map(c=>({ campaign:c.campaign, cost:c.cost, conv:c.conv,
        roas: c.cost>0 ? (c.revenue/c.cost*100) : 0, cpa: c.conv>0 ? (c.cost*10000/c.conv) : null }));
      let worstCamp = null;
      if(isDB){
        const withConv2 = camps2.filter(c=>c.cpa!==null && c.conv>=MIN_CONV);
        if(withConv2.length>=2) worstCamp = withConv2.reduce((a,b)=>a.cpa>b.cpa?a:b).campaign;
      } else {
        const withCost2 = camps2.filter(c=>c.cost>=MIN_COST_MAN);
        if(withCost2.length>=2) worstCamp = withCost2.reduce((a,b)=>a.roas<b.roas?a:b).campaign;
      }
      if(!worstCamp) break;
      if(streakCampaign===null){ streakCampaign = worstCamp; streak = 1; }
      else if(worstCamp===streakCampaign){ streak++; }
      else break;
    }
    if(streak>=2){
      insights.push({type:'warn', text:`⏱️ '${streakCampaign}' 캠페인이 ${streak}개 기간 연속으로 가장 저효율로 나타났어요. 일시적 변동이 아니라 구조적인 문제일 가능성이 높아요 — 우선 점검을 추천해요.`});
    }
  }
  if(months.length>=2){
    const prev = months[months.length-2], curr = months[months.length-1];
    if(isDB){
      const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : 0, currCpa = curr.conv>0 ? (curr.cost*10000/curr.conv) : 0;
      if(prevCpa>0 && currCpa>0 && prev.conv>=MIN_CONV*2 && curr.conv>=MIN_CONV*2){
        const diff = (currCpa-prevCpa)/prevCpa*100;
        insights.push({type: diff<=0?'good':'warn', text:`직전 기간 대비 CPA가 ${Math.abs(diff).toFixed(0)}% ${diff<=0?'개선':'상승'}됐어요 (${Math.round(prevCpa).toLocaleString('ko-KR')}원 → ${Math.round(currCpa).toLocaleString('ko-KR')}원, 전환 ${prev.conv}→${curr.conv}건).`});
      }
    } else {
      const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : 0, currRoas = curr.cost>0 ? (curr.revenue/curr.cost*100) : 0;
      if(prevRoas>0 && prev.cost>=MIN_COST_MAN*2 && curr.cost>=MIN_COST_MAN*2){
        const diff = currRoas-prevRoas;
        insights.push({type: diff>=0?'good':'warn', text:`직전 기간 대비 ROAS가 ${Math.abs(diff).toFixed(1)}%p ${diff>=0?'상승':'하락'}했어요.`});
      }
    }
  }
  // 입찰가 변경 이벤트 전후 성과 비교
  months.forEach(m=>{
    if(!m.bidEvents || !m.bidEvents.length || !m.dailyByCampaign || !m.dailyByCampaign.length) return;
    // 같은 캠페인+날짜 이벤트는 하나로 합침
    const seen = new Set();
    m.bidEvents.forEach(ev=>{
      const evKey = ev.date+'|'+ev.campaign;
      if(seen.has(evKey)) return;
      seen.add(evKey);
      const campDaily = m.dailyByCampaign.filter(d=>d.campaign===ev.campaign)
        .reduce((acc,d)=>{ acc[d.date] = (acc[d.date]||{cost:0,revenue:0,conv:0}); acc[d.date].cost+=d.cost; acc[d.date].revenue+=d.revenue; acc[d.date].conv+=d.conv; return acc; }, {});
      const allDates = Object.keys(campDaily).sort((a,b)=>a.replace(/\D/g,'').localeCompare(b.replace(/\D/g,'')));
      const evIdx = allDates.indexOf(ev.date);
      if(evIdx<0) return;
      const before = allDates.slice(Math.max(0,evIdx-7), evIdx).map(d=>campDaily[d]);
      const after = allDates.slice(evIdx+1, evIdx+8).map(d=>campDaily[d]);
      if(before.length<4 || after.length<4) return;
      const sum = arr => arr.reduce((a,c)=>({cost:a.cost+c.cost, revenue:a.revenue+c.revenue, conv:a.conv+c.conv}), {cost:0,revenue:0,conv:0});
      const b = sum(before), a2 = sum(after);
      if(isDB){
        if((b.conv+a2.conv) < MIN_CONV) return;
        const beforeCpa = b.conv>0 ? b.cost*10000/b.conv : null;
        const afterCpa = a2.conv>0 ? a2.cost*10000/a2.conv : null;
        if(beforeCpa && afterCpa){
          const diff = (afterCpa-beforeCpa)/beforeCpa*100;
          if(Math.abs(diff)>=5){
            insights.push({type: diff<=0?'good':'warn', text:`'${ev.campaign}' 캠페인, ${ev.date} 입찰가 변경 후 CPA가 ${Math.abs(diff).toFixed(0)}% ${diff<=0?'개선':'상승'}됐어요 (전 1주 ${Math.round(beforeCpa).toLocaleString('ko-KR')}원 → 후 1주 ${Math.round(afterCpa).toLocaleString('ko-KR')}원, 전환 ${b.conv}→${a2.conv}건).`});
          }
        }
      } else {
        if((b.cost+a2.cost) < MIN_COST_MAN) return;
        const beforeRoas = b.cost>0 ? b.revenue/b.cost*100 : null;
        const afterRoas = a2.cost>0 ? a2.revenue/a2.cost*100 : null;
        if(beforeRoas!==null && afterRoas!==null){
          const diff = afterRoas-beforeRoas;
          if(Math.abs(diff)>=5){
            insights.push({type: diff>=0?'good':'warn', text:`'${ev.campaign}' 캠페인, ${ev.date} 입찰가 변경 후 ROAS가 ${Math.abs(diff).toFixed(0)}%p ${diff>=0?'개선':'하락'}됐어요 (전 1주 ${beforeRoas.toFixed(0)}% → 후 1주 ${afterRoas.toFixed(0)}%).`});
          }
        }
      }
    });
  });

  // 예산 소진/운영 중단 의심: 최근 기간 중 비용이 직전 평균 대비 크게 낮은 날 감지
  if(last && last.daily && last.daily.length>=8){
    const daily = last.daily;
    const anomalies = [];
    for(let i=7;i<daily.length;i++){
      const window = daily.slice(i-7,i);
      const avgCost = window.reduce((a,d)=>a+d.cost,0)/window.length;
      if(avgCost<0.5) continue; // 평소에도 지출이 거의 없으면 스킵(노이즈 방지)
      if(daily[i].cost < avgCost*0.5){
        anomalies.push({ date:daily[i].date, cost:daily[i].cost, avgCost });
      }
    }
    if(anomalies.length){
      const recent = anomalies[anomalies.length-1];
      insights.push({type:'warn', text:`${recent.date}에 비용이 직전 1주 평균(${fmtMan(recent.avgCost)}원) 대비 크게 낮았어요 (${fmtMan(recent.cost)}원). 예산 소진이나 광고 운영 중단 여부를 확인해보세요.`});
    }
  }

  // 전년 동월(YoY) 비교: 같은 달 라벨의 작년 데이터가 있으면 비교
  if(last){
    const ym = last.label.match(/(\d{4})\D*(\d{1,2})/);
    if(ym){
      const y = parseInt(ym[1],10), mo = ym[2].padStart(2,'0');
      const prevYearLabel = `${y-1}.${mo}`;
      const allMonthsFull = data.months || [];
      const prevYearMonth = allMonthsFull.find(mm=>mm.label===prevYearLabel);
      if(prevYearMonth){
        if(isDB){
          const pyCpa = prevYearMonth.conv>0 ? (prevYearMonth.cost*10000/prevYearMonth.conv) : 0;
          const curCpa = last.conv>0 ? (last.cost*10000/last.conv) : 0;
          if(pyCpa>0 && curCpa>0 && prevYearMonth.conv>=MIN_CONV*2 && last.conv>=MIN_CONV*2){
            const diff = (curCpa-pyCpa)/pyCpa*100;
            insights.push({type: diff<=0?'good':'warn', text:`📅 작년 동월(${prevYearLabel}) 대비 CPA가 ${Math.abs(diff).toFixed(0)}% ${diff<=0?'개선':'상승'}됐어요 (${Math.round(pyCpa).toLocaleString('ko-KR')}원 → ${Math.round(curCpa).toLocaleString('ko-KR')}원).`});
          }
        } else {
          const pyRoas = prevYearMonth.cost>0 ? (prevYearMonth.revenue/prevYearMonth.cost*100) : 0;
          const curRoas = last.cost>0 ? (last.revenue/last.cost*100) : 0;
          if(pyRoas>0 && prevYearMonth.cost>=MIN_COST_MAN*2 && last.cost>=MIN_COST_MAN*2){
            const diff = curRoas-pyRoas;
            insights.push({type: diff>=0?'good':'warn', text:`📅 작년 동월(${prevYearLabel}) 대비 ROAS가 ${Math.abs(diff).toFixed(1)}%p ${diff>=0?'상승':'하락'}했어요 (${pyRoas.toFixed(0)}% → ${curRoas.toFixed(0)}%).`});
          }
        }
      }
    }
  }

  if(!insights.length){
    insights.push({type:'neutral', text:'아직 인사이트를 뽑기엔 데이터가 더 필요해요. 다음 기간 데이터가 쌓이면 자동으로 분석돼요.'});
  }
  return insights;
}
function buildInsightsHTML(insights){
  const icon = t => t==='good' ? '📈' : t==='warn' ? '⚠️' : 'ℹ️';
  const color = t => t==='good' ? 'var(--up)' : t==='warn' ? 'var(--down)' : 'var(--muted)';
  return `<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;">💡 성과 인사이트</div>` +
    insights.map(i=>`<div style="display:flex;gap:8px;font-size:12.5px;color:var(--text);padding:5px 0;"><span>${icon(i.type)}</span><span style="color:${color(i.type)==='var(--muted)'?'var(--text)':color(i.type)};">${i.text}</span></div>`).join('');
}


async function renderOverview(){
  const el = document.getElementById('overviewTable');
  if(!el) return;
  const keys = await listClients();
  if(!keys.length){ el.innerHTML = ''; return; }
  const rows = [];
  for(const key of keys){
    const data = await getClient(key);
    if(!data || !data.months || !data.months.length) continue;
    const last = data.months[data.months.length-1];
    const roas = last.cost>0 ? (last.revenue/last.cost*100) : 0;
    const cpa = last.conv>0 ? (last.cost*10000/last.conv) : 0;
    let trend = null; // {dir:'up'|'down', good:bool}
    if(data.months.length>=2){
      const prev = data.months[data.months.length-2];
      if(data.bizType==='DB'){
        const prevCpa = prev.conv>0 ? (prev.cost*10000/prev.conv) : 0;
        if(prevCpa>0 && cpa>0 && Math.abs(cpa-prevCpa)/prevCpa>=0.03){
          trend = { dir: cpa<prevCpa?'down':'up', good: cpa<prevCpa }; // CPA는 낮을수록 좋음
        }
      } else {
        const prevRoas = prev.cost>0 ? (prev.revenue/prev.cost*100) : 0;
        if(prevRoas>0 && Math.abs(roas-prevRoas)>=3){
          trend = { dir: roas>prevRoas?'up':'down', good: roas>prevRoas }; // ROAS는 높을수록 좋음
        }
      }
    }
    rows.push({ key, name:data.name, color:data.color, bizType:data.bizType, lastLabel:last.label,
      cost:last.cost, revenue:last.revenue, conv:last.conv, roas, cpa, trend });
  }
  if(!rows.length){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-title">전체 업체 요약 (최근 기간 기준)</div>
      <table>
        <thead><tr><th>업체</th><th>기간</th><th>비용</th><th>전환수</th><th>ROAS/CPA</th></tr></thead>
        <tbody>
          ${rows.map(r=>{
            const trendHtml = r.trend ? `<span style="margin-left:6px;color:${r.trend.good?'var(--up)':'var(--down)'};font-weight:700;">${r.trend.dir==='up'?'▲':'▼'}</span>` : '';
            return `
            <tr style="cursor:pointer;" onclick="selectClientByKey('${r.key}')">
              <td class="kw-name"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${r.color};margin-right:6px;"></span>${r.name}</td>
              <td>${r.lastLabel}</td>
              <td>${fmtMan(r.cost)}원</td>
              <td>${fmtNum(r.conv)}건</td>
              <td>${r.bizType==='DB' ? fmtNum(r.cpa)+'원' : r.roas.toFixed(0)+'%'}${trendHtml}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}
async function selectClientByKey(key){
  activeSlug = key;
  const data = await getClient(key);
  if(data){ renderCard(data); refreshTabs(); }
}

const monthFilterState = {}; // key -> 'ALL' or specific label
const topPanelState = {}; // key -> 'keyword' or 'searchterm'
function renderCard(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  document.documentElement.style.setProperty('--accent', data.color);
  const allMonths = data.months || [];
  if(!(key in monthFilterState)) monthFilterState[key] = 'ALL';
  const selectedMonth = monthFilterState[key];
  const months = selectedMonth==='ALL' ? allMonths : allMonths.filter(m=>m.label===selectedMonth);
  const campaignList = mergedCampaignList(data);
  const allTypes = [...new Set(campaignList.map(c=>c.type))];

  if(fstate.campaigns.size===0){
    document.getElementById('card').innerHTML = `<div class="empty-state"><div style="font-size:28px;">🔎</div><div>선택된 캠페인이 없어요.<br>왼쪽 필터에서 캠페인을 1개 이상 선택해주세요.</div></div>`;
    renderFilterPanel(key, data, campaignList, allTypes);
    return;
  }

  try{
    renderCardInner(data, key, fstate, allMonths, selectedMonth, months, campaignList, allTypes);
  }catch(e){
    console.error('renderCard error:', e);
    document.getElementById('card').innerHTML = `<div class="empty-state"><div style="font-size:28px;">⚠️</div><div>화면을 그리는 중 오류가 발생했어요.<br>브라우저 콘솔(F12)에 뜬 오류 메시지를 확인해주세요.</div></div>`;
    renderFilterPanel(key, data, campaignList, allTypes);
  }
}
function renderCardInner(data, key, fstate, allMonths, selectedMonth, months, campaignList, allTypes){

  // 기간(월)별로 필터링된 합계 계산 (dailyByCampaign 기준, 필터 대상 데이터 없으면 월 전체 합계 사용)
  function monthFiltered(m){
    if(!m.dailyByCampaign || !m.dailyByCampaign.length){
      return { revenue:m.revenue, cost:m.cost, conv:m.conv, impressions:m.impressions||0, clicks:m.clicks||0 };
    }
    let rev=0,cost=0,conv=0,imp=0,click=0;
    m.dailyByCampaign.forEach(r=>{
      if(fstate.campaigns.has(r.campaign)){
        rev+=r.revenue; cost+=r.cost; conv+=r.conv; imp+=(r.impressions||0); click+=(r.clicks||0);
      }
    });
    return { revenue:rev, cost:cost, conv:conv, impressions:imp, clicks:click };
  }

  const labels = months.map(m=>m.label);
  const fMonths = months.map(monthFiltered);
  const revs = fMonths.map(m=>m.revenue);
  const costs = fMonths.map(m=>m.cost);
  const convs = fMonths.map(m=>m.conv);
  const imps = fMonths.map(m=>m.impressions);
  const clicksArr = fMonths.map(m=>m.clicks);
  const roas = revs.map((r,i)=> costs[i]>0 ? (r/costs[i])*100 : 0);
  const cpaArr = costs.map((c,i)=> convs[i]>0 ? Math.round((c*10000)/convs[i]) : 0);
  const ctrArr = imps.map((im,i)=> im>0 ? (clicksArr[i]/im*100) : 0);

  const totalRevenueMan = revs.reduce((a,b)=>a+b,0);
  const totalCostMan = costs.reduce((a,b)=>a+b,0);
  const totalConv = convs.reduce((a,b)=>a+b,0);
  const totalImp = imps.reduce((a,b)=>a+b,0);
  const totalClick = clicksArr.reduce((a,b)=>a+b,0);
  const totalRoas = totalCostMan>0 ? (totalRevenueMan/totalCostMan)*100 : 0;
  const avgRoas = roas.length ? roas.reduce((a,b)=>a+b,0)/roas.length : 0;
  const avgCpa = totalConv>0 ? Math.round((totalCostMan*10000)/totalConv) : 0;

  const firstRoas = roas[0]||0, lastRoas = roas[roas.length-1]||0;
  const roasDeltaPt = lastRoas - firstRoas;
  const firstCpa = cpaArr[0]||0, lastCpa = cpaArr[cpaArr.length-1]||0;
  const cpaDeltaPct = firstCpa>0 ? ((firstCpa-lastCpa)/firstCpa*100) : 0;

  const isFullSelection = campaignList.every(c=>fstate.campaigns.has(c.campaign));
  const actionTotals = {};
  let actionHasCampaignData = false;
  months.forEach(m=>{
    if(m.actionsByCampaign && Object.keys(m.actionsByCampaign).length){
      actionHasCampaignData = true;
      Object.keys(m.actionsByCampaign).forEach(camp=>{
        if(!fstate.campaigns.has(camp)) return;
        Object.entries(m.actionsByCampaign[camp]).forEach(([k,v])=>{ actionTotals[k]=(actionTotals[k]||0)+v; });
      });
    }
  });
  const actionFilterLimited = !isFullSelection && !actionHasCampaignData;
  if(isFullSelection || !actionHasCampaignData){
    // 전체 선택이거나 캠페인별 정보가 아예 없는 기간은 기존 방식(기간 전체 합계)으로 표시
    Object.keys(actionTotals).forEach(k=>delete actionTotals[k]);
    months.forEach(m=>{ Object.entries(m.actions||{}).forEach(([k,v])=>{ actionTotals[k]=(actionTotals[k]||0)+v; }); });
  }
  const actionList = Object.keys(actionTotals).map(k=>({name:k, count:actionTotals[k]})).filter(a=>a.count>0);

  // 필터링된 일별 데이터 (dailyByCampaign 기준, 없으면 daily로 대체)

  const sp = arr => sparkPath(arr, 100, 24);
  function pctChange(arr){
    if(!arr || arr.length<2) return null;

    return (curr-prev)/prev*100;
  }
  function trendBadge(pct, goodDir){
    if(pct===null || pct===undefined || !isFinite(pct)) return '';

  const revSpark = dailyAll.map(d=>d.revenue);

  // TOP 키워드 (가장 최근 기간의 keywordsByCampaign 중 선택된 캠페인만 병합)

    ]},

      scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:12}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:12}}}, x:{grid:{display:false},ticks:tickCfg} } }

function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>`
        <label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${fstate.types.has(t)?'checked':''}> ${t}</label>
      `).join('')}
    </div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인명</div>
      ${campaignList.map(c=>`
        <label class="filter-item"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${c.campaign}</label>
      `).join('')}
    </div>
    <button class="btn btn-ghost" id="filterResetBtn">필터 재설정</button>
  `;
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>c.type===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>c.type===t).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterResetBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
}


document.getElementById('pdfExportBtn').onclick = async ()=>{
  const btn = document.getElementById('pdfExportBtn');
  const cardEl = document.getElementById('card');
  const d = window.__exportData;
  if(!cardEl || !d){ alert('먼저 업체 탭을 선택해주세요.'); return; }
  const originalText = btn.textContent;
  btn.textContent = '⏳ 생성 중...';
  btn.disabled = true;
  try{
    const canvas = await html2canvas(cardEl, { backgroundColor: '#171829', scale: 2, useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pxToMm = px => px * 0.264583;
    const imgWmm = pxToMm(canvas.width / 2);
    const imgHmm = pxToMm(canvas.height / 2);
    const pdf = new jsPDF({ orientation: imgWmm > imgHmm ? 'landscape' : 'portrait', unit: 'mm', format: [imgWmm, imgHmm] });
    pdf.addImage(imgData, 'PNG', 0, 0, imgWmm, imgHmm);
    const ymd = new Date().toISOString().slice(0,10).replace(/-/g,'');
    pdf.save(`${d.name}_광고성과리포트_${ymd}.pdf`);
  }catch(e){
    console.error(e);
    alert('PDF 생성에 실패했어요. 다시 시도해주세요.');
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
};

document.getElementById('exportBtn').onclick = async ()=>{
  const keys = await listClients();
  const clients = [];
  for(const key of keys){

  }
  if(!clients.length){ alert('아직 저장된 업체 데이터가 없어요.'); return; }
  const html = buildSnapshotHTML(clients);
  const blob = new Blob([html], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ymd = new Date().toISOString().slice(0,10).replace(/-/g,'');
  a.href = url; a.download = `광고성과_스냅샷_${ymd}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

  return `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">

<script>
const CLIENTS = ${dataJson};
let activeIdx = 0, chartA=null, chartB=null;
function contrastText(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return (0.299*r+0.587*g+0.114*b)/255>0.6?'#12131c':'#ffffff'; }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function dateKey(d){ return String(d).replace(/\\D/g,''); }
function renderTabs(){
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  CLIENTS.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='tab'+(i===activeIdx?' active':'');
    el.innerHTML=\`<span class="dot" style="background:\${c.color}"></span>\${c.name}\`;
    el.onclick=()=>{ activeIdx=i; renderTabs(); renderCard(); };
    tabs.appendChild(el);
  });
}
function renderCard(){
  const data = CLIENTS[activeIdx];
  document.documentElement.style.setProperty('--accent', data.color);
  const months = data.months||[];
  const labels = months.map(m=>m.label);
  const revs = months.map(m=>m.revenue), costs = months.map(m=>m.cost), convs = months.map(m=>m.conv);
  const imps = months.map(m=>m.impressions||0), clicksArr = months.map(m=>m.clicks||0);
  const totalRevenueMan = revs.reduce((a,b)=>a+b,0), totalCostMan = costs.reduce((a,b)=>a+b,0), totalConv = convs.reduce((a,b)=>a+b,0);
  const totalImp = imps.reduce((a,b)=>a+b,0), totalClick = clicksArr.reduce((a,b)=>a+b,0);
  const totalRoas = totalCostMan>0 ? (totalRevenueMan/totalCostMan)*100 : 0;
  const textColor = contrastText(data.color); const initial=(data.name||'?').trim().charAt(0);

  const dailyAll = [];
  months.forEach(m=>{
    if(m.daily && m.daily.length) m.daily.forEach(d=>dailyAll.push(d));
    else dailyAll.push({date:m.label, impressions:m.impressions||0, clicks:m.clicks||0, revenue:m.revenue, cost:m.cost, conv:m.conv});
  });
  dailyAll.sort((a,b)=>dateKey(a.date).localeCompare(dateKey(b.date)));

  document.getElementById('card').innerHTML = \`
    <header class="rep"><div class="idn"><div class="icon" style="background:\${data.color};color:\${textColor}">\${initial}</div>
      <div><div class="idn-name">\${data.name} <span class="badge">\${data.industry||'-'}</span></div>
      <div class="period">\${labels[0]||'-'} ~ \${labels[labels.length-1]||'-'} (\${months.length}개 기간) 누적 성과</div></div></div>
      <div class="totals"><div><div class="lbl">TOTAL REVENUE</div><div class="val">\${fmtMan(totalRevenueMan)} 원</div></div>
      <div><div class="lbl">TOTAL ROAS</div><div class="val accent">\${totalRoas.toFixed(1)}%</div></div></div></header>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">비용</div><div class="kpi-value">\${fmtMan(totalCostMan)}원</div></div>
      <div class="kpi"><div class="kpi-label">전환매출</div><div class="kpi-value">\${fmtMan(totalRevenueMan)}원</div></div>
      <div class="kpi"><div class="kpi-label">ROAS</div><div class="kpi-value">\${totalRoas.toFixed(1)}%</div></div>
      <div class="kpi"><div class="kpi-label">노출수</div><div class="kpi-value">\${fmtNum(totalImp)}</div></div>
      <div class="kpi"><div class="kpi-label">클릭수</div><div class="kpi-value">\${fmtNum(totalClick)}</div></div>
      <div class="kpi"><div class="kpi-label">전환수</div><div class="kpi-value">\${fmtNum(totalConv)}건</div></div>
    </div>
    <div class="charts-row">
      <div class="panel"><div class="panel-title">일별 유입 성과</div><div class="chart-box"><canvas id="chartA"></canvas></div></div>
      <div class="panel"><div class="panel-title">일별 전환 성과</div><div class="chart-box"><canvas id="chartB"></canvas></div></div>
    </div>\`;

  const dLabels = dailyAll.map(d=>d.date);
  const dImp = dailyAll.map(d=>d.impressions||0);
  const dCtr = dailyAll.map(d=> d.impressions>0 ? Number((d.clicks/d.impressions*100).toFixed(2)) : 0);
  const dRev = dailyAll.map(d=>d.revenue);
  const dRoas = dailyAll.map(d=> d.cost>0 ? Number(((d.revenue/d.cost)*100).toFixed(1)) : 0);
  if(chartA) chartA.destroy();
  chartA = new Chart(document.getElementById('chartA'), { data:{ labels:dLabels, datasets:[
    { type:'bar', label:'노출수', data:dImp, backgroundColor:'rgba(255,255,255,.18)', borderRadius:3, yAxisID:'y' },
    { type:'line', label:'클릭률(%)', data:dCtr, borderColor:data.color, backgroundColor:data.color, tension:.3, pointRadius:0, borderWidth:2, yAxisID:'y1' }
  ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#a8abc4',font:{size:12}}}},
    scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:12}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:12}}}, x:{grid:{display:false},ticks:{color:'#a8abc4',font:{size:11},maxTicksLimit:12}} } } });
  if(chartB) chartB.destroy();
  chartB = new Chart(document.getElementById('chartB'), { data:{ labels:dLabels, datasets:[
    { type:'bar', label:'매출액(만원)', data:dRev, backgroundColor:'rgba(255,255,255,.18)', borderRadius:3, yAxisID:'y' },
    { type:'line', label:'ROAS(%)', data:dRoas, borderColor:data.color, backgroundColor:data.color, tension:.3, pointRadius:0, borderWidth:2, yAxisID:'y1' }
  ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#a8abc4',font:{size:12}}}},
    scales:{ y:{position:'left',grid:{color:'#33354a'},ticks:{color:'#a8abc4',font:{size:12}}}, y1:{position:'right',grid:{display:false},ticks:{color:'#a8abc4',font:{size:12}}}, x:{grid:{display:false},ticks:{color:'#a8abc4',font:{size:11},maxTicksLimit:12}} } } });
}
renderTabs(); renderCard();
<\/script></body></html>`;
}

auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('authUserEmail').textContent = user.email;
    await renderOverview();
    await refreshTabs();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

if(FIREBASE_CONFIG.apiKey.includes('여기에')){
  document.getElementById('authScreen').innerHTML = `
    <div class="empty-state">
      <div style="font-size:28px;">⚠️</div>
      <div style="color:#ff5d7a;font-weight:600;">Firebase 설정이 아직 입력되지 않았어요.</div>
      <div>파일 상단의 FIREBASE_CONFIG 값을 본인의 Firebase 프로젝트 값으로 채워주세요.</div>
    </div>`;
}
</script>
