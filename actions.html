<script>
let activeSlug = null;
const filterState = {};
const actionTypeFilterState = {};
const actionVisibleCount = {};
const actionCalendarMonth = {};
const actionDayFilter = {};
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function dateKey(d){ return String(d).replace(/\D/g,''); }
function weekdayOf(dateStr){
  // "2026.07.01" -> Date
  const parts = dateStr.split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return dt.getDay(); // 0=Sun..6=Sat
}
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];

/* ---------- 파일 파싱 ---------- */

function showStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg show ' + (type||'');
}

/* ---------- 저장소 (Firestore, 로그인한 팀 전체가 공유) ---------- */

function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const doc = await userClientsRef().doc(id).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    await userClientsRef().doc(id).set(data);
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ---------- 인증 ---------- */

function authStatus(msg, type){
  const el = document.getElementById('authStatus');
  el.textContent = msg; el.className = 'status-msg show ' + (type||'');
}
document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-pw').value;
  if(!email || !pw){ authStatus('이메일과 비밀번호를 입력해주세요.', 'err'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){ authStatus('로그인 실패: ' + e.message, 'err'); }
};
document.getElementById('logoutBtn').onclick = ()=> auth.signOut();


async function refreshTabs(selectAfter){
  const keys = await listClients();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for(const key of keys){
    const data = await getClient(key);
    if(!data) continue;
    const el = document.createElement('div');
    el.className = 'tab' + (key===activeSlug ? ' active' : '');
    el.innerHTML = `<span class="dot" style="background:${data.color}"></span>${data.name}`;
    el.onclick = ()=>{ activeSlug = key; refreshTabs(); renderActionsPage(data); };
    tabs.appendChild(el);
  }
  if(selectAfter){
    activeSlug = selectAfter;
    const data = await getClient(selectAfter);
    if(data){ renderActionsPage(data); refreshTabs(); }
  }
}

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


function mergedCampaignList(data){
  const map = {};
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

/* ---------- 렌더링 ---------- */


function renderActionsPage(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  document.documentElement.style.setProperty('--accent', data.color);
  const allMonths = data.months || [];
  const campaignList = mergedCampaignList(data);
  const allTypes = [...new Set(campaignList.map(c=>c.type))];

  // 기간별 x 유형별 건수 테이블
  const allTypeNames = new Set();
  allMonths.forEach(m=>{ Object.keys(m.actions||{}).forEach(t=> allTypeNames.add(t)); });
  const typeList = [...allTypeNames];
  const totalByType = {};
  typeList.forEach(t=>{ totalByType[t] = allMonths.reduce((s,m)=> s + ((m.actions||{})[t]||0), 0); });
  typeList.sort((a,b)=> totalByType[b]-totalByType[a]);

  // 전체 변경 이력 원본 타임라인 (날짜/유형/변경자/캠페인/광고그룹/변경내용), 캠페인 필터 + 유형 필터 적용
  let rawEvents = [];
  allMonths.forEach(m=>{
    (m.rawActionEvents||[]).forEach(ev=>{
      if(ev.campaign && !fstate.campaigns.has(ev.campaign)) return;
      rawEvents.push(ev);
    });
  });
  rawEvents.sort((a,b)=> b.date.localeCompare(a.date));
  const rawTypeList = [...new Set(rawEvents.map(ev=>ev.type))];
  if(!(key in actionTypeFilterState)) actionTypeFilterState[key] = 'ALL';
  const typeFilter = actionTypeFilterState[key];
  let rawEventsFiltered = typeFilter==='ALL' ? rawEvents : rawEvents.filter(ev=>ev.type===typeFilter);
  if(!(key in actionVisibleCount)) actionVisibleCount[key] = 15;

  // 입찰가 변경 타임라인 (날짜순, 캠페인 필터 적용) - 캘린더 집계용은 슬라이스 전 전체를 씀
  let bidAll = [];
  allMonths.forEach(m=>{
    (m.bidEvents||[]).forEach(ev=>{
      if(!fstate.campaigns.has(ev.campaign)) return;
      bidAll.push(ev);
    });
  });
  bidAll.sort((a,b)=> b.date.replace(/\D/g,'').localeCompare(a.date.replace(/\D/g,'')));

  // 🗓️ 캘린더: 라벨(YYYY.MM) 목록, 기본은 이력이 있는 가장 최근 월
  const calendarMonthOptions = allMonths.map(m=>m.label).filter(lbl=> rawEvents.some(ev=>ev.date.startsWith(lbl)) || bidAll.some(ev=>ev.date.startsWith(lbl)));
  if(!(key in actionCalendarMonth) || !calendarMonthOptions.includes(actionCalendarMonth[key])){
    actionCalendarMonth[key] = calendarMonthOptions.length ? calendarMonthOptions[calendarMonthOptions.length-1] : (allMonths.length ? allMonths[allMonths.length-1].label : null);
  }
  const calLabel = actionCalendarMonth[key];
  let calendarCells = [];
  if(calLabel){
    const ym = calLabel.match(/(\d{4})\D+(\d{1,2})/);
    if(ym){
      const y = parseInt(ym[1],10), mo = parseInt(ym[2],10);
      const firstWeekday = new Date(y, mo-1, 1).getDay();
      const daysInMonth = new Date(y, mo, 0).getDate();
      for(let i=0;i<firstWeekday;i++) calendarCells.push(null);
      for(let d=1; d<=daysInMonth; d++){
        const dateStr = `${y}.${String(mo).padStart(2,'0')}.${String(d).padStart(2,'0')}`;
        const rawCount = rawEvents.filter(ev=>ev.date===dateStr).length;
        const bidCount = bidAll.filter(ev=>ev.date===dateStr).length;
        calendarCells.push({ day:d, dateStr, rawCount, bidCount });
      }
    }
  }
  if(actionDayFilter[key]) rawEventsFiltered = rawEventsFiltered.filter(ev=>ev.date===actionDayFilter[key]);
  let bidTimeline = bidAll.slice(0,50);

  const initial = (data.name||'?').trim().charAt(0);
  const textColor = contrastText(data.color);
  const grandTotal = typeList.reduce((s,t)=>s+totalByType[t],0);

  const card = document.getElementById('card');
  card.innerHTML = `
    <header class="rep">
      <div class="idn">
        <div class="icon" style="background:${data.color};color:${textColor}">${initial}</div>
        <div>
          <div class="idn-name">${data.name} <span class="badge">운영 액션 로그 전용 보기</span></div>
          <div class="period">전체 기간(누적) 기준 · 캠페인 필터가 아래 상세 이력·입찰가 타임라인에 적용돼요</div>
        </div>
      </div>
    </header>

    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-title">🗒️ 팀 메모 (변경 이유·맥락 남기기)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <select id="noteCampaignSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;min-width:140px;">
          <option value="">캠페인 전체(공통 메모)</option>
          ${campaignList.map(c=>`<option value="${c.campaign}">${c.campaign}</option>`).join('')}
        </select>
        <input id="noteTextInput" placeholder="예: 전환 안 잡혀서 입찰가 10% 낮춤" style="flex:1;min-width:220px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;">
        <button class="btn" id="noteAddBtn" style="padding:6px 16px;font-size:12px;">메모 남기기</button>
      </div>
      <div id="noteListArea" style="max-height:220px;overflow-y:auto;">
        ${(data.teamNotes||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,50).map(n=>`
          <div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
            <div><span style="color:var(--muted);font-size:11px;">${new Date(n.ts).toLocaleString('ko-KR')} · ${n.author}${n.campaign?` · <span class="kw-name" style="font-size:11.5px;">${n.campaign}</span>`:''}</span><br>${n.text}</div>
            ${(auth.currentUser && n.author===auth.currentUser.email) ? `<button class="btn btn-ghost note-del-btn" data-ts="${n.ts}" style="border-color:var(--down);color:var(--down);padding:2px 8px;font-size:10px;height:fit-content;">삭제</button>` : ''}
          </div>
        `).join('') || '<div style="color:var(--muted);font-size:12.5px;">아직 남긴 메모가 없어요.</div>'}
      </div>
    </div>

    ${calLabel ? `
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <span>🗓️ 액션 캘린더 — ${calLabel}${actionDayFilter[key] ? ` · ${actionDayFilter[key]}만 보는 중` : ''}</span>
        <div style="display:flex;gap:6px;align-items:center;">
          ${actionDayFilter[key] ? `<button class="btn btn-ghost" id="calDayClearBtn" style="padding:4px 10px;font-size:11px;">날짜 필터 해제</button>` : ''}
          <select id="calMonthSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">
            ${allMonths.map(m=>`<option value="${m.label}" ${calLabel===m.label?'selected':''}>${m.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:4px;">
        ${['일','월','화','수','목','금','토'].map(w=>`<div>${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">
        ${calendarCells.map(c=>{
          if(!c) return `<div></div>`;
          const total = c.rawCount + c.bidCount;
          const bg = total===0 ? 'var(--panel-2)' : total<3 ? 'rgba(110,107,255,.25)' : total<6 ? 'rgba(110,107,255,.5)' : 'rgba(110,107,255,.85)';
          const isActive = actionDayFilter[key]===c.dateStr;
          return `<div class="cal-day-cell" data-date="${c.dateStr}" title="${c.dateStr}: 변경이력 ${c.rawCount}건, 입찰가변경 ${c.bidCount}건" style="cursor:${total>0?'pointer':'default'};border-radius:8px;padding:6px 4px;background:${bg};border:1px solid ${isActive?'var(--accent)':'transparent'};min-height:44px;">
            <div style="font-size:11px;color:var(--text);">${c.day}</div>
            ${total>0 ? `<div style="font-size:10px;color:var(--text);font-weight:700;margin-top:2px;">${total}건</div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
    ` : ''}

    <div class="panel">
      <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <span>📝 변경 이력 상세 (${rawEventsFiltered.length}건)</span>
        ${rawTypeList.length ? `<select id="actionTypeSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">
          <option value="ALL" ${typeFilter==='ALL'?'selected':''}>전체 유형</option>
          ${rawTypeList.map(t=>`<option value="${t}" ${typeFilter===t?'selected':''}>${t}</option>`).join('')}
        </select>` : ''}
      </div>
      ${rawEventsFiltered.length ? `
      <div style="overflow-x:auto;">
      <table style="min-width:760px;">
        <thead><tr><th>변경일자</th><th>변경 유형</th><th>변경자</th><th>캠페인</th><th>광고그룹</th><th>변경 내용</th></tr></thead>
        <tbody>
          ${rawEventsFiltered.slice(0, actionVisibleCount[key]).map(ev=>`
            <tr>
              <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${ev.date}</td>
              <td class="kw-name">${ev.type}</td>
              <td style="color:var(--muted);font-size:12px;">${ev.changer||'-'}</td>
              <td>${ev.campaign||'-'}</td>
              <td style="color:var(--muted);font-size:12px;">${ev.adgroup||'-'}</td>
              <td style="color:var(--muted);font-size:12.5px;">${ev.content||'-'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      ${rawEventsFiltered.length > actionVisibleCount[key] ? `<button class="btn btn-ghost" id="actionMoreBtn" style="margin-top:10px;width:100%;">더보기 (${rawEventsFiltered.length - actionVisibleCount[key]}건 더 있음)</button>` : ''}
      ` : `<div style="color:var(--muted);font-size:12.5px;">이 기간·캠페인 필터에는 상세 변경 이력이 없어요. 변경 이력 파일에 변경일자/변경자/광고그룹/변경내용 컬럼이 있으면 여기 자세히 표시돼요 (없어도 유형 구분은 인식돼요).</div>`}
    </div>

    <div class="panel" style="margin-top:18px;">
      <div class="panel-title">📋 기간별 액션 유형 추이 (Total ${grandTotal.toLocaleString('ko-KR')}건)</div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>액션 유형</th>${allMonths.map(m=>`<th>${m.label}</th>`).join('')}<th>합계</th></tr></thead>
        <tbody>
          ${typeList.length ? typeList.map(t=>`
            <tr>
              <td class="kw-name">${t}</td>
              ${allMonths.map(m=>`<td>${((m.actions||{})[t]||0).toLocaleString('ko-KR')}</td>`).join('')}
              <td style="font-weight:700;">${totalByType[t].toLocaleString('ko-KR')}</td>
            </tr>
          `).join('') : `<tr><td colspan="${allMonths.length+2}" style="color:var(--muted);">누적된 액션 로그가 없어요.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>

    <div class="panel" style="margin-top:18px;">
      <div class="panel-title">🎯 입찰가 변경 타임라인 (최근 50건, 캠페인 필터 적용)</div>
      <table>
        <thead><tr><th>날짜</th><th>캠페인</th><th>변경 유형</th></tr></thead>
        <tbody>
          ${bidTimeline.length ? bidTimeline.map(ev=>`
            <tr><td>${ev.date}</td><td class="kw-name">${ev.campaign}</td><td style="color:var(--muted);">${ev.type}</td></tr>
          `).join('') : `<tr><td colspan="3" style="color:var(--muted);">입찰가 변경 이력이 없어요. 변경 이력 파일에 '입찰'이 포함된 항목이 있으면 여기 표시돼요.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  if(rawTypeList.length){
    document.getElementById('actionTypeSelect').onchange = (e)=>{
      actionTypeFilterState[key] = e.target.value;
      actionVisibleCount[key] = 15;
      renderActionsPage(data);
    };
  }
  const moreBtn = document.getElementById('actionMoreBtn');
  if(moreBtn){
    moreBtn.onclick = ()=>{
      actionVisibleCount[key] += 15;
      renderActionsPage(data);
    };
  }
  document.getElementById('noteAddBtn').onclick = async ()=>{
    const text = document.getElementById('noteTextInput').value.trim();
    if(!text) return;
    const campaign = document.getElementById('noteCampaignSelect').value;
    const btn = document.getElementById('noteAddBtn');
    btn.disabled = true;
    const ok = await addTeamNote(key, { ts: Date.now(), author: auth.currentUser ? auth.currentUser.email : '-', campaign: campaign || null, text });
    btn.disabled = false;
    if(ok){
      const fresh = await getClient(key);
      if(fresh) renderActionsPage(fresh);
    }
  };
  document.querySelectorAll('.note-del-btn').forEach(b=>{
    b.onclick = async ()=>{
      const ts = Number(b.dataset.ts);
      const note = (data.teamNotes||[]).find(n=>n.ts===ts);
      if(!note) return;
      if(!confirm('이 메모를 삭제할까요?')) return;
      const ok = await removeTeamNote(key, note);
      if(ok){
        const fresh = await getClient(key);
        if(fresh) renderActionsPage(fresh);
      }
    };
  });
  const calMonthSelect = document.getElementById('calMonthSelect');
  if(calMonthSelect){
    calMonthSelect.onchange = (e)=>{
      actionCalendarMonth[key] = e.target.value;
      delete actionDayFilter[key];
      renderActionsPage(data);
    };
  }
  document.querySelectorAll('.cal-day-cell').forEach(cell=>{
    cell.onclick = ()=>{
      const date = cell.dataset.date;
      if(actionDayFilter[key]===date){ delete actionDayFilter[key]; }
      else { actionDayFilter[key] = date; }
      actionVisibleCount[key] = 15;
      renderActionsPage(data);
    };
  });
  const calDayClearBtn = document.getElementById('calDayClearBtn');
  if(calDayClearBtn){
    calDayClearBtn.onclick = ()=>{
      delete actionDayFilter[key];
      renderActionsPage(data);
    };
  }
  renderFilterPanel(key, data, campaignList, allTypes, renderActionsPage);
}

async function addTeamNote(key, note){
  try{
    const id = key.replace(/^client:/,'');
    await userClientsRef().doc(id).update({ teamNotes: firebase.firestore.FieldValue.arrayUnion(note) });
    return true;
  }catch(e){ console.error(e); alert('메모 저장에 실패했어요.'); return false; }
}
async function removeTeamNote(key, note){
  try{
    const id = key.replace(/^client:/,'');
    await userClientsRef().doc(id).update({ teamNotes: firebase.firestore.FieldValue.arrayRemove(note) });
    return true;
  }catch(e){ console.error(e); alert('메모 삭제에 실패했어요.'); return false; }
}

function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>`
        <label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${fstate.types.has(t)?'checked':''}> ${t}</label>
      `).join('')}
    </div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인명</div>
      ${campaignList.map(c=>`
        <label class="filter-item"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${c.campaign}</label>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="filterSelectAllBtn" style="flex:1;">전체 선택</button>
      <button class="btn btn-ghost" id="filterDeselectAllBtn" style="flex:1;">전체 해제</button>
    </div>
  `;
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>c.type===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>c.type===t).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterSelectAllBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
  document.getElementById('filterDeselectAllBtn').onclick = ()=>{
    fstate.types = new Set();
    fstate.campaigns = new Set();
    renderFn(data);
  };
}


auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('authUserEmail').textContent = user.email;
    await refreshTabs();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

if(FIREBASE_CONFIG.apiKey.includes('여기에')){
  document.getElementById('authScreen').innerHTML = `
    <div class="empty-state">
      <div style="font-size:28px;">⚠️</div>
      <div style="color:#ff5d7a;font-weight:600;">Firebase 설정이 아직 입력되지 않았어요.</div>
      <div>파일 상단의 FIREBASE_CONFIG 값을 본인의 Firebase 프로젝트 값으로 채워주세요.</div>
    </div>`;
}
