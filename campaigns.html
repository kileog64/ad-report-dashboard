<script>
let activeSlug = null;
const filterState = {};
const monthFilterState = {};
const compareMonthState = {};
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function dateKey(d){ return String(d).replace(/\D/g,''); }
function weekdayOf(dateStr){
  // "2026.07.01" -> Date
  const parts = dateStr.split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return dt.getDay(); // 0=Sun..6=Sat
}
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];

/* ---------- 파일 파싱 ---------- */

function showStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg show ' + (type||'');
}

/* ---------- 저장소 (Firestore, 로그인한 팀 전체가 공유) ---------- */

function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const doc = await userClientsRef().doc(id).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    await userClientsRef().doc(id).set(data);
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ---------- 인증 ---------- */

function authStatus(msg, type){
  const el = document.getElementById('authStatus');
  el.textContent = msg; el.className = 'status-msg show ' + (type||'');
}
document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-pw').value;
  if(!email || !pw){ authStatus('이메일과 비밀번호를 입력해주세요.', 'err'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){ authStatus('로그인 실패: ' + e.message, 'err'); }
};
document.getElementById('logoutBtn').onclick = ()=> auth.signOut();


async function refreshTabs(selectAfter){
  const keys = await listClients();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for(const key of keys){
    const data = await getClient(key);
    if(!data) continue;
    const el = document.createElement('div');
    el.className = 'tab' + (key===activeSlug ? ' active' : '');
    el.innerHTML = `<span class="dot" style="background:${data.color}"></span>${data.name}`;
    el.onclick = ()=>{ activeSlug = key; refreshTabs(); renderCampaignsPage(data); };
    tabs.appendChild(el);
  }
  if(selectAfter){
    activeSlug = selectAfter;
    const data = await getClient(selectAfter);
    if(data){ renderCampaignsPage(data); refreshTabs(); }
  }
}

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


function mergedCampaignList(data){
  const map = {};
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

/* ---------- 렌더링 ---------- */


const cpSortState = {}; // key -> { field, dir }

function mergeCampaignRows(months, fstate){
  const map = {};
  months.forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!fstate.campaigns.has(c.campaign)) return;
      if(!map[c.campaign]) map[c.campaign] = { campaign:c.campaign, type:c.type, cost:0, revenue:0, conv:0, impressions:0, clicks:0, rankSum:0, rankImp:0 };
      map[c.campaign].cost += c.cost; map[c.campaign].revenue += c.revenue; map[c.campaign].conv += c.conv;
      map[c.campaign].impressions += c.impressions||0; map[c.campaign].clicks += c.clicks||0;
      if(c.avgRank!==null && c.avgRank!==undefined && c.impressions>0){
        map[c.campaign].rankSum += c.avgRank*c.impressions; map[c.campaign].rankImp += c.impressions;
      }
    });
  });
  return Object.values(map).map(v=>({ ...v, avgRank: v.rankImp>0 ? (v.rankSum/v.rankImp) : null }));
}

function renderCampaignsPage(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  document.documentElement.style.setProperty('--accent', data.color);
  const allMonths = data.months || [];
  if(!(key in monthFilterState)) monthFilterState[key] = 'ALL';
  const selectedMonth = monthFilterState[key];
  const months = selectedMonth==='ALL' ? allMonths : allMonths.filter(m=>m.label===selectedMonth);
  const campaignList = mergedCampaignList(data);
  const allTypes = [...new Set(campaignList.map(c=>c.type))];
  const isDB = data.bizType === 'DB';

  if(!(key in cpSortState)) cpSortState[key] = { field:'default', dir:'desc' };
  const sort = cpSortState[key];

  let rows = mergeCampaignRows(months, fstate);
  rows = rows.map(r=>({ ...r, cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
    ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0 }));
  const hasRevenue = rows.some(r=>r.revenue>0);
  function applySort(list, sortState, defaultField){
    const field = sortState.field==='default' ? defaultField : sortState.field;
    const mult = sortState.dir==='asc' ? 1 : -1;
    return [...list].sort((a,b)=>{
      let av=a[field], bv=b[field];
      if(av===null) av = -Infinity; if(bv===null) bv = -Infinity;
      return (av-bv)*mult;
    });
  }
  rows = applySort(rows, sort, hasRevenue?'revenue':'cost');

  // 전기간 대비 추이: 기준 기간의 직전 기간 데이터 확보
  let refMonth = selectedMonth!=='ALL' ? allMonths.find(m=>m.label===selectedMonth) : allMonths[allMonths.length-1];
  if(!(key in compareMonthState)) compareMonthState[key] = 'AUTO';
  let prevMonth = null;
  if(refMonth){
    if(compareMonthState[key]!=='AUTO'){
      prevMonth = allMonths.find(m=>m.label===compareMonthState[key]) || null;
      if(prevMonth && prevMonth.label===refMonth.label) prevMonth = null;
    } else {
      const idx = allMonths.findIndex(m=>m.label===refMonth.label);
      if(idx>0) prevMonth = allMonths[idx-1];
    }
  }
  let prevMap = {};
  if(prevMonth){
    mergeCampaignRows([prevMonth], fstate).forEach(r=>{
      prevMap[r.campaign] = { ...r,
        cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
        ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0 };
    });
  }
  function pctOf(curr, prev){
    if(prev===null || prev===undefined || curr===null || curr===undefined) return null;
    if(prev===0) return curr>0 ? 100 : null;
    return (curr-prev)/prev*100;
  }
  function cellTrend(pct, goodDir){
    if(pct===null || pct===undefined || isNaN(pct) || Math.abs(pct)<5) return '';
    return `<span style="margin-left:5px;font-size:9.5px;font-weight:700;color:${pct>=0?'var(--up)':'var(--down)'};">${pct>=0?'▲':'▼'}${Math.abs(pct).toFixed(0)}%</span>`;
  }
  rows = rows.map(r=>{
    const prev = prevMap[r.campaign];
    const isNewCamp = !!prevMonth && !prev;
    const trends = prev ? {
      cost: pctOf(r.cost, prev.cost), conv: pctOf(r.conv, prev.conv), revenue: pctOf(r.revenue, prev.revenue),
      cpa: pctOf(r.cpa, prev.cpa), roas: pctOf(r.roas, prev.roas), ctr: pctOf(r.ctr, prev.ctr), cvr: pctOf(r.cvr, prev.cvr),
      avgRank: pctOf(r.avgRank, prev.avgRank)
    } : {};
    return { ...r, isNewCamp, trends };
  });

  const initial = (data.name||'?').trim().charAt(0);
  const textColor = contrastText(data.color);
  const sortTh = (label, field) => `<th data-field="${field}" style="cursor:pointer;user-select:none;">${label}${sort.field===field?(sort.dir==='desc'?' ▼':' ▲'):''}</th>`;

  const card = document.getElementById('card');
  card.innerHTML = `
    <header class="rep">
      <div class="idn">
        <div class="icon" style="background:${data.color};color:${textColor}">${initial}</div>
        <div>
          <div class="idn-name">${data.name} <span class="badge">캠페인 비교 전용 보기</span></div>
          <div class="period" style="display:flex;align-items:center;gap:8px;">
            <span>${selectedMonth==='ALL' ? '전체 기간' : selectedMonth} 기준</span>
            <div style="display:flex;align-items:center;gap:4px;">
              <button id="monthPrevBtn" title="이전(더 과거) 기간" style="background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">◀</button>
              <select id="monthFilterSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:11.5px;font-weight:600;cursor:pointer;">
                ${[...allMonths].reverse().map(m=>`<option value="${m.label}" ${selectedMonth===m.label?'selected':''}>${m.label} 만 보기</option>`).join('')}
                <option value="ALL" ${selectedMonth==='ALL'?'selected':''}>전체 기간(누적)</option>
              </select>
              <button id="monthNextBtn" title="다음(더 최신) 기간" style="background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">▶</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
            <span style="font-size:11px;color:var(--muted);">▲▼ 비교 기준:</span>
            <select id="compareFilterSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 7px;font-size:10.5px;cursor:pointer;">
              <option value="AUTO" ${compareMonthState[key]==='AUTO'?'selected':''}>직전 기간 자동</option>
              ${allMonths.filter(m=>m.label!==(refMonth?refMonth.label:null)).map(m=>`<option value="${m.label}" ${compareMonthState[key]===m.label?'selected':''}>${m.label} 과 비교</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    </header>

    <div class="panel">
      <div class="panel-title">📣 전체 캠페인 랭킹 (${rows.length}개) <span style="font-size:11px;color:var(--muted);font-weight:400;">— 열 제목을 클릭하면 정렬돼요</span></div>
      <div style="overflow-x:auto;">
      <table style="min-width:760px;">
        <thead><tr>
          <th class="camp-name-cell" style="white-space:nowrap;">캠페인</th>
          <th style="white-space:nowrap;">유형</th>
          ${sortTh('비용','cost')}
          ${isDB ? sortTh('전환수','conv') : sortTh('전환매출','revenue')}
          ${sortTh('CPA','cpa')}
          ${!isDB ? sortTh('ROAS','roas') : ''}
          ${sortTh('클릭률','ctr')}
          ${sortTh('전환율','cvr')}
          ${sortTh('평균노출순위','avgRank')}
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(r=>{
            const newBadge = r.isNewCamp ? '<span style="margin-left:6px;font-size:9px;padding:1px 6px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;">NEW</span>' : '';
            const t = r.trends || {};
            return `<tr>
              <td class="kw-name camp-name-cell"><span class="camp-name-scroll" title="${r.campaign}">${r.campaign}</span>${newBadge}</td>
              <td style="color:var(--muted);font-size:12px;white-space:nowrap;">${r.type}</td>
              <td>${fmtWon(r.cost)}원${cellTrend(t.cost,'down')}</td>
              <td>${isDB ? r.conv+'건'+cellTrend(t.conv,'up') : fmtWon(r.revenue)+'원'+cellTrend(t.revenue,'up')}</td>
              <td>${r.cpa!==null?r.cpa.toLocaleString('ko-KR')+'원':'-'}${cellTrend(t.cpa,'down')}</td>
              ${!isDB ? `<td>${r.roas.toFixed(0)}%${cellTrend(t.roas,'up')}</td>` : ''}
              <td>${r.ctr.toFixed(2)}%${cellTrend(t.ctr,'up')}</td>
              <td>${r.cvr.toFixed(2)}%${cellTrend(t.cvr,'up')}</td>
              <td>${r.avgRank!==null?r.avgRank.toFixed(1)+'위':'-'}${cellTrend(t.avgRank,'down')}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="9" style="color:var(--muted);">표시할 캠페인이 없어요.</td></tr>`}
        </tbody>
      </table>
      </div>
      <div style="margin-top:8px;font-size:10.5px;color:var(--muted);">💡 평균노출순위는 네이버 보고서의 실제 값(노출수 가중평균)이에요. 순위 숫자가 크면서 클릭률도 낮다면 입찰가를 점검해보세요 — 노출 위치가 낮아 클릭 기회 자체가 줄었을 수 있어요.</div>
      ${prevMonth ? `<div style="margin-top:4px;font-size:10.5px;color:var(--muted);">▲▼는 직전 기간(${prevMonth.label}) 대비 각 지표별 변동(5%이상만 표시)이에요. 직전 기간에 없던 캠페인은 NEW로 표시돼요.</div>` : ''}
    </div>
  `;
  // 캠페인명 칸이 길 때 마우스 휠(세로 스크롤)로 좌우 이동되게 함
  card.querySelectorAll('.camp-name-scroll').forEach(el=>{
    el.addEventListener('wheel', (e)=>{
      if(el.scrollWidth <= el.clientWidth) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }, { passive:false });
  });
  document.getElementById('monthFilterSelect').onchange = (e)=>{
    monthFilterState[key] = e.target.value;
    compareMonthState[key] = 'AUTO';
    renderCampaignsPage(data);
  };
  document.getElementById('monthPrevBtn').onclick = ()=>{
    const labels = allMonths.map(m=>m.label);
    if(selectedMonth==='ALL') return; // 이미 최하단(전체기간), 더 과거로 갈 곳 없음
    const idx = labels.indexOf(selectedMonth);
    monthFilterState[key] = (idx>0) ? labels[idx-1] : 'ALL';
    compareMonthState[key] = 'AUTO';
    renderCampaignsPage(data);
  };
  document.getElementById('monthNextBtn').onclick = ()=>{
    const labels = allMonths.map(m=>m.label);
    const idx = selectedMonth==='ALL' ? -1 : labels.indexOf(selectedMonth);
    if(idx<labels.length-1){ monthFilterState[key] = labels[idx+1]; compareMonthState[key] = 'AUTO'; renderCampaignsPage(data); }
  };
  document.getElementById('compareFilterSelect').onchange = (e)=>{
    compareMonthState[key] = e.target.value;
    renderCampaignsPage(data);
  };
  document.querySelectorAll('th[data-field]').forEach(th=>{
    th.onclick = ()=>{
      const field = th.dataset.field;
      if(sort.field===field){ sort.dir = sort.dir==='desc' ? 'asc' : 'desc'; }
      else { sort.field = field; sort.dir = 'desc'; }
      renderCampaignsPage(data);
    };
  });
  renderFilterPanel(key, data, campaignList, allTypes, renderCampaignsPage);
}

function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>`
        <label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${fstate.types.has(t)?'checked':''}> ${t}</label>
      `).join('')}
    </div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인명</div>
      ${campaignList.map(c=>`
        <label class="filter-item"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${c.campaign}</label>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="filterSelectAllBtn" style="flex:1;">전체 선택</button>
      <button class="btn btn-ghost" id="filterDeselectAllBtn" style="flex:1;">전체 해제</button>
    </div>
  `;
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>c.type===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>c.type===t).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterSelectAllBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
  document.getElementById('filterDeselectAllBtn').onclick = ()=>{
    fstate.types = new Set();
    fstate.campaigns = new Set();
    renderFn(data);
  };
}


auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('authUserEmail').textContent = user.email;
    await refreshTabs();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

  document.getElementById('authScreen').innerHTML = `
    <div class="empty-state">
      <div style="font-size:28px;">⚠️</div>
      <div style="color:#ff5d7a;font-weight:600;">Firebase 설정이 아직 입력되지 않았어요.</div>
      <div>파일 상단의 FIREBASE_CONFIG 값을 본인의 Firebase 프로젝트 값으로 채워주세요.</div>
    </div>`;
}
