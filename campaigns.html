<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --bg:#0d0e15; --panel:#171829; --panel-2:#1d1f33; --border:#33354a;
    --text:#f5f6fa; --muted:#a8abc4; --up:#4ade9a; --down:#ff6b85; --accent:#8b7cff; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 10% 0%,#191a2c 0%,var(--bg) 45%);color:var(--text);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  .display{font-family:'Pretendard',sans-serif;}
  .wrap{max-width:1480px;margin:0 auto;padding:28px;display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}

  .input-panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;position:sticky;top:20px;}
  .input-panel h2{font-size:16px;margin:0 0 6px;color:var(--text);font-weight:700;}
  .input-panel .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;}
  .section-title{font-size:12.5px;color:var(--accent);font-weight:700;margin:16px 0 9px;letter-spacing:.01em;}
  .file-drop{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;background:var(--panel-2);margin-bottom:10px;transition:border-color .15s,background .15s;}
  .file-drop.dragover{border-color:var(--accent);background:rgba(139,124,255,.1);}
  .file-drop label{display:block;font-size:13px;color:var(--text);font-weight:600;margin-bottom:7px;}
  .file-drop input[type=file]{font-size:12px;color:var(--muted);width:100%;}
  .file-drop .status{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5;}
  .file-drop .status.ok{color:var(--up);}
  .file-drop .status.err{color:var(--down);}
  .preview-box{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;font-size:12.5px;}
  .preview-box .row{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);}
  .preview-box .row b{color:var(--text);}
  .col-ref{background:rgba(139,124,255,.08);border:1px dashed var(--border);border-radius:8px;padding:9px 11px;margin:-4px 0 10px;}
  .col-ref-title{font-size:10.5px;color:var(--accent);font-weight:700;margin-bottom:3px;}
  .col-ref-list{font-family:'Pretendard',monospace;font-size:10.5px;color:var(--muted);line-height:1.6;word-break:break-all;}
  .col-ref-list b{color:var(--text);}
  .btn{border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:7px;}
  .btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
  .btn-accent{background:linear-gradient(135deg,var(--accent),#a89aff);color:#fff;}
  .status-msg{font-size:12.5px;margin-top:11px;padding:10px 12px;border-radius:8px;background:var(--panel-2);color:var(--muted);display:none;line-height:1.5;}
  .status-msg.show{display:block;}
  .status-msg.ok{color:var(--up);}
  .status-msg.err{color:var(--down);}

  .tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .tab{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);transition:all .15s;}
  .tab.active{border-color:var(--accent);color:var(--text);background:var(--panel-2);}
  .tab .dot{width:9px;height:9px;border-radius:50%;}
  .export-btn{margin-left:auto;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;}
  .client-switcher{position:relative;display:inline-block;}
  .client-switcher-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;color:var(--text);min-width:170px;}
  .client-switcher-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .client-switcher-btn .chev{margin-left:auto;font-size:11px;color:var(--muted);}
  .client-switcher-dropdown{position:absolute;top:calc(100% + 6px);right:0;z-index:50;width:280px;max-height:360px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;}
  .client-switcher-dropdown.open{display:block;}
  .client-switcher-search{width:100%;box-sizing:border-box;padding:10px 12px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;outline:none;position:sticky;top:0;background:var(--panel-2);}
  .client-switcher-biztabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:37px;background:var(--panel-2);z-index:1;}
  .client-switcher-biztab{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:5px 0;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .client-switcher-biztab.active{border-color:var(--accent);color:var(--accent);background:rgba(139,124,255,.12);}
  .client-switcher-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13.5px;color:var(--text);}
  .client-switcher-item:hover{background:var(--panel);}
  .client-switcher-item.active{background:rgba(139,124,255,.15);color:var(--accent);font-weight:700;}
  .client-switcher-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .client-switcher-empty{padding:14px;color:var(--muted);font-size:12.5px;text-align:center;}
  .ai-chat-toggle{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a89aff);border:none;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100;}
  .ai-chat-panel{position:fixed;bottom:90px;right:24px;width:520px;max-height:min(760px,85vh);background:var(--panel-2);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden;z-index:100;}
  .ai-chat-panel.open{display:flex;}
  .ai-chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--text);}
  .ai-chat-icon-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px;}
  .ai-chat-setup{padding:16px;display:none;}
  .ai-chat-setup.show{display:block;}
  .ai-chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:320px;}
  .ai-chat-msg{font-size:14px;line-height:1.65;padding:11px 14px;border-radius:10px;max-width:90%;white-space:pre-wrap;}
  .ai-chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
  .ai-chat-msg.assistant{align-self:flex-start;background:var(--panel);color:var(--text);}
  .ai-chat-msg.system{align-self:center;color:var(--muted);font-size:11.5px;text-align:center;}
  .ai-chat-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);}
  .ai-chat-input-row textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:'Pretendard',sans-serif;max-height:140px;min-height:44px;}
  .ai-chat-input-row button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;}
  @media (max-width:640px){
    .ai-chat-panel{right:10px;left:10px;width:auto;bottom:84px;}
    .ai-chat-toggle{right:16px;bottom:16px;}
  }

  .main-layout{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 28px;min-height:400px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--muted);font-size:14px;text-align:center;gap:10px;line-height:1.6;}
  header.rep{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px;}
  .idn{display:flex;align-items:center;gap:14px;}
  .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex-shrink:0;font-family:'Pretendard',sans-serif;}
  .idn-name{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:700;}
  .badge{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--muted);font-weight:600;}
  .period{font-size:13px;color:var(--muted);margin-top:4px;}
  .totals{display:flex;gap:32px;text-align:right;}
  .totals .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:500;}
  .totals .val{font-family:'Pretendard',sans-serif;font-size:30px;font-weight:800;margin-top:3px;letter-spacing:-.01em;}
  .totals .val.accent{color:var(--accent);}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px;}
  .kpi{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .2s;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .kpi:hover{border-color:var(--accent);}
  .kpi-label{font-size:12.5px;color:var(--muted);margin-bottom:9px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi-value{font-family:'Pretendard',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
  .kpi-note{font-size:16px;font-weight:800;padding:7px 13px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .kpi-note.up{color:var(--up);background:rgba(74,222,154,.14);} .kpi-note.down{color:var(--down);background:rgba(255,107,133,.14);}
  .kpi-spark{width:100%;height:30px;margin-top:9px;}

  .charts-row{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:22px;}
  .panel{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .panel-title{font-size:15.5px;font-weight:700;margin-bottom:14px;color:var(--text);}
  .chart-box{height:320px;}

  .bottom-row{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 7px;border-bottom:1px solid var(--border);}
  td{padding:10px 7px;border-bottom:1px solid #262841;}
  tr:last-child td{border-bottom:none;}
  .kw-name{color:var(--text);font-weight:600;}
  .camp-name-cell{max-width:150px;}
  .camp-name-scroll{display:block;max-width:150px;overflow-x:auto;white-space:nowrap;scrollbar-width:thin;padding-bottom:2px;}
  .camp-name-scroll::-webkit-scrollbar{height:4px;}
  .camp-name-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .improve-box{margin-bottom:16px;}
  .improve-row{display:flex;align-items:center;justify-content:space-between;}
  .improve-side .m{font-size:12.5px;color:var(--muted);font-weight:500;}
  .improve-side .v{font-family:'Pretendard',sans-serif;font-size:25px;font-weight:800;margin-top:4px;}
  .improve-side.right{text-align:right;}
  .improve-side.right .v{color:var(--accent);}
  .arrow{color:var(--muted);font-size:18px;}
  .divider{height:1px;background:var(--border);margin:14px 0;}
  .sub-metric{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);}
  .sub-metric .chg{color:var(--text);font-weight:700;font-family:'Pretendard',sans-serif;font-size:15px;}


  .filter-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;position:sticky;top:20px;}
  .filter-head{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .filter-group{margin-bottom:14px;}
  .filter-campaign-list{max-height:260px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;}
  .filter-campaign-list::-webkit-scrollbar{width:5px;}
  .filter-campaign-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .filter-group-title{background:rgba(139,124,255,.18);color:#c3b8ff;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;margin-bottom:6px;}
  .filter-item{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;color:var(--text);font-weight:500;}
  .filter-item input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;}
  .filter-item .swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  @media (max-width:1100px){
    .wrap{grid-template-columns:1fr;}
    .input-panel{position:static;}
    .main-layout{grid-template-columns:1fr;}
    .filter-panel{position:static;}
    .kpi-row{grid-template-columns:repeat(3,1fr);}
    .charts-row, .bottom-row{grid-template-columns:1fr;}
  }

  @media (max-width:640px){
    body{font-size:13px;}
    .wrap{padding:14px;}
    header.rep{flex-direction:column;align-items:flex-start;}
    .totals{gap:16px;text-align:left;width:100%;}
    .idn-name{font-size:16px;}
    .kpi-row{grid-template-columns:repeat(2,1fr)!important;}
    .panel{padding:14px;overflow-x:auto;}
    .chart-box{height:240px!important;}
    table{font-size:12px;}
  }
</style>
</head>
<body>

<div id="authScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:340px;">
    <h2 style="margin:0 0 4px;font-size:18px;">📊 광고 성과 대시보드</h2>
    <div style="font-size:12px;color:var(--muted);margin-bottom:20px;">팀 계정으로 로그인하면 전체 업체 데이터를 함께 볼 수 있어요.</div>
    <div class="field"><label>이메일</label><input id="auth-email" type="email" placeholder="you@company.com"></div>
    <div class="field"><label>비밀번호</label><input id="auth-pw" type="password" placeholder="6자 이상"></div>
    <button class="btn btn-accent" id="loginBtn">로그인</button>
    <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;">계정이 없으신가요? 관리자에게 계정 생성을 요청해주세요.</div>
    <div class="status-msg" id="authStatus"></div>
  </div>
</div>

<div class="wrap" id="mainApp" style="display:none;grid-template-columns:1fr;max-width:1280px;margin:0 auto;">
  <div style="grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:-8px;flex-wrap:wrap;row-gap:6px;">
    <a href="index.html" style="font-size:12px;color:var(--accent);text-decoration:none;">📊 대시보드</a>
    <a href="overview.html" style="font-size:12px;color:var(--accent);text-decoration:none;">🗂️ 전체 업체 개요</a>
    <a href="keywords.html" style="font-size:12px;color:var(--accent);text-decoration:none;">🔑 키워드 전용 보기</a>
    <a href="ads.html" style="font-size:12px;color:var(--accent);text-decoration:none;">🖼️ 소재 전용 보기</a>
    <a href="hourly.html" style="font-size:12px;color:var(--accent);text-decoration:none;">⏰ 시간대별 전용 보기</a>
    <a href="input.html" style="font-size:12px;color:var(--accent);text-decoration:none;">+ 데이터 입력하기</a>
    <div class="client-switcher" id="clientSwitcher" style="margin-left:auto;">
      <button class="client-switcher-btn" id="clientSwitcherBtn" type="button"><span class="dot" id="clientSwitcherDot" style="background:#666;"></span><span id="clientSwitcherLabel">업체 선택</span><span class="chev">▾</span></button>
      <div class="client-switcher-dropdown" id="clientSwitcherDropdown">
        <input class="client-switcher-search" id="clientSwitcherSearch" placeholder="업체 검색...">
        <div class="client-switcher-biztabs" id="clientSwitcherBizTabs">
          <button class="client-switcher-biztab active" data-biztype="ALL" type="button">전체</button>
          <button class="client-switcher-biztab" data-biztype="DB" type="button">DB</button>
          <button class="client-switcher-biztab" data-biztype="B2C" type="button">B2C</button>
        </div>
        <div id="clientSwitcherList"></div>
      </div>
    </div>
    <span id="authUserEmail" style="font-size:12px;color:var(--muted);"></span>
    <button class="export-btn" id="logoutBtn">로그아웃</button>
  </div>

  <div>
    <div class="tabs" id="tabs"></div>
    <div class="main-layout" id="mainLayout">
      <div class="card" id="card">
        <div class="empty-state">
          <div style="font-size:28px;">📊</div>
          <div>왼쪽에서 업체명과 파일을 올리면<br>이곳에 계정별 대시보드가 만들어져요.</div>
        </div>
      </div>
      <div></div>
    </div>
  </div>

<button id="aiChatToggleBtn" class="ai-chat-toggle" title="AI에게 데이터로 물어보기">🤖</button>
<div id="aiChatPanel" class="ai-chat-panel">
  <div class="ai-chat-header">
    <span>🤖 AI 데이터 질문</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <button id="aiChatNewBtn" class="ai-chat-icon-btn" title="새 대화 시작">🔄</button>
      <button id="aiChatSettingsBtn" class="ai-chat-icon-btn" title="API 키 설정">⚙️</button>
      <button id="aiChatCloseBtn" class="ai-chat-icon-btn" title="닫기">✕</button>
    </div>
  </div>
  <div id="aiChatSetup" class="ai-chat-setup">

<script>
let activeSlug = null;
const filterState = {};
const monthFilterState = {};
const compareMonthState = {};
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
const CAMPAIGN_TYPE_LABELS = { WEB_SITE:'파워링크', SHOPPING:'쇼핑검색', POWER_CONTENTS:'파워컨텐츠', BRAND_SEARCH:'브랜드검색광고', PLACE:'플레이스', PLACE_TP:'플레이스', CATEGORY_EDIT:'세부업종', CAMPAIGN_TYPE_UNKNOWN:'기타' };
function campaignTypeLabel(t){ return CAMPAIGN_TYPE_LABELS[t] || t; }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function dateKey(d){ return String(d).replace(/\D/g,''); }
function weekdayOf(dateStr){
  // "2026.07.01" -> Date
  const parts = dateStr.split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return dt.getDay(); // 0=Sun..6=Sat
}

const DETAIL_DATA_FIELDS = ['keywordsByCampaign','wasteKeywordsByCampaign','expandKeywordsByCampaign','brandKeywordsByCampaign','wasteBrandKeywordsByCampaign','expandBrandKeywordsByCampaign','searchTermsByCampaign','wasteSearchTermsByCampaign','expandSearchTermsByCampaign','hourly','hourlyByCampaign','hourlyByDow','adgroupsByCampaign'];
function fieldEmptyDefault(f){ return (f==='hourly'||f==='hourlyByCampaign'||f==='hourlyByDow') ? [] : {}; }
function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
let isAdminUser = false;
let currentUserEmail = '';
function rolesConfigRef(){ return db.collection('config').doc('roles'); }
async function checkIsAdmin(email){
  try{
    const doc = await rolesConfigRef().get();
    if(!doc.exists) return false;
    const admins = doc.data().adminEmails || [];
    return admins.includes(email);
  }catch(e){ console.error(e); return false; }
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}
// 상단 탭 목록(refreshTabs)처럼 이름·색상·업종만 필요한 경우를 위한 가벼운 버전 — 매 페이지를 열 때마다
// 모든 업체의 상세데이터(detailData 하위컬렉션)까지 통째로 읽어오는 낭비를 피함.
async function getClientLight(key){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    return doc.data();
  }catch(e){ console.error(e); return null; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const doc = await docRef.get();
    if(!doc.exists) return null;
    const data = doc.data();
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 월별 하위 컬렉션에 따로 저장돼있어서 여기서 합쳐줌.
    // 아직 하위 컬렉션으로 안 옮겨진(예전 형식) 업체는 month 객체에 그대로 남아있는 값을 그대로 씀(하위호환).
    if(months.length){
      const detailSnap = await docRef.collection('detailData').get().catch(()=>({docs:[]}));
      const detailMap = {}; detailSnap.docs.forEach(d=>{ detailMap[d.id] = d.data(); });
      data.months = months.map(m=>{
        const det = detailMap[m.label];
        const merged = { ...m };
        DETAIL_DATA_FIELDS.forEach(f=>{
          if(det) merged[f] = det[f]!==undefined ? det[f] : fieldEmptyDefault(f);
          else if(m[f]===undefined) merged[f] = fieldEmptyDefault(f);
        });
        return merged;
      });
    }
    return data;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    const docRef = userClientsRef().doc(id);
    const months = data.months || [];
    // 문서 용량(1MB) 제한 대응: 무거운 필드(상세데이터)는 메인 문서에서 빼서 월별 하위 컬렉션 문서로 분리 저장
    const lightMonths = months.map(m=>{
      const light = { ...m };
      DETAIL_DATA_FIELDS.forEach(f=> delete light[f]);
      return light;
    });
    const batch = db.batch();
    batch.set(docRef, { ...data, months: lightMonths });
    months.forEach(m=>{
      if(!m.label) return;
      const detailData = {}; DETAIL_DATA_FIELDS.forEach(f=>{ detailData[f] = m[f]!==undefined ? m[f] : fieldEmptyDefault(f); });
      batch.set(docRef.collection('detailData').doc(m.label), detailData);
    });
    await batch.commit();
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ---------- AI 데이터 질문 챗봇 ---------- */
const AI_KEY_STORAGE = 'ad_dashboard_gemini_key';
const CHAT_HISTORY_STORAGE = 'ad_dashboard_chat_history';
const CHAT_OPEN_STORAGE = 'ad_dashboard_chat_open';
function loadChatHistory(){ try{ return JSON.parse(sessionStorage.getItem(CHAT_HISTORY_STORAGE) || '[]'); }catch(e){ return []; } }
function saveChatHistory(){ try{ sessionStorage.setItem(CHAT_HISTORY_STORAGE, JSON.stringify(aiChatHistory.slice(-30))); }catch(e){} }
let aiChatHistory = loadChatHistory();
function getAIApiKey(){ return localStorage.getItem(AI_KEY_STORAGE) || ''; }
function setAIApiKey(k){ localStorage.setItem(AI_KEY_STORAGE, k); }
function extractTopKeywordsFromClientData(data){
  const months = data.months || [];
  if(!months.length) return [];
  const last = months[months.length-1];
  const maps = [last.keywordsByCampaign, last.brandKeywordsByCampaign, last.searchTermsByCampaign].filter(Boolean);
  const all = [];
  maps.forEach(map=>{
    Object.keys(map||{}).forEach(camp=>{
      (map[camp]||[]).forEach(item=> all.push({ ...item, campaign: camp }));
    });
  });
  all.sort((a,b)=> ((b.revenue||0)-(a.revenue||0)) || ((b.conv||0)-(a.conv||0)));
  return all.slice(0,15);
}
async function buildAllClientsSummary(){
  const keys = await listClients();
  const rows = (await Promise.all(keys.map(async key=>{
    const d = await getClientLight(key);
    if(!d) return null;
    const months = d.months || [];
    const last = months[months.length-1];
    if(!last) return null;
    return { name: d.name, industry: d.industry||'-', isDB: d.bizType==='DB', label: last.label, cost: last.cost||0, conv: last.conv||0, revenue: last.revenue||0 };
  }))).filter(Boolean);
  return rows;
}
async function buildAIContext(){
  const data = window.__currentClientData;
  const ctx = window.__pageAIContext;
  if(!data || !ctx){
    const rows = await buildAllClientsSummary();
    if(!rows.length) return '아직 등록된 업체가 없어요.';
    const lines = ['현재 특정 업체가 선택돼있지 않아요. 아래는 전체 업체의 최근 기간 요약이에요 — 특정 업체를 지정하지 않은 질문에는 이 요약을 참고해서 답하고, 특정 업체의 자세한 분석이 필요한 질문이면 어떤 업체를 볼지 먼저 사용자에게 물어보세요.', ''];
    rows.forEach(r=>{
      const metric = r.isDB ? `전환 ${r.conv}건` : `매출 ${Math.round(r.revenue*10000).toLocaleString('ko-KR')}원`;
      lines.push(`- ${r.name} (${r.industry}, ${r.label}): 비용 ${Math.round(r.cost*10000).toLocaleString('ko-KR')}원, ${metric}`);
    });
    return lines.join('\n');
  }
  const lines = [];
  lines.push(`업체명: ${data.name} (${data.industry||'-'}), 업종: ${ctx.isDB?'DB(상담·전환형)':'B2C(매출형)'}`);
  lines.push(`현재 보고 있는 화면: 캠페인 비교 전용 페이지 - ${ctx.periodLabel} 기준`);
  if(ctx.rows.length){
    lines.push('\n캠페인별 성과 (효율 좋은 순):');
    ctx.rows.forEach(r=>{
      const metric = ctx.isDB ? `전환 ${r.conv}건, CPA ${r.cpa!==null?Math.round(r.cpa).toLocaleString('ko-KR')+'원':'-'}` : `매출 ${Math.round((r.revenue||0)*10000).toLocaleString('ko-KR')}원, ROAS ${r.roas.toFixed(0)}%`;
      lines.push(`- ${r.campaign} (${campaignTypeLabel(r.type)}): 비용 ${Math.round(r.cost*10000).toLocaleString('ko-KR')}원, ${metric}`);
    });
  }
  if(ctx.insights.length){
    lines.push('\n이 페이지가 이미 뽑아낸 인사이트:');
    ctx.insights.forEach(t=> lines.push(`- ${t}`));
  }
  const topKeywords = extractTopKeywordsFromClientData(data);
  if(topKeywords.length){
    lines.push('\n참고: 이 업체의 최근 기간 키워드/검색어 성과:');
    topKeywords.forEach(k=> lines.push(`- ${k.keyword} (${k.campaign}): 비용 ${Math.round((k.cost||0)*10000).toLocaleString('ko-KR')}원, 전환 ${k.conv||0}건`));
  }
  return lines.join('\n');
}
function formatChatText(text){
  // 마크다운 별표(**굵게**, * 목록)를 그대로 화면에 노출하지 않고 자연스러운 텍스트로 바꿔줌
  let s = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/^[*-]\s+/gm, '• ');
  s = s.replace(/\*/g, '');
  s = s.replace(/^-{3,}\s*$/gm, '');
  return s;
}
function appendChatMsg(role, text){
  const body = document.getElementById('aiChatBody');
  const div = document.createElement('div');
  div.className = 'ai-chat-msg ' + role;

  body.scrollTop = body.scrollHeight;
  return div;
}

document.getElementById('aiChatSettingsBtn').onclick = ()=>{
  document.getElementById('aiChatSetup').classList.add('show');

};

  setAIApiKey(v);
  document.getElementById('aiApiKeyInput').value = '';
  refreshChatUI();
  if(!document.getElementById('aiChatBody').children.length){
    appendChatMsg('system', '준비됐어요. 지금 보고 있는 화면의 데이터에 대해 질문해보세요.');
  }
};
async function sendAIChat(){
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();
  if(!text) return;
  const apiKey = getAIApiKey();
  if(!apiKey){ refreshChatUI(); return; }
  appendChatMsg('user', text);
  input.value = '';
  aiChatHistory.push({ role:'user', content: text });
  saveChatHistory();
  const sendBtn = document.getElementById('aiChatSendBtn');
  sendBtn.disabled = true;
  const loadingEl = appendChatMsg('assistant', '생각 중...');
  try{
    const contextStr = await buildAIContext();
    const systemPrompt = `당신은 네이버 검색광고 성과 데이터를 분석해주는 어시스턴트입니다. 아래는 지금 대행사 담당자가 보고 있는 화면의 데이터 요약입니다. 이 데이터를 바탕으로 한국어로 간결하고 실용적으로 답변하세요. 데이터에 없는 내용은 추측하지 말고 모른다고 답하세요.\n\n${contextStr}`;
    const contents = aiChatHistory.slice(-10).map(m=>({ role: m.role==='assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: systemPrompt }] }
      })
    });
    if(!res.ok){
      const errBody = await res.json().catch(()=>({}));
      throw new Error((errBody && errBody.error && errBody.error.message) || `HTTP ${res.status}`);
    }
    const json = await res.json();
    const cand = (json.candidates && json.candidates[0]) || {};
    const parts = (cand.content && cand.content.parts) || [];
    const replyText = parts.map(p=>p.text||'').join('\n').trim() || '(응답이 없어요)';
    loadingEl.innerHTML = formatChatText(replyText);
    aiChatHistory.push({ role:'assistant', content: replyText });
    saveChatHistory();
  }catch(e){
    console.error(e);
    loadingEl.innerHTML = formatChatText('오류가 발생했어요: ' + (e.message||e));
    loadingEl.style.color = 'var(--down)';
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


function mergedCampaignList(data){
  const map = {};
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

/* ---------- 렌더링 ---------- */

// 제안 실행 추적 — 인사이트(캠페인 지목형)에 "적용 표시" 토글을 붙여서, 다음 달에 실제로
// 그 캠페인의 문제 지표(CPA/ROAS/전환)가 개선됐는지 확인할 수 있게 함.
// 키는 "적용 표시한 시점의 기간::캠페인명::인사이트 종류" 문자열 — 같은 캠페인의 같은 종류 문제가
// 다시 발생하면 새 기간으로 다시 표시할 수 있도록 기간을 키에 포함시킴.
function suggestionKey(monthLabel, campaign, kind){ return `${monthLabel}::${campaign}::${kind}`; }
function parseSuggestionKey(k){
  const parts = String(k).split('::');
  if(parts.length!==3) return null;
  const [month, campaign, kind] = parts;
  return { month, campaign, kind };
}
// kind별로 "이 캠페인의 문제 지표"를 특정 달의 원본 campaigns[] 데이터에서 직접 계산 (필터·병합 영향 안 받게)
function getCampaignMetricForMonth(monthObj, campaignName, kind){
  if(!monthObj || !monthObj.campaigns) return null;
  const c = monthObj.campaigns.find(x=>x.campaign===campaignName);
  if(!c) return null;
  if(kind==='high-cpa') return c.conv>0 ? (c.cost*10000/c.conv) : null;
  if(kind==='roas-low') return c.cost>0 ? (c.revenue/c.cost*100) : null;
  if(kind==='zero-conv') return c.conv||0;
  return null;
}
const KIND_LABEL = { 'high-cpa':'CPA 개선', 'zero-conv':'전환 발생', 'roas-low':'ROAS 개선' };
// improved: metric이 "좋아지는 방향"으로 바뀌었는지 판단 (kind마다 좋은 방향이 다름)
function isMetricImproved(kind, before, after){
  if(before===null || after===null || before===undefined || after===undefined) return null;
  if(kind==='high-cpa') return after < before;
  if(kind==='roas-low') return after > before;
  if(kind==='zero-conv') return after > 0;
  return null;
}
function fmtMetric(kind, v){
  if(v===null || v===undefined) return '-';
  if(kind==='high-cpa') return Math.round(v).toLocaleString('ko-KR')+'원';
  if(kind==='roas-low') return v.toFixed(0)+'%';
  if(kind==='zero-conv') return v+'건';
  return String(v);
}
// 지난 기간에 "적용함"으로 표시했던 제안들을 모아, 그 이후 가장 최근 달과 비교해서 실제로 개선됐는지 보여줌.
// 적용 표시한 달 자체가 최신 달이면 아직 비교할 "다음 달"이 없으므로 건너뜀.
function buildAppliedSuggestionsReviewHTML(data, allMonths){
  const applied = data.appliedSuggestions || [];
  if(!applied.length || !allMonths.length) return '';
  const latestMonth = allMonths[allMonths.length-1];
  const rows = applied.map(k=>{
    const parsed = parseSuggestionKey(k);
    if(!parsed) return null;
    if(parsed.month===latestMonth.label) return null; // 적용한 달 자체 = 아직 결과 판단 불가
    const monthObj = allMonths.find(m=>m.label===parsed.month);
    if(!monthObj) return null;
    const before = getCampaignMetricForMonth(monthObj, parsed.campaign, parsed.kind);
    const after = getCampaignMetricForMonth(latestMonth, parsed.campaign, parsed.kind);
    const improved = isMetricImproved(parsed.kind, before, after);
    return { key:k, ...parsed, before, after, improved };
  }).filter(Boolean);
  if(!rows.length) return '';
  rows.sort((a,b)=> (a.improved===b.improved) ? 0 : (a.improved ? -1 : 1)); // 개선된 것부터
  const rowHtml = r => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text);padding:5px 0;border-bottom:1px solid var(--border);">
    <span>${r.improved===true?'✅':r.improved===false?'⚠️':'ℹ️'} <b>${r.campaign}</b> — ${KIND_LABEL[r.kind]||r.kind} <span style="color:var(--muted);">(${r.month} 적용 표시)</span></span>
    <span style="white-space:nowrap;color:${r.improved===true?'var(--up)':r.improved===false?'var(--down)':'var(--muted)'};font-weight:600;">${fmtMetric(r.kind, r.before)} → ${fmtMetric(r.kind, r.after)}</span>
  </div>`;
  return `<div class="panel" style="margin-bottom:18px;">
    <div class="panel-title">✅ 제안 실행 추적 <span style="font-size:11px;color:var(--muted);font-weight:400;">— "적용 표시"한 제안이 이후(${latestMonth.label}) 실제로 개선됐는지</span></div>
    ${rows.map(rowHtml).join('')}
  </div>`;
}

const cpSortState = {}; // key -> { field, dir }

function mergeCampaignRows(months, fstate){
  const map = {};
  months.forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!fstate.campaigns.has(c.campaign)) return;
      if(!map[c.campaign]) map[c.campaign] = { campaign:c.campaign, type:c.type, cost:0, revenue:0, conv:0, impressions:0, clicks:0, rankSum:0, rankImp:0 };
      map[c.campaign].cost += c.cost; map[c.campaign].revenue += c.revenue; map[c.campaign].conv += c.conv;
      map[c.campaign].impressions += c.impressions||0; map[c.campaign].clicks += c.clicks||0;
      if(c.avgRank!==null && c.avgRank!==undefined && c.impressions>0){
        map[c.campaign].rankSum += c.avgRank*c.impressions; map[c.campaign].rankImp += c.impressions;
      }
    });
  });
  return Object.values(map).map(v=>({ ...v, avgRank: v.rankImp>0 ? (v.rankSum/v.rankImp) : null }));
}

function renderCampaignsPage(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  document.documentElement.style.setProperty('--accent', data.color);
  const allMonths = data.months || [];
  if(!(key in monthFilterState)) monthFilterState[key] = 'ALL';
  const selectedMonth = monthFilterState[key];
  const months = selectedMonth==='ALL' ? allMonths : allMonths.filter(m=>m.label===selectedMonth);
  const campaignList = mergedCampaignList(data);
  const allTypes = [...new Set(campaignList.map(c=>c.type))];
  const isDB = data.bizType === 'DB';

  if(!(key in cpSortState)) cpSortState[key] = { field:'default', dir:'desc' };
  const sort = cpSortState[key];

  let rows = mergeCampaignRows(months, fstate);
  rows = rows.map(r=>({ ...r, cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
    ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0,
    cpc: r.clicks>0 ? (r.cost*10000/r.clicks) : null }));
  function applySort(list, sortState, defaultField){
    const field = sortState.field==='default' ? defaultField : sortState.field;
    const mult = sortState.dir==='asc' ? 1 : -1;
    return [...list].sort((a,b)=>{
      let av=a[field], bv=b[field];
      if(av===null) av = -Infinity; if(bv===null) bv = -Infinity;
      return (av-bv)*mult;
    });
  }
  rows = applySort(rows, sort, isDB?'cost':'revenue');

  // 전기간 대비 추이: 기준 기간의 직전 기간 데이터 확보
  let refMonth = selectedMonth!=='ALL' ? allMonths.find(m=>m.label===selectedMonth) : allMonths[allMonths.length-1];
  if(!(key in compareMonthState)) compareMonthState[key] = 'AUTO';
  let prevMonth = null;
  if(refMonth){
    if(compareMonthState[key]!=='AUTO'){
      prevMonth = allMonths.find(m=>m.label===compareMonthState[key]) || null;
      if(prevMonth && prevMonth.label===refMonth.label) prevMonth = null;
    } else {
      const idx = allMonths.findIndex(m=>m.label===refMonth.label);
      if(idx>0) prevMonth = allMonths[idx-1];
    }
  }
  let prevMap = {};
  if(prevMonth){
    mergeCampaignRows([prevMonth], fstate).forEach(r=>{
      prevMap[r.campaign] = { ...r,
        cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0,
        ctr: r.impressions>0 ? (r.clicks/r.impressions*100) : 0, cvr: r.clicks>0 ? (r.conv/r.clicks*100) : 0,
        cpc: r.clicks>0 ? (r.cost*10000/r.clicks) : null };
    });
  }
  function pctOf(curr, prev){
    if(prev===null || prev===undefined || curr===null || curr===undefined) return null;
    if(prev===0) return curr>0 ? 100 : null;
    return (curr-prev)/prev*100;
  }
  function cellTrend(pct, goodDir){
    if(pct===null || pct===undefined || isNaN(pct) || Math.abs(pct)<5) return '';
    return `<span style="margin-left:5px;font-size:9.5px;font-weight:700;color:${pct>=0?'var(--up)':'var(--down)'};">${pct>=0?'▲':'▼'}${Math.abs(pct).toFixed(0)}%</span>`;
  }
  rows = rows.map(r=>{
    const prev = prevMap[r.campaign];
    const isNewCamp = !!prevMonth && !prev;
    const trends = prev ? {
      cost: pctOf(r.cost, prev.cost), conv: pctOf(r.conv, prev.conv), revenue: pctOf(r.revenue, prev.revenue),
      cpa: pctOf(r.cpa, prev.cpa), roas: pctOf(r.roas, prev.roas), ctr: pctOf(r.ctr, prev.ctr), cvr: pctOf(r.cvr, prev.cvr),
      cpc: pctOf(r.cpc, prev.cpc), avgRank: pctOf(r.avgRank, prev.avgRank)
    } : {};
    return { ...r, isNewCamp, trends };
  });
  const pinnedSet = new Set(data.pinnedCampaigns || []);
  rows.sort((a,b)=> (pinnedSet.has(b.campaign)?1:0) - (pinnedSet.has(a.campaign)?1:0));

  // 💡 캠페인 성과 인사이트 (현재 선택된 기간·필터·비교 기준 기준)
  // warn 항목은 생성 시점에 severity(원화 기준 추정 영향 규모, 단위: 만원)를 함께 붙여서
  // 텍스트 재파싱 없이 "실제로 돈이 얼마나 걸린 문제인지" 기준으로 정렬할 수 있게 함.
  // 캠페인 간(같은 기간, best vs 문제 캠페인) CTR·CVR·CPC·평균노출순위를 비교해서
  // "타겟팅/소재/입찰가" 중 어디가 문제일 가능성이 높은지 추정 텍스트를 만들어 붙임.
  // 시간 축(직전 기간 대비)이 아니라 캠페인 축(같은 기간, 잘하는 캠페인 대비) 비교라는 점이
  // decomposeCpaChange()(직전 기간 대비 CPC/CVR 요인분해)와 다름.
  function diagnoseCampaignIssue(worst, best){
    const reasons = [];
    const lowImpression = worst.impressions < 100;
    const badRank = worst.avgRank!==null && best.avgRank!==null && worst.avgRank - best.avgRank >= 2;
    const lowCtr = best.ctr>0 && worst.ctr < best.ctr*0.6 && worst.impressions>=100;
    const lowCvr = best.cvr>0 && worst.cvr < best.cvr*0.6 && worst.clicks>=20;
    const highCpc = best.cpc!==null && worst.cpc!==null && worst.cpc > best.cpc*1.3;

    if(lowImpression || badRank){
      const rankTxt = badRank ? ` (평균노출순위 ${worst.avgRank.toFixed(1)}위, '${best.campaign}'은 ${best.avgRank.toFixed(1)}위)` : '';
      reasons.push(`입찰가·노출 경쟁에서 밀리고 있을 수 있어요${rankTxt} — 입찰가나 일예산을 올려서 노출이 늘어나는지 확인해보세요.`);
    }
    if(lowCvr){
      reasons.push(`클릭 대비 전환이 낮아요(CVR ${worst.cvr.toFixed(2)}%, '${best.campaign}' ${best.cvr.toFixed(2)}%) — 타겟팅이나 랜딩페이지(방문자와 실제 니즈의 불일치)를 점검해보세요.`);
    }
    if(lowCtr){
      reasons.push(`노출 대비 클릭이 낮아요(CTR ${worst.ctr.toFixed(2)}%, '${best.campaign}' ${best.ctr.toFixed(2)}%) — 소재 문구나 이미지 교체를 검토해보세요.`);
    }
    if(highCpc && !lowCvr && !lowCtr){
      reasons.push(`클릭당 비용이 높아요(CPC ${Math.round(worst.cpc).toLocaleString('ko-KR')}원, '${best.campaign}' ${Math.round(best.cpc).toLocaleString('ko-KR')}원) — 입찰가나 키워드 경쟁 강도를 점검해보세요.`);
    }
    if(!reasons.length) return '타겟팅이나 소재 점검을 추천해요.';
    return reasons[0];
  }
  function generateCampaignInsights(){
    const insights = [];
    const MIN_CONV = 5, MIN_COST_MAN = 5;
    if(isDB){
      const withConv = rows.filter(r=>r.cpa!==null && r.conv>=MIN_CONV);
      if(withConv.length>=2){
        const best = withConv.reduce((a,b)=>a.cpa<b.cpa?a:b);
        const worst = withConv.reduce((a,b)=>a.cpa>b.cpa?a:b);
        // 전환수로 가중한 전체 평균 CPA — best 캠페인이 이 평균에 비해 지나치게 낮으면(표본이 적어 우연히 CPA가
        // 튄 경우가 많음) "예산을 옮기면 N건 더 나온다" 추정이 (예산 / best.cpa)로 인해 비현실적으로 커짐.
        // 예: 브랜드키워드 캠페인 CPA가 358원처럼 튀면 288만원 이동만으로 "8031건 증가" 같은 값이 나옴.
        const totalConvAll = withConv.reduce((s,r)=>s+r.conv,0);
        const totalCostAllMan = withConv.reduce((s,r)=>s+r.cost,0);
        const avgCpaAll = totalConvAll>0 ? (totalCostAllMan*10000/totalConvAll) : null;
        const bestCpaIsUnrealistic = avgCpaAll!==null && best.cpa < avgCpaAll/5;
        insights.push({type:'good', text:`'${best.campaign}' 캠페인이 가장 효율적이에요 (CPA ${best.cpa.toLocaleString('ko-KR')}원, 전환 ${best.conv}건 기준)`});
        if(worst.campaign!==best.campaign){
          // severity = 이 캠페인이 best 대비 CPA 초과분으로 날린 추정 비용(만원)
          const wasteMan = Math.max(0, worst.cost - (worst.conv*best.cpa/10000));
          const diagnosis = diagnoseCampaignIssue(worst, best);
          insights.push({type:'warn', severity: wasteMan, campaign: worst.campaign, kind:'high-cpa', text:`'${worst.campaign}' 캠페인은 CPA가 ${worst.cpa.toLocaleString('ko-KR')}원으로 높아요 (전환 ${worst.conv}건 기준). ${diagnosis}`});
          if(worst.cpa > best.cpa*1.3 && !bestCpaIsUnrealistic){
            const shiftMan = Math.round(worst.cost*0.3*10)/10;
            if(shiftMan>=1){
              const shiftWon = shiftMan*10000;
              const gain = Math.round(shiftWon/best.cpa) - Math.round(shiftWon/worst.cpa);
              if(gain>=1) insights.push({type:'good', text:`💡 '${worst.campaign}' 예산 중 ${fmtMan(shiftMan)}원(약 30%)을 '${best.campaign}'로 옮기면, 같은 총예산으로 전환이 약 ${gain}건 더 나올 수 있어요 (추정치).`});
            }
          }
        }
      }
      const zeroConvBase = rows.filter(r=>r.impressions>=100 && r.conv>=MIN_CONV);
      const avgCtrForZero = zeroConvBase.length ? zeroConvBase.reduce((a,r)=>a+r.ctr,0)/zeroConvBase.length : null;
      rows.filter(r=>r.conv===0 && r.cost>1).slice(0,3).forEach(r=>{
        // severity = 전환 0건인 채로 소진한 비용 전액(만원) — 가장 명백한 손실이라 CPA 상승 경고보다 우선순위가 높아야 함
        let diagnosis;
        if(r.clicks>=20){
          diagnosis = `클릭이 ${r.clicks}건이나 있었는데도 전환이 없었어요 — 소재보다는 랜딩페이지나 타겟팅(방문자와 실제 구매/상담 니즈의 불일치)을 먼저 점검해보세요.`;
        } else if(r.impressions<100 || (r.avgRank!==null && r.avgRank>5)){
          const rankTxt = (r.avgRank!==null && r.avgRank>5) ? ` (평균노출순위 ${r.avgRank.toFixed(1)}위)` : '';
          diagnosis = `노출 자체가 적어요(${r.impressions.toLocaleString('ko-KR')}회${rankTxt}) — 입찰가가 낮아 노출 경쟁에서 밀리고 있을 수 있어요. 입찰가나 일예산을 올려서 노출이 늘어나는지 먼저 확인해보세요.`;
        } else if(avgCtrForZero!==null && r.impressions>=100 && r.ctr < avgCtrForZero*0.5){
          diagnosis = `노출 대비 클릭이 적어요(CTR ${r.ctr.toFixed(2)}%, 전체 평균 ${avgCtrForZero.toFixed(2)}%) — 소재 문구나 이미지가 매력적이지 않을 수 있어요. 소재 교체를 검토해보세요.`;
        } else {
          diagnosis = '예산 재배치를 검토해보세요.';
        }
        insights.push({type:'warn', severity: r.cost, campaign: r.campaign, kind:'zero-conv', text:`'${r.campaign}' 캠페인은 ${fmtMan(r.cost)}원을 썼는데 전환이 0건이에요. ${diagnosis}`});
      });
    } else {
      const withCost = rows.filter(r=>r.cost>=MIN_COST_MAN);
      if(withCost.length>=2){
        const best = withCost.reduce((a,b)=>a.roas>b.roas?a:b);
        const worst = withCost.reduce((a,b)=>a.roas<b.roas?a:b);
        insights.push({type:'good', text:`'${best.campaign}' 캠페인 ROAS가 ${best.roas.toFixed(0)}%로 가장 높아요 (비용 ${fmtMan(best.cost)}원 기준).`});
        if(worst.campaign!==best.campaign && worst.roas<100){
          // severity = 손익분기(ROAS 100%) 대비 못 미친 매출 격차(만원)
          const gapMan = Math.max(0, worst.cost - worst.revenue);
          const diagnosis = diagnoseCampaignIssue(worst, best);
          insights.push({type:'warn', severity: gapMan, campaign: worst.campaign, kind:'roas-low', text:`'${worst.campaign}' 캠페인은 ROAS가 ${worst.roas.toFixed(0)}%로 손익분기 이하예요 (비용 ${fmtMan(worst.cost)}원 기준). ${diagnosis}`});
        }
      }
    }
    // 직전 기간 대비 큰 변화가 있는 캠페인 (트렌드가 이미 계산돼 있음)
    const bigMoves = rows.filter(r=>{
      const t = r.trends||{};
      return (isDB ? (t.cpa!==null && t.cpa!==undefined && Math.abs(t.cpa)>=30 && r.conv>=MIN_CONV) : (t.roas!==null && t.roas!==undefined && Math.abs(t.roas)>=20 && r.cost>=MIN_COST_MAN));
    }).slice(0,3);
    bigMoves.forEach(r=>{
      const t = r.trends;
      // severity = 이번 기간 비용 규모(만원) × 악화 정도 — 비용이 큰 캠페인의 급격한 악화를 우선 노출
      if(isDB){
        const isBad = t.cpa>0;
        insights.push({type: isBad?'warn':'good', severity: isBad ? r.cost * (Math.abs(t.cpa)/100) : 0, text:`'${r.campaign}' 캠페인, 직전 기간 대비 CPA가 ${Math.abs(t.cpa).toFixed(0)}% ${t.cpa<=0?'개선':'상승'}됐어요.`});
      } else {
        const isBad = t.roas<0;
        insights.push({type: isBad?'warn':'good', severity: isBad ? r.cost * (Math.abs(t.roas)/100) : 0, text:`'${r.campaign}' 캠페인, 직전 기간 대비 ROAS가 ${Math.abs(t.roas).toFixed(0)}%p ${t.roas>=0?'상승':'하락'}했어요.`});
      }
    });
    if(!insights.length) insights.push({type:'neutral', text:'아직 인사이트를 뽑기엔 데이터가 더 필요해요.'});
    return insights;
  }
  // 잘하고 있는 부분(good)을 먼저, 확인이 필요한 부분(warn)을 심각도(severity, 만원 기준 추정 영향 규모) 순으로 묶어서 보여줌.
  // severity는 generateCampaignInsights에서 원본 데이터로 직접 계산해 붙인 값 — 텍스트를 다시 파싱하지 않음
  // (텍스트 속 %만 보면 "39% 상승"이 "232만원 날림"보다 커 보이는 왜곡이 생길 수 있어서).
  // 상위 2개만 펼쳐서 보여주고 나머지는 접어둠(스크롤 부담 감소).
  function buildCampaignInsightsHTML(insights){
    const icon = t => t==='good' ? '📈' : t==='warn' ? '⚠️' : 'ℹ️';
    const color = t => t==='good' ? 'var(--up)' : t==='warn' ? 'var(--down)' : 'var(--text)';
    const appliedSet = new Set(data.appliedSuggestions || []);
    const currentMonthLabel = refMonth ? refMonth.label : (allMonths.length ? allMonths[allMonths.length-1].label : '');
    const applyToggleHtml = i => {
      if(!i.campaign || !i.kind || !currentMonthLabel) return '';
      const k = suggestionKey(currentMonthLabel, i.campaign, i.kind);
      const isApplied = appliedSet.has(k);
      return isApplied
        ? `<button class="applied-toggle-btn" data-key="${k}" data-applied="1" style="flex-shrink:0;background:rgba(74,222,154,.12);border:1px solid rgba(74,222,154,.4);color:var(--up);border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;">✓ 적용함</button>`
        : `<button class="applied-toggle-btn" data-key="${k}" data-applied="0" style="flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:10.5px;cursor:pointer;white-space:nowrap;">적용 표시</button>`;
    };
    const row = i => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text);padding:5px 0;"><span style="display:flex;gap:8px;"><span>${icon(i.type)}</span><span style="color:${color(i.type)};">${i.text}</span></span>${applyToggleHtml(i)}</div>`;
    const good = insights.filter(i=>i.type==='good');
    const warn = insights.filter(i=>i.type==='warn').sort((a,b)=>(b.severity||0)-(a.severity||0));
    const neutral = insights.filter(i=>i.type!=='good'&&i.type!=='warn');
    const groupLabel = (text, count, extra) => `<div style="display:flex;align-items:center;justify-content:space-between;margin:${count?'10px':'0'} 0 2px;"><span style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;">${text}</span>${extra||''}</div>`;
    let html = '';
    if(good.length) html += groupLabel('잘하고 있어요', 0) + good.map(row).join('');
    if(warn.length){
      const TOP_N = 2;
      const topWarn = warn.slice(0, TOP_N);
      const restWarn = warn.slice(TOP_N);
      const badge = `<span style="font-size:10px;color:var(--down);font-weight:700;background:rgba(255,107,133,.14);padding:2px 8px;border-radius:10px;">심각도 순 ${warn.length}건</span>`;
      html += groupLabel('확인이 필요해요', good.length, badge) + topWarn.map(row).join('');
      if(restWarn.length){
        const detailsId = 'warnMore_' + Math.random().toString(36).slice(2,8);
        html += `<details style="margin-top:2px;"><summary style="cursor:pointer;font-size:11.5px;color:var(--muted);padding:4px 0;">나머지 ${restWarn.length}건 더 보기</summary><div id="${detailsId}">${restWarn.map(row).join('')}</div></details>`;
      }
    }
    if(neutral.length) html += neutral.map(row).join('');
    return html;
  }
  const campaignInsights = generateCampaignInsights();

  // 목표(KPI) 대비 캠페인별 갭 — 목표는 input.html에서 업체 단위로 설정되는데(전체 CPA/ROAS 목표),
  // 정작 "어떤 캠페인 때문에 목표를 못 맞추는지"는 index.html의 goalBadge(업체 전체 요약)만으로는
  // 알 수 없었음. 같은 목표를 캠페인 단위로 적용해서 갭이 큰 캠페인을 바로 짚어줌.
  let goalGapInfo = null;
  if(data.goal && data.goal.target){
    const target = Number(data.goal.target);
    const metricOk = isDB ? data.goal.metric==='cpa' : data.goal.metric==='roas';
    if(target>0 && metricOk){
      const MIN_CONV_GOAL = 5, MIN_COST_GOAL = 5; // 표본 부족한 캠페인은 갭 계산에서 제외
      const eligible = isDB
        ? rows.filter(r=>r.conv>=MIN_CONV_GOAL && r.cpa!==null)
        : rows.filter(r=>r.cost>=MIN_COST_GOAL);
      const withGap = eligible.map(r=>{
        const curr = isDB ? r.cpa : r.roas;
        const gapPct = isDB ? ((curr-target)/target*100) : ((target-curr)/target*100); // 양수면 목표 미달
        return { ...r, curr, gapPct, met: isDB ? curr<=target : curr>=target };
      });
      const missing = withGap.filter(r=>!r.met).sort((a,b)=>b.gapPct-a.gapPct).slice(0,5);
      goalGapInfo = { target, missing, totalEligible: withGap.length, totalMissing: withGap.filter(r=>!r.met).length };
    }
  }

  // CPA/ROAS 원인 분해 — 항등식 기반 추정치(실제 원인은 데이터로 확정된 사실이 아니라 가설이며,
  // 참고한 타사 대시보드도 같은 방식으로 "CPC 요인 X% / CVR 요인 Y%"를 계산해서 보여줌).
  // CPA = CPC / CVR 이므로, CPA 변화율은 로그 근사로 CPC 변화율 + (-CVR 변화율)로 분해 가능함.
  // ROAS = CVR * 객단가(revenue/conv) / CPC 이지만, 데이터에 객단가 변동을 분리할 근거가 약해
  // 여기서는 ROAS도 CPA와 동일하게 "클릭단가(CPC) 요인 vs 전환율(CVR) 요인"으로만 분해함(단순화된 근사치).
  function decomposeCpaChange(curr, prev){
    if(!prev || curr.cpc===null || prev.cpc===null || curr.cvr<=0 || prev.cvr<=0 || curr.cpc<=0 || prev.cpc<=0) return null;
    const cpcChangeLn = Math.log(curr.cpc / prev.cpc);
    const cvrChangeLn = Math.log(curr.cvr / prev.cvr);
    const totalAbsLn = Math.abs(cpcChangeLn) + Math.abs(cvrChangeLn);
    if(totalAbsLn < 0.0001) return { cpcSharePct: 50, cvrSharePct: 50, cpcChangePct: 0, cvrChangePct: 0, dominant: null };
    const cpcSharePct = Math.round(Math.abs(cpcChangeLn) / totalAbsLn * 100);
    return {
      cpcSharePct, cvrSharePct: 100 - cpcSharePct,
      cpcChangePct: (curr.cpc/prev.cpc - 1) * 100,
      cvrChangePct: (curr.cvr/prev.cvr - 1) * 100,
      dominant: cpcSharePct >= 55 ? 'cpc' : (100-cpcSharePct >= 55 ? 'cvr' : null)
    };
  }
  const decompCandidates = prevMonth ? rows
    .filter(r => (isDB ? r.conv>=5 : r.cost>=5) && prevMap[r.campaign])
    .map(r => ({ row:r, decomp: decomposeCpaChange(r, prevMap[r.campaign]) }))
    .filter(x => x.decomp)
    .sort((a,b)=> Math.abs(isDB?(b.row.trends.cpa||0):(b.row.trends.roas||0)) - Math.abs(isDB?(a.row.trends.cpa||0):(a.row.trends.roas||0)))
    .slice(0,5)
    : [];
  function buildDecompHTML(){
    if(!prevMonth) return `<div style="font-size:12px;color:var(--muted);">비교할 직전 기간이 없어서 원인 분해를 볼 수 없어요.</div>`;
    if(!decompCandidates.length) return `<div style="font-size:12px;color:var(--muted);">원인 분해를 계산하기엔 데이터(전환수/비용)가 아직 부족해요.</div>`;
    const cardHTML = ({row, decomp})=>{
      const metricLabel = isDB ? 'CPA' : 'ROAS';
      const metricPct = isDB ? row.trends.cpa : row.trends.roas;
      const metricDir = isDB ? (metricPct>=0?'상승':'개선') : (metricPct>=0?'상승':'하락');
      const metricColor = isDB ? (metricPct>=0?'var(--down)':'var(--up)') : (metricPct>=0?'var(--up)':'var(--down)');
      const dominantText = decomp.dominant==='cpc' ? '주로 클릭단가(CPC) 변화 때문' : decomp.dominant==='cvr' ? '주로 전환율(CVR) 변화 때문' : 'CPC·CVR이 비슷하게 영향';
      return `<div style="padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="font-size:12.5px;color:var(--text);font-weight:600;">${row.campaign} <span style="font-weight:400;color:${metricColor};">${metricLabel} ${Math.abs(metricPct||0).toFixed(0)}% ${metricDir}</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">${dominantText} — CPC 요인 ${decomp.cpcSharePct}% (${decomp.cpcChangePct>=0?'+':''}${decomp.cpcChangePct.toFixed(0)}%) · CVR 요인 ${decomp.cvrSharePct}% (${decomp.cvrChangePct>=0?'+':''}${decomp.cvrChangePct.toFixed(0)}%)</div>
        <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;">
          <div style="width:${decomp.cpcSharePct}%;background:var(--accent);"></div>
          <div style="width:${decomp.cvrSharePct}%;background:var(--border);"></div>
        </div>
      </div>`;
    };
    const TOP_N = 2;
    const top = decompCandidates.slice(0, TOP_N);
    const rest = decompCandidates.slice(TOP_N);
    let html = top.map(cardHTML).join('');
    if(rest.length){
      html += `<details><summary style="cursor:pointer;font-size:11.5px;color:var(--muted);padding:6px 0;">변동폭이 작은 ${rest.length}개 캠페인 더 보기</summary>${rest.map(cardHTML).join('')}</details>`;
    }
    html += `<div style="font-size:10.5px;color:var(--muted);margin-top:8px;">* 항등식(CPA=CPC/CVR) 기반 추정치예요 — 실제 원인은 데이터로 확정된 사실이 아니라 가설이니 참고용으로만 봐주세요.</div>`;
    return html;
  }
  window.__currentClientData = data;
  window.__pageAIContext = {
    isDB,
    periodLabel: selectedMonth==='ALL' ? '전체 기간(누적)' : selectedMonth,
    rows: rows.slice(0,20).map(r=>({ campaign:r.campaign, type:r.type, cost:r.cost, conv:r.conv, revenue:r.revenue, cpa:r.cpa, roas:r.roas, avgRank:r.avgRank })),
    insights: campaignInsights.map(i=>i.text)
  };

  const initial = (data.name||'?').trim().charAt(0);
  const textColor = contrastText(data.color);
  const sortTh = (label, field) => `<th data-field="${field}" style="cursor:pointer;user-select:none;">${label}${sort.field===field?(sort.dir==='desc'?' ▼':' ▲'):''}</th>`;

  const card = document.getElementById('card');
  card.innerHTML = `
    <header class="rep">
      <div class="idn">
        <div class="icon" style="background:${data.color};color:${textColor}">${initial}</div>
        <div>
          <div class="idn-name">${data.name} <span class="badge">캠페인 비교 전용 보기</span></div>
          <div class="period" style="display:flex;align-items:center;gap:8px;">
            <span>${selectedMonth==='ALL' ? '전체 기간' : selectedMonth} 기준</span>
            <div style="display:flex;align-items:center;gap:4px;">
              <button id="monthPrevBtn" title="이전(더 과거) 기간" style="background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">◀</button>
              <select id="monthFilterSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:11.5px;font-weight:600;cursor:pointer;">
                ${[...allMonths].reverse().map(m=>`<option value="${m.label}" ${selectedMonth===m.label?'selected':''}>${m.label} 만 보기</option>`).join('')}
                <option value="ALL" ${selectedMonth==='ALL'?'selected':''}>전체 기간(누적)</option>
              </select>
              <button id="monthNextBtn" title="다음(더 최신) 기간" style="background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">▶</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
            <span style="font-size:11px;color:var(--muted);">▲▼ 비교 기준:</span>
            <select id="compareFilterSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 7px;font-size:10.5px;cursor:pointer;">
              <option value="AUTO" ${compareMonthState[key]==='AUTO'?'selected':''}>직전 기간 자동</option>
              ${allMonths.filter(m=>m.label!==(refMonth?refMonth.label:null)).map(m=>`<option value="${m.label}" ${compareMonthState[key]===m.label?'selected':''}>${m.label} 과 비교</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    </header>

    ${goalGapInfo ? `
    <div class="panel" style="margin-bottom:18px;border-left:3px solid ${goalGapInfo.totalMissing?'var(--down)':'var(--up)'};">
      <div class="panel-title" style="margin-bottom:8px;">🎯 목표(${isDB?'CPA':'ROAS'} ${isDB?goalGapInfo.target.toLocaleString('ko-KR')+'원':goalGapInfo.target+'%'}) 대비 캠페인별 갭</div>
      ${goalGapInfo.totalMissing===0
        ? `<div style="color:var(--up);font-size:12.5px;">비교 가능한 캠페인 ${goalGapInfo.totalEligible}개 모두 목표를 달성하고 있어요.</div>`
        : `<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;">목표 미달 캠페인 ${goalGapInfo.totalMissing}개 (비교 가능 ${goalGapInfo.totalEligible}개 중) — 갭이 큰 순</div>
           ${goalGapInfo.missing.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;">
             <span class="camp-name-cell" style="color:var(--text);">${r.campaign}</span>
             <span style="color:var(--down);font-weight:700;">${isDB ? r.curr.toLocaleString('ko-KR')+'원' : r.curr.toFixed(0)+'%'} <span style="color:var(--muted);font-weight:400;">(목표 대비 ${r.gapPct.toFixed(0)}% ${isDB?'초과':'부족'})</span></span>
           </div>`).join('')}`}
    </div>
    ` : ''}

    <div class="panel" style="margin-bottom:18px;border-left:3px solid var(--accent);">
      <div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;">💡 성과 인사이트</div>
      ${buildCampaignInsightsHTML(campaignInsights)}
    </div>

    ${buildAppliedSuggestionsReviewHTML(data, allMonths)}

    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-title">🔬 ${isDB?'CPA':'ROAS'} 원인 분해 <span style="font-size:11px;color:var(--muted);font-weight:400;">— 변동이 큰 캠페인 상위 5개, 직전 기간 대비</span></div>
      ${buildDecompHTML()}
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-title">📊 캠페인별 ${isDB?'CPA':'ROAS'} · 비용 비교</div>
      <div style="height:280px;position:relative;"><canvas id="campCompareChart"></canvas></div>
    </div>

    <div class="panel">
      <div class="panel-title">📣 전체 캠페인 랭킹 (${rows.length}개) <span style="font-size:11px;color:var(--muted);font-weight:400;">— 열 제목을 클릭하면 정렬돼요</span></div>
      <div style="overflow-x:auto;">
      <table style="min-width:760px;">
        <thead><tr>
          <th class="camp-name-cell" style="white-space:nowrap;">캠페인</th>
          <th style="white-space:nowrap;">유형</th>
          ${sortTh('비용','cost')}
          ${isDB ? sortTh('전환수','conv') : sortTh('전환매출','revenue')}
          ${sortTh('CPA','cpa')}
          ${!isDB ? sortTh('ROAS','roas') : ''}
          ${sortTh('클릭률','ctr')}
          ${sortTh('전환율','cvr')}
          ${sortTh('평균노출순위','avgRank')}
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(r=>{
            const newBadge = r.isNewCamp ? '<span style="margin-left:6px;font-size:9px;padding:1px 6px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;">NEW</span>' : '';
            const t = r.trends || {};
            const isPinned = pinnedSet.has(r.campaign);
            const pinBtn = `<button class="pin-star-btn" data-campaign="${r.campaign.replace(/"/g,'&quot;')}" title="${isPinned?'고정 해제':'상단에 고정'}" style="border:none;background:none;cursor:pointer;font-size:13px;padding:0 4px 0 0;vertical-align:middle;">${isPinned?'⭐':'☆'}</button>`;
            return `<tr>
              <td class="kw-name camp-name-cell">${pinBtn}<span class="camp-name-scroll" title="${r.campaign}">${r.campaign}</span>${newBadge}</td>
              <td style="color:var(--muted);font-size:12px;white-space:nowrap;">${campaignTypeLabel(r.type)}</td>
              <td>${fmtWon(r.cost)}원${cellTrend(t.cost,'down')}</td>
              <td>${isDB ? r.conv+'건'+cellTrend(t.conv,'up') : fmtWon(r.revenue)+'원'+cellTrend(t.revenue,'up')}</td>
              <td>${r.cpa!==null?r.cpa.toLocaleString('ko-KR')+'원':'-'}${cellTrend(t.cpa,'down')}</td>
              ${!isDB ? `<td>${r.roas.toFixed(0)}%${cellTrend(t.roas,'up')}</td>` : ''}
              <td>${r.ctr.toFixed(2)}%${cellTrend(t.ctr,'up')}</td>
              <td>${r.cvr.toFixed(2)}%${cellTrend(t.cvr,'up')}</td>
              <td>${r.avgRank!==null?r.avgRank.toFixed(1)+'위':'-'}${cellTrend(t.avgRank,'down')}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="9" style="color:var(--muted);">표시할 캠페인이 없어요.</td></tr>`}
        </tbody>
      </table>
      </div>
      <div style="margin-top:8px;font-size:10.5px;color:var(--muted);">💡 평균노출순위는 네이버 보고서의 실제 값(노출수 가중평균)이에요. 순위 숫자가 크면서 클릭률도 낮다면 입찰가를 점검해보세요 — 노출 위치가 낮아 클릭 기회 자체가 줄었을 수 있어요.</div>
      ${prevMonth ? `<div style="margin-top:4px;font-size:10.5px;color:var(--muted);">▲▼는 직전 기간(${prevMonth.label}) 대비 각 지표별 변동(5%이상만 표시)이에요. 직전 기간에 없던 캠페인은 NEW로 표시돼요.</div>` : ''}
    </div>
  `;

  // 캠페인별 비용·CPA(또는 ROAS) 비교 막대차트 — 비용 상위 10개 캠페인만 표시(너무 많으면 가독성이 떨어짐)
  if(window.__campCompareChartInstance){ window.__campCompareChartInstance.destroy(); window.__campCompareChartInstance = null; }
  const chartCanvas = document.getElementById('campCompareChart');
  if(chartCanvas){
    const chartRows = [...rows].sort((a,b)=>b.cost-a.cost).slice(0,10);
    window.__campCompareChartInstance = new Chart(chartCanvas, {
      data: {
        labels: chartRows.map(r=>r.campaign.length>10?r.campaign.slice(0,10)+'…':r.campaign),
        datasets: [
          { type:'bar', label:'비용(만원)', data: chartRows.map(r=>Math.round(r.cost)), backgroundColor: 'rgba(255,255,255,0.18)', yAxisID:'y', order:2 },
          { type:'line', label: isDB?'CPA(원)':'ROAS(%)', data: chartRows.map(r=> isDB ? r.cpa : Math.round(r.roas)), borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7c8cff', backgroundColor:'transparent', yAxisID:'y1', order:1, tension:0.3 }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:'index', intersect:false },
        scales: {
          y: { position:'left', ticks:{ color:'#a8abc4', font:{size:10} }, grid:{ color:'rgba(255,255,255,0.06)' } },
          y1: { position:'right', ticks:{ color:'#a8abc4', font:{size:10} }, grid:{ display:false } },
          x: { ticks:{ color:'#a8abc4', font:{size:10} }, grid:{ display:false } }
        },
        plugins: { legend:{ labels:{ color:'#f5f6fa', font:{size:11} } } }
      }
    });
  }

  // 캠페인명 칸이 길 때 마우스 휠(세로 스크롤)로 좌우 이동되게 함
  card.querySelectorAll('.camp-name-scroll').forEach(el=>{
    el.addEventListener('wheel', (e)=>{
      if(el.scrollWidth <= el.clientWidth) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }, { passive:false });
  });
  document.getElementById('monthFilterSelect').onchange = (e)=>{
    monthFilterState[key] = e.target.value;
    compareMonthState[key] = 'AUTO';
    renderCampaignsPage(data);
  };
  document.getElementById('monthPrevBtn').onclick = ()=>{
    const labels = allMonths.map(m=>m.label);
    if(selectedMonth==='ALL') return; // 이미 최하단(전체기간), 더 과거로 갈 곳 없음
    const idx = labels.indexOf(selectedMonth);
    monthFilterState[key] = (idx>0) ? labels[idx-1] : 'ALL';
    compareMonthState[key] = 'AUTO';
    renderCampaignsPage(data);
  };
  document.getElementById('monthNextBtn').onclick = ()=>{
    const labels = allMonths.map(m=>m.label);
    const idx = selectedMonth==='ALL' ? -1 : labels.indexOf(selectedMonth);
    if(idx<labels.length-1){ monthFilterState[key] = labels[idx+1]; compareMonthState[key] = 'AUTO'; renderCampaignsPage(data); }
  };
  document.getElementById('compareFilterSelect').onchange = (e)=>{
    compareMonthState[key] = e.target.value;
    renderCampaignsPage(data);
  };
  document.querySelectorAll('th[data-field]').forEach(th=>{
    th.onclick = ()=>{
      const field = th.dataset.field;
      if(sort.field===field){ sort.dir = sort.dir==='desc' ? 'asc' : 'desc'; }
      else { sort.field = field; sort.dir = 'desc'; }
      renderCampaignsPage(data);
    };
  });
  document.querySelectorAll('.pin-star-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const campaign = btn.dataset.campaign;
      const isPinned = pinnedSet.has(campaign);
      try{
        const id = key.replace(/^client:/,'');
        const op = isPinned ? firebase.firestore.FieldValue.arrayRemove(campaign) : firebase.firestore.FieldValue.arrayUnion(campaign);
        await userClientsRef().doc(id).update({ pinnedCampaigns: op });
        const fresh = await getClient(key);
        if(fresh) renderCampaignsPage(fresh);
      }catch(e){ console.error(e); }
    };
  });
  document.querySelectorAll('.applied-toggle-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const k = btn.dataset.key;
      const isApplied = btn.dataset.applied==='1';
      btn.disabled = true;
      try{
        const id = key.replace(/^client:/,'');
        const op = isApplied ? firebase.firestore.FieldValue.arrayRemove(k) : firebase.firestore.FieldValue.arrayUnion(k);
        await userClientsRef().doc(id).update({ appliedSuggestions: op });
        const fresh = await getClient(key);
        if(fresh) renderCampaignsPage(fresh);
      }catch(e){ console.error(e); btn.disabled = false; }
    };
  });
  renderFilterPanel(key, data, campaignList, allTypes, renderCampaignsPage);
}

function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>`
        <label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${fstate.types.has(t)?'checked':''}> ${campaignTypeLabel(t)}</label>
      `).join('')}
    </div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인명</div>
      <input id="campaignSearchInput" type="text" placeholder="🔍 캠페인명 검색..." style="width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;margin-bottom:7px;">
      <div class="filter-campaign-list">
      ${campaignList.map(c=>`
        <label class="filter-item" data-campaign-label="${c.campaign.replace(/"/g,'&quot;')}"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${c.campaign}</label>
      `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" id="filterSelectAllBtn" style="flex:1;">전체 선택</button>
      <button class="btn btn-ghost" id="filterDeselectAllBtn" style="flex:1;">전체 해제</button>
    </div>
  `;
  const searchInput = document.getElementById('campaignSearchInput');
  if(searchInput){
    searchInput.oninput = ()=>{
      const q = searchInput.value.trim().toLowerCase();
      panel.querySelectorAll('.filter-campaign-list label[data-campaign-label]').forEach(label=>{
        const name = (label.getAttribute('data-campaign-label')||'').toLowerCase();
        label.style.display = (!q || name.includes(q)) ? '' : 'none';
      });
    };
  }
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>c.type===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>c.type===t).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterSelectAllBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
  document.getElementById('filterDeselectAllBtn').onclick = ()=>{
    fstate.types = new Set();
    fstate.campaigns = new Set();
    renderFn(data);
  };
}


auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('authUserEmail').textContent = user.email;
    currentUserEmail = user.email;
    isAdminUser = await checkIsAdmin(user.email);
    const inputLink = document.querySelector('a[href="input.html"]');
    if(inputLink) inputLink.style.display = isAdminUser ? '' : 'none';
    await refreshTabs();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

if(FIREBASE_CONFIG.apiKey.includes('여기에')){
  document.getElementById('authScreen').innerHTML = `
    <div class="empty-state">
      <div style="font-size:28px;">⚠️</div>
      <div style="color:#ff5d7a;font-weight:600;">Firebase 설정이 아직 입력되지 않았어요.</div>
      <div>파일 상단의 FIREBASE_CONFIG 값을 본인의 Firebase 프로젝트 값으로 채워주세요.</div>
    </div>`;
}
</script>
