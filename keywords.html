<script>
let activeSlug = null;
const filterState = {};
const monthFilterState = {};
function slugify(name){ return name.trim().replace(/[\s\/\\'"]+/g,'_'); }
function fmtWon(man){ return Math.round(man*10000).toLocaleString('ko-KR'); }
function fmtMan(man){ return man>=10000 ? (man/10000).toFixed(man%10000===0?0:1)+'억' : Math.round(man).toLocaleString('ko-KR')+'만'; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }

function randomAccentColor(){
  const hue = Math.floor(Math.random()*360);
  const sat = 60 + Math.random()*15;
  const light = 52 + Math.random()*10;
  return hslToHex(hue, sat, light);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function contrastText(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#12131c' : '#ffffff';
}
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = w / (Math.max(vals.length-1,1));
  return vals.map((v,i)=>{
    const x = i*step;
    const y = h - ((v-min)/range)*h;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function dateKey(d){ return String(d).replace(/\D/g,''); }
function weekdayOf(dateStr){
  // "2026.07.01" -> Date
  const parts = dateStr.split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return dt.getDay(); // 0=Sun..6=Sat
}
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];

/* ---------- 파일 파싱 ---------- */

function showStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg show ' + (type||'');
}

/* ---------- 저장소 (Firestore, 로그인한 팀 전체가 공유) ---------- */

function userClientsRef(){
  if(!auth.currentUser) throw new Error('not signed in');
  return db.collection('clients');
}
async function listClients(){
  try{
    const snap = await userClientsRef().get();
    return snap.docs.map(d=>'client:'+d.id);
  }catch(e){ console.error(e); return []; }
}
async function getClient(key){
  try{
    const id = key.replace(/^client:/,'');
    const doc = await userClientsRef().doc(id).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function setClient(key, data){
  try{
    const id = key.replace(/^client:/,'');
    await userClientsRef().doc(id).set(data);
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ---------- 인증 ---------- */

function authStatus(msg, type){
  const el = document.getElementById('authStatus');
  el.textContent = msg; el.className = 'status-msg show ' + (type||'');
}
document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-pw').value;
  if(!email || !pw){ authStatus('이메일과 비밀번호를 입력해주세요.', 'err'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){ authStatus('로그인 실패: ' + e.message, 'err'); }
};
document.getElementById('logoutBtn').onclick = ()=> auth.signOut();


async function refreshTabs(selectAfter){
  const keys = await listClients();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for(const key of keys){
    const data = await getClient(key);
    if(!data) continue;
    const el = document.createElement('div');
    el.className = 'tab' + (key===activeSlug ? ' active' : '');
    el.innerHTML = `<span class="dot" style="background:${data.color}"></span>${data.name}`;
    el.onclick = ()=>{ activeSlug = key; refreshTabs(); renderKeywordsPage(data); };
    tabs.appendChild(el);
  }
  if(selectAfter){
    activeSlug = selectAfter;
    const data = await getClient(selectAfter);
    if(data){ renderKeywordsPage(data); refreshTabs(); }
  }
}

function ensureFilterState(key, data){
  if(filterState[key]) return filterState[key];
  const campSet = new Set();
  const typeSet = new Set();
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{ campSet.add(c.campaign); typeSet.add(c.type); });
  });
  filterState[key] = { types: new Set(typeSet), campaigns: new Set(campSet) };
  return filterState[key];
}


function mergedCampaignList(data){
  const map = {};
  (data.months||[]).forEach(m=>{
    (m.campaigns||[]).forEach(c=>{
      if(!map[c.campaign]) map[c.campaign] = { type:c.type, campaign:c.campaign };
    });
  });
  return Object.values(map);
}

/* ---------- 렌더링 ---------- */


const keywordPageState = {}; // key -> 'keyword' or 'searchterm'
const kwSortState = {}; // key -> { field, dir }
const wasteSortState = {}; // key -> { field, dir }

function mergeKwRows(months, fstate, field){
  const map = {};
  months.forEach(m=>{
    const byCamp = m[field];
    if(!byCamp) return;
    Object.keys(byCamp).forEach(camp=>{
      if(!fstate.campaigns.has(camp)) return;
      byCamp[camp].forEach(item=>{
        if(!map[item.keyword]) map[item.keyword] = { keyword:item.keyword, cost:0, revenue:0, conv:0 };
        map[item.keyword].cost += item.cost;
        map[item.keyword].revenue += item.revenue;
        map[item.keyword].conv += item.conv;
      });
    });
  });
  return Object.values(map);
}
function mergeKwWaste(months, fstate, field){
  const map = {};
  months.forEach(m=>{
    const byCamp = m[field];
    if(!byCamp) return;
    Object.keys(byCamp).forEach(camp=>{
      if(!fstate.campaigns.has(camp)) return;
      byCamp[camp].forEach(item=>{
        const k = item.keyword+'|'+camp;
        if(!map[k]) map[k] = { keyword:item.keyword, campaign:camp, cost:0 };
        map[k].cost += item.cost;
      });
    });
  });
  return Object.values(map);
}
function mergeKwExpand(months, fstate, field){
  const map = {};
  months.forEach(m=>{
    const byCamp = m[field];
    if(!byCamp) return;
    Object.keys(byCamp).forEach(camp=>{
      if(!fstate.campaigns.has(camp)) return;
      byCamp[camp].forEach(item=>{
        const k = item.keyword+'|'+camp;
        if(!map[k]) map[k] = { keyword:item.keyword, campaign:camp, cost:0, revenue:0, conv:0 };
        map[k].cost += item.cost; map[k].revenue += (item.revenue||0); map[k].conv += (item.conv||0);
      });
    });
  });
  return Object.values(map);
}

function renderKeywordsPage(data){
  const key = 'client:' + slugify(data.name);
  const fstate = ensureFilterState(key, data);
  document.documentElement.style.setProperty('--accent', data.color);
  const allMonths = data.months || [];
  if(!(key in monthFilterState)) monthFilterState[key] = 'ALL';
  const selectedMonth = monthFilterState[key];
  const months = selectedMonth==='ALL' ? allMonths : allMonths.filter(m=>m.label===selectedMonth);
  const campaignList = mergedCampaignList(data);
  const allTypes = [...new Set(campaignList.map(c=>c.type))];
  const isDB = data.bizType === 'DB';
  const hasShoppingData = allMonths.some(m=>m.searchTermsByCampaign && Object.keys(m.searchTermsByCampaign).length);
  const hasBrandData = allMonths.some(m=>m.brandKeywordsByCampaign && Object.keys(m.brandKeywordsByCampaign).length);

  const MODE_FIELD = { powerlink:'keywordsByCampaign', shopping:'searchTermsByCampaign', brand:'brandKeywordsByCampaign' };
  const MODE_WASTE_FIELD = { powerlink:'wasteKeywordsByCampaign', shopping:'wasteSearchTermsByCampaign', brand:'wasteBrandKeywordsByCampaign' };
  const MODE_LABEL = { powerlink:'파워링크 키워드', shopping:'쇼핑검색 검색어', brand:'브랜드검색 키워드' };
  if(!(key in keywordPageState)) keywordPageState[key] = 'powerlink';
  const mode = keywordPageState[key];

  if(!(key in kwSortState)) kwSortState[key] = { field:'default', dir:'desc' };
  if(!(key in wasteSortState)) wasteSortState[key] = { field:'cost', dir:'desc' };
  const sort = kwSortState[key];
  const wsort = wasteSortState[key];

  let rows = mergeKwRows(months, fstate, MODE_FIELD[mode]);
  rows = rows.map(r=>({ ...r, cpa: r.conv>0 ? Math.round(r.cost*10000/r.conv) : null, roas: r.cost>0 ? (r.revenue/r.cost*100) : 0 }));
  const hasRevenue = rows.some(r=>r.revenue>0);
  function applySort(list, sortState, defaultField){
    const field = sortState.field==='default' ? defaultField : sortState.field;
    const mult = sortState.dir==='asc' ? 1 : -1;
    return [...list].sort((a,b)=>{
      let av=a[field], bv=b[field];
      if(av===null) av = -Infinity; if(bv===null) bv = -Infinity;
      return (av-bv)*mult;
    });
  }
  rows = applySort(rows, sort, hasRevenue?'revenue':'conv').slice(0,50);

  // 전기간 대비 추이 & 신규 키워드 판별용: 기준 기간의 직전 기간 데이터 확보
  let refMonth = selectedMonth!=='ALL' ? allMonths.find(m=>m.label===selectedMonth) : allMonths[allMonths.length-1];
  let prevMonth = null;
  if(refMonth){
    const idx = allMonths.findIndex(m=>m.label===refMonth.label);
    if(idx>0) prevMonth = allMonths[idx-1];
  }
  let prevMap = {};
  if(prevMonth){
    mergeKwRows([prevMonth], fstate, MODE_FIELD[mode]).forEach(r=>{ prevMap[r.keyword] = r; });
  }
  rows = rows.map(k=>{
    const prev = prevMap[k.keyword];
    const isNewKw = !!prevMonth && !prev;
    let trendPct = null;
    if(prevMonth && prev && prev.cost>0){ trendPct = (k.cost-prev.cost)/prev.cost*100; }
    return { ...k, isNewKw, trendPct };
  });

  let waste = [
    ...mergeKwWaste(months, fstate, 'wasteKeywordsByCampaign'),
    ...mergeKwWaste(months, fstate, 'wasteSearchTermsByCampaign'),
    ...mergeKwWaste(months, fstate, 'wasteBrandKeywordsByCampaign'),
  ];
  waste = applySort(waste, wsort, 'cost').slice(0,50);

  // 확대 추천: 효율은 좋은데 비용이 평균보다 낮은 키워드 (제외추천과 대칭)
  let expand = [
    ...mergeKwExpand(months, fstate, 'expandKeywordsByCampaign'),
    ...mergeKwExpand(months, fstate, 'expandSearchTermsByCampaign'),
    ...mergeKwExpand(months, fstate, 'expandBrandKeywordsByCampaign'),
  ];
  expand = expand.map(e=>({ ...e, cpa: e.conv>0 ? Math.round(e.cost*10000/e.conv) : null, roas: e.cost>0 ? (e.revenue/e.cost*100) : 0 }));
  expand.sort((a,b)=> isDB ? a.cpa-b.cpa : b.roas-a.roas);
  expand = expand.slice(0,50);

  const initial = (data.name||'?').trim().charAt(0);
  const textColor = contrastText(data.color);
  const sortTh = (label, field, state, mode) => `<th data-sort="${mode}" data-field="${field}" style="cursor:pointer;user-select:none;">${label}${state.field===field?(state.dir==='desc'?' ▼':' ▲'):''}</th>`;

  const card = document.getElementById('card');
  card.innerHTML = `
    <header class="rep">
      <div class="idn">
        <div class="icon" style="background:${data.color};color:${textColor}">${initial}</div>
        <div>
          <div class="idn-name">${data.name} <span class="badge">키워드 전용 보기</span></div>
          <div class="period" style="display:flex;align-items:center;gap:8px;">
            <span>${selectedMonth==='ALL' ? '전체 기간' : selectedMonth} 기준 · 캠페인 필터 적용됨</span>
            <select id="monthFilterSelect" style="background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 6px;font-size:11px;">
              <option value="ALL" ${selectedMonth==='ALL'?'selected':''}>전체 기간(누적)</option>
              ${allMonths.map(m=>`<option value="${m.label}" ${selectedMonth===m.label?'selected':''}>${m.label} 만 보기</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    </header>

    <div class="panel">
      <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;">
        <span>🔑 TOP ${MODE_LABEL[mode]} (최대 50개) <span style="font-size:11px;color:var(--muted);font-weight:400;">— 열 제목을 클릭하면 정렬돼요</span></span>
        <div style="display:flex;gap:6px;">
          <button class="kw-mode-btn" data-mode="powerlink" style="font-size:11px;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:${mode==='powerlink'?'var(--accent)':'var(--panel)'};color:${mode==='powerlink'?'#fff':'var(--muted)'};cursor:pointer;">파워링크</button>
          <button class="kw-mode-btn" data-mode="shopping" style="font-size:11px;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:${mode==='shopping'?'var(--accent)':'var(--panel)'};color:${mode==='shopping'?'#fff':'var(--muted)'};cursor:pointer;${hasShoppingData?'':'opacity:.5;'}">쇼핑검색</button>
          <button class="kw-mode-btn" data-mode="brand" style="font-size:11px;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:${mode==='brand'?'var(--accent)':'var(--panel)'};color:${mode==='brand'?'#fff':'var(--muted)'};cursor:pointer;${hasBrandData?'':'opacity:.5;'}">브랜드검색</button>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>키워드/검색어</th>
          ${sortTh('비용','cost',sort,'top')}
          ${isDB ? sortTh('전환수','conv',sort,'top') : sortTh('전환매출','revenue',sort,'top')}
          ${sortTh('CPA','cpa',sort,'top')}
          ${!isDB ? sortTh('ROAS','roas',sort,'top') : ''}
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(k=>{
            const badge = `${k.isNewKw ? '<span style="margin-left:6px;font-size:9px;padding:1px 6px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;">NEW</span>' : ''}${(!k.isNewKw && k.trendPct!==null && Math.abs(k.trendPct)>=5) ? `<span style="margin-left:6px;font-size:10px;color:${k.trendPct>0?'var(--up)':'var(--down)'};font-weight:700;">${k.trendPct>0?'▲':'▼'}${Math.abs(k.trendPct).toFixed(0)}%</span>` : ''}`;
            return isDB ? `
            <tr><td class="kw-name">${k.keyword}${badge}</td><td>${fmtWon(k.cost)}원</td><td>${k.conv}건</td><td>${k.cpa!==null?k.cpa.toLocaleString('ko-KR'):'-'}원</td></tr>
          ` : `
            <tr><td class="kw-name">${k.keyword}${badge}</td><td>${fmtWon(k.cost)}원</td><td>${fmtWon(k.revenue)}원</td><td>${k.cpa!==null?k.cpa.toLocaleString('ko-KR'):'-'}원</td><td>${k.roas.toFixed(0)}%</td></tr>
          `;}).join('') : `<tr><td colspan="5" style="color:var(--muted);">표시할 데이터가 없어요.</td></tr>`}
        </tbody>
      </table>
      ${prevMonth ? `<div style="margin-top:8px;font-size:10.5px;color:var(--muted);">직전 기간(${prevMonth.label}) 대비 5%이상 변동만 표시, 직전 기간에 없던 키워드는 NEW로 표시돼요.</div>` : ''}
    </div>

    <div class="panel" style="margin-top:18px;border-left:3px solid var(--up);">
      <div class="panel-title">📈 확대 추천 전체 목록 (최대 50개) <span style="font-size:11px;color:var(--muted);font-weight:400;">— 효율은 좋은데 평균보다 비용을 적게 쓰고 있는 키워드 (입찰가·예산 확대 검토)</span></div>
      <table>
        <thead><tr><th>키워드/검색어</th><th>캠페인</th><th>비용</th>${isDB ? '<th>CPA</th>' : '<th>ROAS</th>'}</tr></thead>
        <tbody>
          ${expand.length ? expand.map(e=>`<tr><td class="kw-name">${e.keyword}</td><td style="color:var(--muted);font-size:12px;">${e.campaign}</td><td>${fmtWon(e.cost)}원</td><td style="color:var(--up);font-weight:700;">${isDB ? (e.cpa!==null?e.cpa.toLocaleString('ko-KR')+'원':'-') : e.roas.toFixed(0)+'%'}</td></tr>`).join('') : `<tr><td colspan="4" style="color:var(--muted);">확대 추천 후보가 없어요.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="panel" style="margin-top:18px;border-left:3px solid var(--down);">
      <div class="panel-title">🚫 제외 추천 전체 목록 (최대 50개) <span style="font-size:11px;color:var(--muted);font-weight:400;">— 비용만 쓰고 전환 0건, 또는 ROAS가 낮거나(B2C) CPA가 평균의 2배 이상인(DB) 저효율 키워드</span></div>
      <table>
        <thead><tr><th>키워드/검색어</th><th>캠페인</th>${sortTh('비용','cost',wsort,'waste')}</tr></thead>
        <tbody>
          ${waste.length ? waste.map(w=>`<tr><td class="kw-name">${w.keyword}</td><td style="color:var(--muted);font-size:12px;">${w.campaign}</td><td style="color:var(--down);font-weight:700;">${fmtWon(w.cost)}원</td></tr>`).join('') : `<tr><td colspan="3" style="color:var(--muted);">제외 추천 후보가 없어요.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('monthFilterSelect').onchange = (e)=>{
    monthFilterState[key] = e.target.value;
    renderKeywordsPage(data);
  };
  document.querySelectorAll('.kw-mode-btn').forEach(btn=>{
    btn.onclick = ()=>{ keywordPageState[key] = btn.dataset.mode; renderKeywordsPage(data); };
  });
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      const field = th.dataset.field;
      const stateObj = th.dataset.sort==='top' ? kwSortState[key] : wasteSortState[key];
      if(stateObj.field===field){ stateObj.dir = stateObj.dir==='desc' ? 'asc' : 'desc'; }
      else { stateObj.field = field; stateObj.dir = 'desc'; }
      renderKeywordsPage(data);
    };
  });
  renderFilterPanel(key, data, campaignList, allTypes, renderKeywordsPage);
}

function renderFilterPanel(key, data, campaignList, allTypes, renderFn){
  renderFn = renderFn || renderCard;
  const fstate = filterState[key];
  const mount = document.getElementById('mainLayout');
  let panel = document.getElementById('filterPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'filter-panel';
    panel.id = 'filterPanel';
    mount.children[1].replaceWith(panel);
  }
  panel.innerHTML = `
    <div class="filter-head">필터</div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인 유형</div>
      ${allTypes.map(t=>`
        <label class="filter-item"><input type="checkbox" data-kind="type" value="${t}" ${fstate.types.has(t)?'checked':''}> ${t}</label>
      `).join('')}
    </div>
    <div class="filter-group">
      <div class="filter-group-title">캠페인명</div>
      ${campaignList.map(c=>`
        <label class="filter-item"><input type="checkbox" data-kind="campaign" value="${c.campaign}" ${fstate.campaigns.has(c.campaign)?'checked':''}> ${c.campaign}</label>
      `).join('')}
    </div>
    <button class="btn btn-ghost" id="filterResetBtn">필터 재설정</button>
  `;
  panel.querySelectorAll('input[data-kind="type"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.types.add(cb.value); else fstate.types.delete(cb.value);
      // 유형 체크에 맞춰 해당 유형의 캠페인들도 함께 토글
      campaignList.filter(c=>c.type===cb.value).forEach(c=>{
        if(cb.checked) fstate.campaigns.add(c.campaign); else fstate.campaigns.delete(c.campaign);
      });
      renderFn(data);
    };
  });
  panel.querySelectorAll('input[data-kind="campaign"]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) fstate.campaigns.add(cb.value); else fstate.campaigns.delete(cb.value);
      // 캠페인명 체크에 맞춰 유형 체크박스 표시도 동기화 (그 유형의 캠페인이 하나라도 선택돼 있으면 유형도 선택된 것으로 표시)
      allTypes.forEach(t=>{
        const campsOfType = campaignList.filter(c=>c.type===t).map(c=>c.campaign);
        const anySelected = campsOfType.some(c=>fstate.campaigns.has(c));
        if(anySelected) fstate.types.add(t); else fstate.types.delete(t);
      });
      renderFn(data);
    };
  });
  document.getElementById('filterResetBtn').onclick = ()=>{
    fstate.types = new Set(allTypes);
    fstate.campaigns = new Set(campaignList.map(c=>c.campaign));
    renderFn(data);
  };
}


auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('authUserEmail').textContent = user.email;
    await refreshTabs();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

if(FIREBASE_CONFIG.apiKey.includes('여기에')){
  document.getElementById('authScreen').innerHTML = `
    <div class="empty-state">
      <div style="font-size:28px;">⚠️</div>
      <div style="color:#ff5d7a;font-weight:600;">Firebase 설정이 아직 입력되지 않았어요.</div>
      <div>파일 상단의 FIREBASE_CONFIG 값을 본인의 Firebase 프로젝트 값으로 채워주세요.</div>
    </div>`;
}
</script>
